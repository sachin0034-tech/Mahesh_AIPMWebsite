<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — MyAI Community project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ---- Primer base (unchanged) ---- */
body{margin:0;background:#f4f4f5;color:#09090b;font-family:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#09090b;text-decoration:none}
a:hover{color:#8a5305}
*{box-sizing:border-box}
[hidden]{display:none!important}

/* ---- Primer components, as classes ---- */
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:24px 0}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:50%;background:#09090b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:-0.03em;font-size:18px}
.brand b{font-weight:600;font-size:16px}
.brand small{font-size:13px;color:#71717a}
.navlinks{display:flex;gap:8px 28px;font-size:14px;font-weight:500;flex-wrap:wrap;white-space:nowrap}
.navcta{display:flex;gap:10px;align-items:center}
/* site nav: identical to the community landing page */
.sn{position:sticky;top:0;z-index:60;background:rgba(244,244,245,.72);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);box-shadow:0 1px 0 0 rgba(9,9,11,.05)}
.sn-w{max-width:1200px;margin:0 auto;padding:0 24px}
.sn-in{display:flex;align-items:center;gap:22px;height:70px}
.sn-logo{display:inline-flex;flex-direction:column;justify-content:center;font-size:15px;font-weight:700;line-height:.94;letter-spacing:-.015em;text-transform:uppercase;color:#09090b}
.sn-logo span{display:block}
.sn-links{display:flex;gap:4px;margin-left:22px}
.sn-links a{position:relative;font-size:13px;font-weight:500;letter-spacing:.07em;color:#09090b;padding:9px 15px;border-radius:10000px;background:#fff;box-shadow:inset 0 0 0 1px #ececee}
.sn-cta{margin-left:auto;display:flex;align-items:center;gap:10px}
section[id]{scroll-margin-top:84px}
@media (max-width:900px){.sn-links{display:none}}
@media (max-width:620px){.sn-w{padding:0 18px}.sn-cta .nb-ghost{display:none}}
/* nav buttons: same design system as the community nav (PROJECT LOGIN / ADMIN LOGIN) */
.nb{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;
  padding:10px 20px;border-radius:10000px;transition:.24s cubic-bezier(.22,1,.36,1)}
.nb-ghost{color:#3f3f46;border:1px solid #d4d4d8;background:#fff}
.nb-ghost:hover{border-color:#3f3f46;color:#09090b}
.nb-dark{background:#09090b;color:#fff;border-radius:14px;padding:11px 18px;
  box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.5),inset 0 9px 14px -5px rgba(117,123,133,.4),0 0 0 1.5px rgb(44,46,52),0 4px 6px 0 rgba(0,0,0,.14)}
.nb-dark:hover{color:#fff;transform:translateY(-1px)}
.nb.lg{font-size:15px;padding:13px 24px}
.nb-dark.lg{padding:13px 22px}
.btn-p{background:#02245b;color:#fff;padding:15px 26px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-family:inherit}
.btn-p:hover{color:#fff;background:#0a3477}
.btn-p.sm{padding:11px 20px;font-size:14px}
.btn-o{border:1.5px solid #09090b;padding:14px 26px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}

.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:56px;align-items:center;padding:72px 0 80px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;color:#52525b}
.dot{width:7px;height:7px;border-radius:50%;background:#fca93d;display:inline-block;box-shadow:0 0 0 4px rgba(252,169,61,.15);flex:none}
h1{margin:20px 0 0;font-weight:600;font-size:clamp(44px,6vw,76px);line-height:1.02;letter-spacing:-0.04em;text-wrap:balance;overflow-wrap:anywhere}
h1.long{font-size:clamp(36px,4.6vw,56px)}
.lede{margin:24px 0 0;max-width:470px;font-size:17px;line-height:1.6;color:#52525b;text-wrap:pretty}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.byline{display:flex;align-items:center;gap:10px;margin-top:28px;font-size:14px;color:#52525b;flex-wrap:wrap}
.byline b{color:#09090b;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:#02245b;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

.visual{position:relative;min-height:520px}
.shot{position:absolute;inset:20px 40px 0 80px;border-radius:24px;border:1px solid #ececee;overflow:hidden;background:#fafafa}
.shot .bg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(26px);opacity:.55}
.shot .img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.shot.cover{background:#02245b;border-color:#02245b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px),radial-gradient(90% 80% at 100% 0%,rgba(252,169,61,.28),transparent 60%);background-size:18px 18px,100% 100%}
.shot.cover .m{width:68px;height:68px;border-radius:20px;background:#fca93d;color:#2b1a04;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:600}
.shot.cover b{font-size:clamp(26px,2.8vw,36px);font-weight:600;letter-spacing:-0.03em;line-height:1.1}
.chips{position:absolute;top:70px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:2}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #ececee;border-radius:999px;padding:8px 14px 8px 8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.tick{width:18px;height:18px;border-radius:50%;background:#09090b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.fcard{position:absolute;left:0;bottom:60px;width:230px;background:#fff;border:1px solid #ececee;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.07);z-index:2}
.fcard .h{font-size:13px;font-weight:600}
.fcard .who{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;color:#8a5305;border:1px solid rgba(252,169,61,.55);background:rgba(252,169,61,.15);padding:3px 9px;border-radius:999px;white-space:nowrap}
.acard{position:absolute;right:10px;bottom:0;width:170px;background:#fca93d;color:#2b1a04;border-radius:18px;padding:16px;z-index:2}
.acard .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.acard .v{font-weight:600;letter-spacing:-0.03em;font-size:30px;line-height:1.1;margin-top:6px}
.acard .v.sm{font-size:18px;line-height:1.2}
.acard .s{font-size:12px;line-height:1.35;margin-top:4px}

.tag-o{display:inline-block;border:1px solid #09090b;border-radius:999px;padding:3px 10px;font-size:12px}
.tag-a{display:inline-block;background:#fca93d;color:#2b1a04;padding:5px 11px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.05em}
h2{margin:18px 0 0;font-weight:600;font-size:clamp(36px,4.4vw,52px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance}
.sec{padding:120px 0 0}
.sec-lede{margin:18px 0 0;max-width:620px;font-size:17px;line-height:1.6;color:#52525b}
.center{text-align:center;max-width:720px;margin:0 auto}
.center h2{margin-top:0}

/* demo */
.player{margin-top:40px;aspect-ratio:16/9;border-radius:24px;border:1px solid #ececee;position:relative;overflow:hidden;background:#02245b}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;border:0;padding:0;cursor:pointer;font-family:inherit;background:transparent;color:#fff}
.poster .bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(30px);opacity:.6}
.poster .img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,36,91,.05),rgba(2,36,91,.45))}
.poster .play{position:relative;z-index:1;width:72px;height:72px;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.poster:hover .play{transform:scale(1.06)}
.poster .cap{position:relative;z-index:1;font-size:14px;font-weight:500}
.pbadge{position:absolute;left:18px;top:18px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:#fca93d;color:#2b1a04;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;max-width:calc(100% - 36px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* product rows (Primer feature rows) */
.row{margin-top:20px;background:#fff;border:1px solid #ececee;border-radius:36px;padding:clamp(32px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:48px;align-items:center}
.row:first-child{margin-top:56px}
.row.solo{grid-template-columns:minmax(0,1fr)}
.row h3{margin:20px 0 0;font-weight:600;font-size:clamp(28px,3.2vw,40px);line-height:1.15;text-wrap:pretty}
.row h3.long{font-size:clamp(22px,2.2vw,28px);line-height:1.35}
.row p{margin:18px 0 0;max-width:560px;font-size:16px;line-height:1.65;color:#52525b}
.row.solo p{max-width:880px}
.row .flip{order:2}
.rlist{background:#f4f4f5;border-radius:24px;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:12px}
.rlist .it{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.55;color:#27272a}
.rlist .it b{color:#09090b}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.flow span.s{display:inline-flex;align-items:center;gap:8px;background:#f4f4f5;border-radius:999px;padding:8px 14px 8px 8px;font-size:14px;font-weight:500}
.flow em{font-style:normal;width:22px;height:22px;border-radius:50%;background:#fca93d;color:#2b1a04;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.flow i{font-style:normal;color:#a1a1aa}
.more-btn{margin-top:18px;background:none;border:0;padding:0;font:inherit;font-size:15px;font-weight:600;border-bottom:1.5px solid #09090b;cursor:pointer}
.clamp{max-height:240px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.cards{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:#fff;border:1px solid #ececee;border-radius:24px;padding:32px}
.card .t{font-size:17px;font-weight:600}
.card p{margin:10px 0 0;font-size:15px;line-height:1.6;color:#52525b}
.card .n{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#71717a}

/* how it's built (Primer strip) */
.strip{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-top:1px solid #09090b}
.strip > div{padding:28px;border-left:1px solid #ececee}
.strip > div:first-child{padding-left:0;border-left:0}
.strip .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#71717a}
.strip .t{font-weight:600;letter-spacing:-0.03em;font-size:30px;margin-top:12px;line-height:1.15}
.strip .t.sm{font-size:20px;letter-spacing:-0.01em;line-height:1.3}
.strip p{margin:10px 0 0;font-size:15px;line-height:1.6;color:#52525b}
.res{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.rcard{background:#fff;border:1px solid #ececee;border-radius:24px;padding:24px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s}
.rcard:hover{border-color:#09090b;color:#09090b}
.rcard .t{font-size:17px;font-weight:600}
.rcard .s{font-size:13px;color:#71717a;margin-top:2px}
.incl{margin-top:16px;background:#fff;border:1px solid #ececee;border-radius:24px;padding:32px}
.incl .t{font-size:17px;font-weight:600}
.incl ul{margin:16px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px 28px}
.incl li{display:flex;gap:10px;font-size:15px;line-height:1.5;color:#27272a;overflow-wrap:anywhere}
.incl li::before{content:"✓";color:#8a5305;font-weight:700}
.incl a{text-decoration:underline}
.incl .sub{margin:22px 0 0;font-size:15px;font-weight:600;color:#09090b}
.incl .ip{margin:12px 0 0;font-size:15px;line-height:1.6;color:#52525b}
.incl .flow{margin-top:14px}
#product .incl{margin-top:16px}

/* request a demo */
.req{margin-top:40px;background:#fff;border:1px solid #ececee;border-radius:36px;padding:clamp(32px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:48px;align-items:start}
.req h3{margin:20px 0 0;font-weight:600;font-size:clamp(32px,3.6vw,44px);line-height:1.1}
.req .p{margin:18px 0 0;max-width:440px;font-size:16px;line-height:1.65;color:#52525b}
.req ul{margin:24px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.req li{display:flex;align-items:center;gap:10px;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.w{grid-column:1 / -1}
.fld span{font-size:13px;font-weight:600;color:#3f3f46}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;color:#09090b;background:#f4f4f5;border:1px solid #ececee;border-radius:14px;padding:12px 14px;width:100%;outline:none}
.fld textarea{resize:vertical;min-height:90px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#02245b;background:#fff}
.fld.err input{border-color:#d6336c;background:#fff5f8}
.form .btn-p{grid-column:1 / -1;justify-content:center;margin-top:4px}
.fine{grid-column:1 / -1;margin:0;font-size:12px;color:#71717a;line-height:1.5}
.status{grid-column:1 / -1;font-size:14px;color:#b4234f}
.done{grid-column:1 / -1;text-align:center;padding:40px 10px}
.done .ok{width:56px;height:56px;border-radius:50%;background:#fca93d;color:#2b1a04;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.done b{display:block;margin-top:14px;font-size:22px}
.done p{margin:8px auto 0;max-width:360px;font-size:15px;line-height:1.6;color:#52525b}

/* builder band (Primer) */
.band{margin-top:120px;background:#02245b;color:#fff}
.band .in{max-width:1240px;margin:0 auto;padding:96px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:64px;align-items:end}
.band .q{margin:24px 0 0;font-size:clamp(20px,2.2vw,26px);line-height:1.4;font-weight:500;text-wrap:pretty}
.band .bv{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;background:repeating-linear-gradient(135deg,#1a3a72 0 6px,#24467f 6px 12px);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff}
.band .nm{font-weight:600;letter-spacing:-0.03em;font-size:32px;line-height:1.1}
.band .rl{font-size:14px;color:#c3d0e8;margin-top:4px}
.btn-w{background:#fff;color:#09090b;padding:13px 22px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}

/* more projects */
.mgrid{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.mc{background:#fff;border:1px solid #ececee;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.mc:hover{color:#09090b;border-color:#09090b}
.mc .th{position:relative;aspect-ratio:16/10;background:#02245b;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:22px;padding:16px;text-align:center}
.mc .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc .th .bdg{position:absolute;left:12px;top:12px;z-index:1;background:#fca93d;color:#2b1a04;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px}
.mc .bd{padding:20px 22px 22px}
.mc .mt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#71717a}
.mc h4{margin:6px 0 0;font-size:20px;font-weight:600}
.mc .by{margin-top:10px;font-size:13px;color:#52525b}

/* footer (Primer) */
footer{margin:120px 0 0;padding:0 0 64px}
footer hr{border:0;border-top:1px solid #d4d4d8;margin:24px 0 28px}
.frow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px}
.ftag{background:#fff;border:1px solid #ececee;border-radius:12px;padding:5px 10px;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:#424242}
.fav{width:80px;height:80px;border-radius:50%;flex:none;object-fit:cover;background:repeating-linear-gradient(135deg,#ececec 0 8px,#f6f6f6 8px 16px);border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#71717a}
.li{display:flex;align-items:center;gap:10px;height:44px;padding:0 20px;background:#0a66c2;color:#fff;font-size:15px;font-weight:600;border-radius:22px}
.li:hover{color:#fff}

/* phones */
@media (max-width:720px){
  .wrap{padding:0 16px}
  .navlinks{display:none}
  .hero{padding:40px 0 56px;gap:32px}
  .visual{min-height:0;display:flex;flex-direction:column;gap:12px}
  .shot{position:relative;inset:auto;aspect-ratio:4/3}
  .chips{position:static;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .fcard,.acard{position:static;width:auto}
  .sec{padding-top:72px}
  .row .flip{order:0}
  .form{grid-template-columns:minmax(0,1fr)}
  .strip > div{padding-left:0;border-left:0;border-bottom:1px solid #ececee}
  .band{margin-top:72px}.band .in{padding:64px 16px}
  footer{margin-top:72px}
}
/* ---- compact spacing (minimal gaps) ---- */
.nav{padding:16px 0}
.hero{padding:28px 0 36px;gap:40px}
.visual{min-height:440px}
.shot{inset:16px 32px 0 64px}
.chips{top:46px}
.fcard{bottom:44px}
h1{margin-top:14px}
.lede{margin-top:16px}
.ctas{margin-top:24px}
.sec{padding:48px 0 0}
h2{margin-top:12px;font-size:clamp(30px,3.4vw,42px)}
.center h2{margin-top:10px}
.player{margin-top:20px}
.row{margin-top:14px;padding:clamp(20px,3vw,36px);gap:28px;border-radius:28px}
.row:first-child{margin-top:24px}
.row h3{margin-top:12px;font-size:clamp(24px,2.6vw,32px)}
.row p{margin-top:10px}
.rlist{padding:16px;gap:8px;border-radius:20px}
.rlist .it{padding:10px 12px;align-items:center}
.strip{margin-top:20px}
.strip > div{padding:18px 20px}
.strip .t{font-size:24px;margin-top:10px}.strip .t.sm{font-size:18px}
.res{margin-top:14px;gap:12px}
.rcard{padding:16px 18px;justify-content:flex-start;gap:14px}
.incl{margin-top:12px;padding:20px 24px}
.incl .t{display:flex;align-items:center;gap:10px}
.incl ul{margin-top:12px}
.cards{margin-top:14px;gap:12px}
.card{padding:20px 22px}
.card .t{display:flex;align-items:center;gap:10px}
.card.lc{display:flex;gap:14px;align-items:flex-start}
.band{margin-top:48px}
.band .in{padding:48px 32px;gap:32px;align-items:center}
.band .q{margin-top:14px}
.mgrid{margin-top:20px;gap:12px}
footer{margin:40px 0 0;padding:0 0 32px}
footer hr{margin:16px 0 20px}
.tag-a{display:inline-flex;align-items:center;gap:6px}

/* ---- icon tiles ---- */
.ic{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid}
.ic.c0{background:#fff1dc;border-color:#ffd9a3;color:#c26a00}
.ic.c1{background:#e6eeff;border-color:#c7d7ff;color:#2457d6}
.ic.c2{background:#ddf6ea;border-color:#b5e9d0;color:#13865a}
.ic.c3{background:#efe8ff;border-color:#d8c9ff;color:#6d3fd8}
.ic.c4{background:#ffe6ec;border-color:#ffc6d3;color:#d6336c}
.ic.c5{background:#dcf4f7;border-color:#b2e4ea;color:#0e7d8c}
.rlist .ic{width:32px;height:32px;border-radius:10px}
.strip .k{display:flex;align-items:center;gap:10px}
.strip .k .ic{width:30px;height:30px;border-radius:9px}

/* heading + list → icon-card grid */
.row.stack{grid-template-columns:minmax(0,1fr);gap:18px}
.rhead h3{margin-top:10px}
.igrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.icard{display:flex;gap:14px;align-items:flex-start;background:#f4f4f5;border-radius:18px;padding:16px 18px}
.icard b{display:block;font-size:16px;font-weight:600;margin-bottom:2px}
.icard span{font-size:15px;line-height:1.55;color:#3f3f46}

/* demo: LinkedIn bar under the player */
.ctabar{margin-top:0;background:#fff;border:1px solid #ececee;border-radius:20px;padding:14px 16px 14px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cb-t{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.cb-t b{font-size:16px}
.ctabar.big{padding:20px 22px 20px 20px;gap:18px;border-radius:24px}
.ctabar.big .ic{width:48px;height:48px;border-radius:14px}
.ctabar.big .cb-t b{font-size:20px;letter-spacing:-0.01em}
.ctabar.big .cb-t span{font-size:15px}
.cb-t span{font-size:14px;color:#52525b}
.pbadge svg{flex:none}

/* request a demo (LinkedIn) */
.req{margin-top:0;background:#fff;border:1px solid #ececee;border-radius:28px;padding:clamp(20px,3vw,36px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center}
.req-ill{position:relative;width:150px;height:120px;flex:none}
.req-ill span{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:18px;box-shadow:0 10px 24px rgba(2,36,91,.12)}
.req-ill .r1{left:0;top:10px;width:58px;height:58px;background:#fca93d;color:#2b1a04}
.req-ill .r2{left:40px;top:58px;width:54px;height:54px;background:#e6eeff;color:#2457d6}
.req-ill .r3{right:0;top:0;width:76px;height:76px;background:#0a66c2;border-radius:22px}
.req-t h3{margin:10px 0 0;font-weight:600;font-size:clamp(26px,2.8vw,36px);line-height:1.12}
.req-t p{margin:8px 0 0;font-size:16px;line-height:1.6;color:#52525b;max-width:560px}
.req-by{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:#52525b}
.req-by b{color:#09090b}
.li.big{height:52px;padding:0 24px;font-size:16px;border-radius:26px}
@media (max-width:900px){.req{grid-template-columns:minmax(0,1fr)}.req-ill{display:none}}
/* rate this project */
.rate{background:#fff;border:1px solid #ececee;border-radius:28px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.rate h3{margin:10px 0 0;font-weight:600;font-size:clamp(22px,2.4vw,30px);line-height:1.15}
.rate .btns{display:flex;gap:10px;flex-wrap:wrap}
.rate .vb{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:23px;border:1px solid #d4d4d8;background:#fff;color:#09090b;font:600 15px/1 inherit;font-family:inherit;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.rate .vb:hover:not(:disabled){border-color:#02245b}
.rate .vb[data-vote="up"][aria-pressed="true"]{background:#ddf6ea;border-color:#13865a;color:#13865a}
.rate .vb[data-vote="down"][aria-pressed="true"]{background:#ffe6ec;border-color:#d6336c;color:#d6336c}
.rate .vb:disabled{cursor:default}
.rate .vb:disabled:not([aria-pressed="true"]){opacity:.5}
.rate .note{grid-column:1/-1;margin:0;font-size:13px;color:#71717a}
@media (max-width:720px){.rate{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.shot{inset:auto}.visual{min-height:0}.chips{top:auto}.fcard{bottom:auto}.sec{padding-top:40px}.band{margin-top:40px}.band .in{padding:40px 16px}footer{margin-top:32px}.hero{padding:20px 0 28px}}

/* preview picker (only when no project is passed in) */
.pick{position:fixed;right:16px;bottom:16px;z-index:50;background:#fff;border:1px solid #ececee;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:10px 12px;font-size:12px;color:#71717a;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px)}
.pick select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid #d4d4d8;max-width:240px}

var PREVIEW_PROJECTS = [{"id": "dummy-ledgerly", "title": "Ledgerly", "description": "Ledgerly - AI close agent for small finance teams\n\nLedgerly is an AI agent that closes the month for small finance teams: it reconciles transactions, drafts accruals and flags only the items a human needs to review. Built for finance leads at 10–200 person companies.\n\nTHE PROBLEM\nMonth-end close at small companies is still a manual spreadsheet marathon.\n• Finance leads spend 5–8 days every month matching bank lines to invoices by hand\n• Accruals are rebuilt from memory, so the same mistakes repeat every month\n• Reviewers can't see why a number changed, so every variance turns into a Slack thread\nThese delays lead to late board reports and decisions made on last month's numbers.\nAs more startups move to monthly investor updates, a slow close has never been more visible.\n\nWHO IT'S FOR\nFinance lead or controller\nCompanies with 10–200 employees\nTeams running QuickBooks or Xero with no dedicated close tooling\n\nKEY FEATURES\n• Auto-reconciliation - Matches bank, card and payout lines to invoices and journal entries, with the source document linked\n• Accrual drafts - Proposes recurring and one-off accruals from last month's patterns and open POs\n• Variance explainer - Writes a plain-English reason for every movement over your threshold\n• Review queue - Only the items the agent isn't sure about reach a human, with a suggested fix\n\nHOW IT WORKS\nPulls bank and ledger data → matches and scores each line → drafts accruals and variance notes → routes low-confidence items to a reviewer → publishes the close pack\nBuilt with n8n workflows, Supabase for the ledger snapshot and Claude for matching and explanations.\n\nRESULTS\nPilot with three companies cut close time from 6 days to 2.5 days, with 92% of lines matched automatically.\n\nROADMAP\nNext: multi-entity consolidation and a board-ready report export.", "builder_name": "Alex Rivera", "builder_linkedin": "https://www.l %3D%27608%27%3EWire%20from%20Acme%20Ltd%20%C2%B7%20%2440%2C000.00%3C/text%3E%3Ctext%20x%3D%271080%27%20y%3D%27608%27%20fill%3D%27%23c26a00%27%20font-weight%3D%27700%27%3ENeeds%20a%20human%3C/text%3E%0A%3Crect%20x%3D%27350%27%20y%3D%27650%27%20width%3D%271180%27%20height%3D%2770%27%20rx%3D%2714%27%20fill%3D%27%23f4f4f5%27/%3E%3Ctext%20x%3D%27380%27%20y%3D%27693%27%3EGusto%20payroll%20%C2%B7%20%2458%2C210.44%3C/text%3E%3Ctext%20x%3D%271080%27%20y%3D%27693%27%20fill%3D%27%2313865a%27%20font-weight%3D%27700%27%3EMatched%20to%20JE-118%3C/text%3E%0A%3Crect%20x%3D%27350%27%20y%3D%27735%27%20width%3D%271180%27%20height%3D%2770%27%20rx%3D%2714%27%20fill%3D%27%23f4f4f5%27/%3E%3Ctext%20x%3D%27380%27%20y%3D%27778%27%3EBrex%20card%20%C2%B7%20%242%2C104.90%3C/text%3E%3Ctext%20x%3D%271080%27%20y%3D%27778%27%20fill%3D%27%2313865a%27%20font-weight%3D%27700%27%3EReceipt%20found%3C/text%3E%0A%3C/g%3E%0A%3Ctext%20x%3D%27350%27%20y%3D%27880%27%20font-size%3D%2718%27%20fill%3D%27%2371717a%27%3EEvery%20match%20links%20to%20the%20source%20document%20and%20the%20rule%20that%20made%20it.%3C/text%3E%0A%3C/g%3E%3C/svg%3E", "banner_url": "", "user_image_url": "", "video_link": "https://example.com/ledgerly-demo", "workflow_link": "https://example.com/ledgerly-workflow", "doc_link": "https://docs.google.com/presentation/d/EXAMPLE/edit", "hosted_link": "https://example.com/ledgerly-app", "project_category": "AI Tools", "what_you_learned": "• Confidence scores matter more than accuracy: finance teams trust an agent that says when it isn't sure\n• Linking every match to its source document removed most reviewer pushback\n• n8n sub-workflows kept the reconciliation and accrual logic easy to test separately\n• Starting with one ledger (QuickBooks) made the pilot ship in two weeks", "about_user_description": "Alex spent eight years closing the books at venture-backed startups and built Ledgerly to give small finance teams their last week of every month back.", "whats_included": ["Live product link", "n8n workflow export (reconciliation + accruals)", "Supabase schema", "Eval set: 1,200 labelled transactions", "Pitch deck with pricing and TAM"], "visibility_flags": {}, "sections": [{"section": "top10", "rank": 1, "award_name": null, "cohort_label": null}, {"section": "awards", "rank": 999, "award_name": "Best Use of Agents", "cohort_label": null}, {"section": "cohort10", "rank": 999, "award_name": null, "cohort_label": "Cohort 10"}]}, {"id": "6f64eb5c-0556-4a8a-9580-006ca0467362", "title": "Calm Falcon - AI Signals Intelligence", "description": "VISION\nBecome the decision-support layer for enterprise AI teams, replacing fragmented manual research with evidence-backed signals, themes, and recommendations.\n\nMVP GOAL\nUsing a multi-agent pipeline, CalmFalcon ingests signals from GitHub releases, web research across vendor docs, news, newsletters, and research sources, clusters them into high-confidence themes, and delivers a weekly brief that AI Platform Leaders can act on.\n\nIDEAL CUSTOMER PROFILE\nAI Platform PM / Engineering Leader\nSeries B+ company, $50M+ revenue\nOwns or influences inference stack, orchestration, and governance decisions\n\nPain: spends significant time each week manually tracking changes across the AI ecosystem\nSuccess: saves meaningful time, improves signal quality, and makes faster, better-informed platform decisions\n\nPROBLEMS / PAIN POINTS\nCritical\n\t•\tToo much manual effort spent reviewing GitHub, research, newsletters, and vendor updates\n\t•\tImportant signals, such as model releases or architectural shifts, are easy to miss\n\t•\tNo consistent or auditable process for prioritizing signal importance\n\t•\tRaw signals are not translated into enterprise-relevant context\n\nMajor\n\t•\tHard to turn scattered updates into decision-ready summaries for leadership\n\t•\tWeek-over-week tracking is manual and inconsistent\n\t•\tCitation quality and evidence traceability are difficult to validate at scale\n\nSOLUTIONS\nIngestion\nAggregates signals from GitHub, vendor sources, research, and curated web queries on a weekly basis\n\nClustering\nDeduplicates overlapping updates and groups related signals into emerging themes\n\nScoring\nApplies deterministic confidence scoring based on signal quality, source diversity, and supporting evidence\n\nBrief\nGenerates a concise weekly brief with key themes, why they matter, and recommended actions\n\nOUTCOME\nA web application with a Weekly Themes Dashboard and decision-ready brief that helps enterprise AI teams keep up with a rapidly changing AI ecosystem.\n\nTECH STACK:\nn8n · OpenAI API · Exa API · GitHub API · Supabase · React + Typescript (V0) · Claude Code\n\nRELATED RESEARCH (AI Adoption rising but friction persists):\nhttps://www.atlassian.com/blog/developer/developer-experience-report-2025", "builder_name": "Kamal Bhatia", "builder_linkedin": "https://www.linkedin.com/in/kbhatiatech", "thumbnail_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/thumbnails/1775728466769.jpg", "banner_url": null, "user_image_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-assets/user_images/1775846691070.jpg", "video_link": "https://www.loom.com/share/8339a160d45b4401908bdb1586e57a5b", "workflow_link": "https://drive.google.com/drive/folders/1ldm3WwkgwGgKlYxTWcne2qrBUT0lzoyO?usp=drive_link", "doc_link": "https://gamma.app/docs/Clear-Signals--ilk729qdwzgdxj8", "hosted_link": "https://v0-cf-app-rho.vercel.app/", "project_category": "AI Tools", "what_you_learned": "• How I built my multi-agent AI pipeline in n8n where 4 agents run in sequence and one agent make 8 calls parallely\n• Design a database schema in Supabase (8 tables, production + eval)\n• Use Exa Search API for quality web search with date and category filters\n• Use OpenAI GPT-4 Turbo with JSON mode and temperature tuning\n• Use GitHub API for 3-tier trending (major releases, new repos, velocity spikes)\n• Write structured prompts using RITGE framework (Role/Instruction/Task/Guardrails/Examples)\n• Build a 13-rule automated eval pipeline (deterministic, no LLM)\n• Build an LLM-as-Judge eval pipeline in n8n\n• Design and apply an HHH eval rubric (22 questions across Helpful, Honest, Harmless)\n• Layer deterministic scoring on top of LLM output (confidence calibration in code)\n• Even though i plan to keep it free for power users initially, slides show future value based pricing strategy.\n\n\nMY LEARNINGS FROM JOURNEY SO FAR:\n• One big AI agent failed, four small ones worked. Splitting one do-everything agent into four specialists (select, write, verify, summarize) eliminated made-up product names and citation hallucinations. \n                       \n• Bad data in = bad results out, no matter how good your prompts are. Switching our web search provider fixed more issues than weeks of prompt tweaking because the old one was feeding us wrong dates. \n           \n• Don't trust AI to merge duplicates. Use code instead. Asking the LLM to \"don't repeat vendors\" worked sometimes, failed other times. A simple code rule would've been 100% reliable.  \n                           \n• Keep it simple. Users didn't need five categories. I pivoted to two: act now or watch later. Simplifying our signal classification from five types to just ACT/WATCH made the product instantly clearer and less complex.  \n                    \n• Don’t rely only on the LLM’s own judgment about how confident it is. Instead, add a rule-based or formula-based scoring layer in your application code to judge output quality more reliably.\n                                  \n• Filtering out noise is harder than writing good content. The AI writes great summaries for irrelevant topics. The real challenge is keeping junk out before it reaches the writer. \n                              \n• Run tasks in parallel, check quality in sequence. Writing 8 themes simultaneously cut our pipeline from 8 minutes to 3. Quality checks still need to see all themes together.                                      \n\n• A scoring checklist beats \"does this feel right?\" Our 22-question rubric turned vague feedback into specific, fixable problems with clear before/after tracking.                                               \n\n• Accuracy is fixable with rules. Usefulness depends on your inputs. We got factual accuracy from 53% to 98% through mechanical fixes, but usefulness depends on whether the right signals were ingested in the first place.                                                                                             \n\n• Prompt engineering gets you halfway. The rest is an engineering problem. Going from 0% to 50% quality was all prompt work. Getting from 50% to 80% requires fixing the data pipeline in code.", "about_user_description": "Product leader driving enterprise automation platforms at scale with 17+ years across platform engineering, enterprise software, and UX.", "whats_included": ["SETUP GUIDE(Download and open in browser): https://drive.google.com/file/d/1B3GZRjcK68XyiwHNmrwEh_lxqdrw9JuH/view?usp=sharing", "Database Schema", "Multi-Agent n8n pipeline", "Automated checks eval workflow", "LLM as Judge eval pipeline", "Value based pricing strategy in the slides", "Market Size - TAM/SAM/SOM", "Live Product Link", "Eval Results - Human HHH, Automated and LLM as Judge"], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "3bfae575-71e5-4129-a63b-fecb6ed68a39", "project_id": "6f64eb5c-0556-4a8a-9580-006ca0467362", "section": "top10", "rank": 2, "award_name": null, "cohort_label": null}, {"id": "665ddac3-1142-448f-8cbe-80609683852b", "project_id": "6f64eb5c-0556-4a8a-9580-006ca0467362", "section": "awards", "rank": 999, "award_name": "Most Comprehensive Project", "cohort_label": null}, {"id": "65ba7017-3357-4bf3-99e6-0debb405dda7", "project_id": "6f64eb5c-0556-4a8a-9580-006ca0467362", "section": "cohort8", "rank": 999, "award_name": null, "cohort_label": "Cohort 8"}]}, {"id": "890d19e3-d705-41cb-8531-859a018a1b3a", "title": "TruImpact", "description": "\"Works at Life Cycles (Australia's leading sustainability metrics provider). TruImpact solves the LCA cost barrier —\n  $15K–$60K per SKU puts credible environmental data out of reach for mid-market brands now being asked to assess\n  entire product ranges. Regulatory tailwinds: ISO 14044, AASB S2 (July 2026), EU PPWR, EU Green Transition Directive\n  (Sept 2026). Built multi-agent n8n workflow: webhook ingestion → JavaScript data check → orchestrator managing\n  scoping agent, data gap agent, and results quality card agent, all underpinned by TruImpact's calculation agent.\n  Data moat: proprietary LCI data owned by Life Cycles. Results in minutes with Bronze/Silver/Gold data quality\n  scores. Verification path with human sign-off before publication.\"", "builder_name": "Gabriella Hooper", "builder_linkedin": "https://www.linkedin.com/in/gabriella-hooper/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785412788195.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=EhYmWaaaSVGJ3gzREMY2v98iuwXSCh7zYV7MlQtj2hE%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785412788736.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ktQz3ATfDiasb6idVLATOVbrKB%2FSiViDTSTNIHJLyOw%3D", "video_link": "https://www.loom.com/share/1a312d8af86648769037bd998aae4709", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1-HYVtEVTNMNUy_259sTr6AY2BBpC4PG-/edit?usp=sharing&ouid=104599366997961593111&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "7e7c1537-3b1c-428b-877b-d1499204d277", "project_id": "890d19e3-d705-41cb-8531-859a018a1b3a", "section": "top10", "rank": 3, "award_name": null, "cohort_label": null}, {"id": "9812f324-8790-4464-8191-545d3629afe1", "project_id": "890d19e3-d705-41cb-8531-859a018a1b3a", "section": "awards", "rank": 999, "award_name": "Best Regulated Tech / Compliance AI", "cohort_label": null}, {"id": "267e66b7-79db-410e-a15c-19d2c6e6a6d5", "project_id": "890d19e3-d705-41cb-8531-859a018a1b3a", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "d4aca520-512c-42a4-9bc3-6e7371e856db", "title": "Closet Muse", "description": "\"Mansi built Closet Muse in 3 days after a trip to India delayed her timeline. The problem is personal: it takes her\n  45 minutes every morning just to decide what to wear. Three specific friction points: daily decision fatigue before\n  work, school, dates, or events; forgetting what's buried in the wardrobe (leading to duplicate purchases); and\n  wanting to dress better without spending more time. The market angle: fashion is a $1.6T market by 2030, but\n  everyone is selling new clothes — no one is solving \"\"what can I do with what I already own.\"\" The product features a\n  smart closet catalog (photograph items → AI categorizes by type, color, formality), mood/occasion-based outfit\n  suggestions with weather awareness, calendar integration (Gmail → pre-plan outfits for upcoming meetings), weekly\n  outfit history to avoid repetition, and a packing assistant that generates combination-aware packing lists for\n  travel given destination, dates, and weather forecasts. Outfit suggestions include reasoning (why this combination),\n  fit percentage, and overlay recommendations. Future: cross-brand purchase suggestions for items that would\n  complement the existing wardrobe. Demo showed mood input driving a recommendation with full rationale.\"", "builder_name": "Mansi Jain", "builder_linkedin": "https://www.linkedin.com/in/mansiijain/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788551934069.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=TxRDVTm9qh4KvrsSRe3E1AXyt%2F5VtcEDNyKTqNUVllo%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788551934785.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=pHkKr7Ijen3Smu6BZjfW5NMO%2BEGaWm8cydZp1Tqd5Bw%3D", "video_link": null, "workflow_link": null, "doc_link": "https://gamma.app/docs/ClosetMuse-qrkymaf4l906uoc?mode=doc", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "820659d2-6f6a-40fb-80c8-a7d87b69bbf8", "project_id": "d4aca520-512c-42a4-9bc3-6e7371e856db", "section": "awards", "rank": 999, "award_name": "Scrappy MVP Award", "cohort_label": null}, {"id": "db1dda63-7732-4059-b474-ebae4cd02910", "project_id": "d4aca520-512c-42a4-9bc3-6e7371e856db", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "793cb511-0deb-43a3-9269-2219c1a63d1e", "title": "Property Lease Research AI", "description": "Property Lease Research AI - Agentic AI for Lease Negotiation Intelligence\n\nProperty Lease Research is an AI-powered platform designed to transform fragmented leasing data into clear, CFO-ready negotiation intelligence. Built for modern leasing teams, it replaces outdated benchmarks and manual research with a smarter, faster, and more strategic approach to lease decision-making.\n\nTraditional lease negotiation processes are slow, opaque, and inefficient. Teams often spend 6-8 hours per lease case piecing together incomplete data from multiple sources, relying on stale benchmarks and lacking visibility into critical factors like vacancy trends, tenant churn, and anchor tenant movements. These gaps lead to missed opportunities and significant financial leakage-often costing organizations millions annually. Property Lease Research addresses this challenge with agentic AI that continuously gathers, analyzes, and synthesizes leasing signals into actionable insights. Instead of static summaries, the platform delivers decision-grade intelligence that empowers teams to negotiate with confidence and precision.\n\nAs occupancy costs rise and financial scrutiny from CFOs intensifies, the need for accurate, real-time leasing intelligence has never been greater. Property Lease Research equips organizations with the clarity and speed required to make high-stakes leasing decisions, reduce inefficiencies, and unlock hidden value across their real estate portfolio.\n\nKey Benefits:\n- Eliminate hours of manual lease research\n- Replace outdated benchmarks with real-time intelligence\n- Gain visibility into vacancy, churn, and anchor tenant activity\n- Deliver CFO-ready insights for faster, smarter negotiations\n- Capture cost savings and reduce missed opportunities\n\nProperty Lease Research turns complex leasing data into a competitive advantage - helping teams move from reactive negotiation to proactive, insight-driven strategy.\n\nAgentic AI Solution - It provides an Agentic research assistant that analyzes comps, vacancy shifts, and churn signals. It generates confidence-scored negotiation ranges and produces executive-ready intelligence briefs for lease negotiations.\n\nPlatform Architecture Overview\n\nModern Agentic AI Infrastructure - Built using complex n8n orchestration workflows, v0 UI interface environment, Supabase structured persistence layer, and evaluation-aware signal synthesis pipelines to simulate production-grade enterprise lease decision-intelligence systems. Together, these components simulate a production-style enterprise leasing intelligence environment rather than a standalone document summarization tool.\n\nInterface Layer Architecture (v0 UI Decision Workspace) - \n\nThe v0 UI functions as the operational intelligence surface where users interact with lease signals, benchmarks, and negotiation insights.\n\n1. Dashboard - Provides portfolio-level visibility into active lease cases, upcoming renewals, high-risk leases, savings opportunity pipeline, and workflow activity indicators. Implemented a Claude Copilot Intelligence Workspace that transforms lease data into real-time, context-aware decision intelligence using Supabase-backed memory and conversational AI.\n\n2. Lease Cases Module - Supports structured lease case lifecycle management including lease contract upload, clause intelligence extraction review, risk signal monitoring, negotiation positioning insights, and confidence-scored recommendation outputs\n\n3. Lease Case Detail Intelligence View - Provides deep decision-support visibility across extracted lease clauses, benchmark alignment signals, vacancy and churn indicators, recommended negotiation ranges, and supporting evidence references. This acts as the primary negotiation intelligence workspace.\n\n4. Market Intelligence Module - Synthesizes external leasing signals including comparable property benchmarks, vacancy trend indicators, tenant churn movement patterns, and anchor tenant activity signals\n\n5. Rent Benchmarks Module - Provides structured benchmark intelligence replacing static comparable datasets with signal-driven market positioning inputs.\n\n6. Notifications Module - Supports workflow-triggered alerts including lease case updates, intelligence refresh signals, negotiation brief readiness, and pipeline status changes\n\n7. Data Sources Module - Provides visibility into intelligence inputs supporting market signal ingestion, benchmark datasets, comparable property references, and enrichment workflow sources\n\n8. Pricing Module - Implements a structured subscription intelligence model supporting Explorer tier, Leasing Analyst tier, Portfolio Intelligence tier, and Strategic Negotiation Copilot enterprise tier\n\n9. Settings & User Profile Workspace Layer - Supports structured persistence across organization-level workspace configuration, lease portfolio scope, negotiation workflow continuity, and user intelligence preferences\n\nA Claude Copilot feature is now embedded across every page in the product.\n\nBehavior - Select a lease case from the Lease Cases page. Click on Claude Copilot button to open Claude Copilot panel. It will display the currently selected lease case and inquire about it based on the queries provided in Claude Copilot. Navigate to the bottom of the dashboard to view the Claude Copilot Intelligence Workspace details based on the selected lease case.\n\nClicking the Claude Copilot button opens a right-side Copilot panel. The Copilot dynamically adapts based on: Current page, Selected lease case, and Available data context.\n\nWhat Claude Copilot Does - The Copilot acts as a conversational intelligence interface, allowing users to:\nAsk natural language questions: \nIs rent above market ?\nWhat are the risks ?\nWhat savings opportunities exist ?\nRetrieve: Lease-specific insights, Market benchmarks, Risk signals, and Negotiation strategies\n\nClaude Copilot combines: Structured data from lease_cases, AI-generated intelligence from lease_insights, Real-time reasoning from Claude API, and Fallback logic from deterministic lease analysis\n\nBacked by Supabase workspace tables.\n\nOrchestration Layer Architecture (n8n Multi-Agent Intelligence Pipeline) - \n\nThe platform uses a complex branching orchestration workflow coordinating structured reasoning steps across the lease intelligence lifecycle. This pipeline coordinates: document ingestion, clause extraction, market signal enrichment, benchmark synthesis, risk modeling, confidence scoring, recommended range generation, and executive intelligence brief creation The workflow topology includes sequential and parallel reasoning branches simulating agentic signal synthesis across leasing datasets.\n\nSupabase Intelligence Persistence Architecture (23-Table Schema) - \n\nProperty Lease Research AI uses a structured Supabase relational schema supporting decision-intelligence workflows across the entire lease lifecycle. Lease contracts uploaded through the interface are stored directly in Supabase Storage buckets and automatically trigger downstream extraction and enrichment pipelines. The schema includes the following intelligence layers:\n\n1. Document Intelligence Layer - Stores uploaded lease contracts and extracted clause structures: lease_documents, extracted_terms, and extracted_terms_effective\n\n2. Lease Case Management Layer - Supports structured case lifecycle tracking: lease_cases, and commercial_summaries\n\n3. Market Intelligence Signal Layer - Stores benchmark and comparable property enrichment datasets: market_signals, market_benchmarks, market_intelligence, comparable_properties, and data_sources\n\n4. Risk & Asset Health Modeling Layer - Supports portfolio-level exposure evaluation: risk_scores, and asset_health_signals\n\n5. Confidence Scoring Layer - Supports explainable decision-intelligence outputs confidence_scores\n\n6. Negotiation Intelligence Output Layer - Stores executive-ready leasing strategy outputs: recommended_ranges, negotiation_briefs, and negotiation_brief_evidence\n\n7. Workflow Observability & Execution Tracking Layer - Tracks orchestration pipeline activity: workflow_runs, and analysis_history\n\n8. Workspace & User Intelligence Layer - Supports enterprise deployment readiness: organizations, profiles, user_settings, and notifications \n\nStorage Architecture - \n\nLease contracts uploaded through the interface: are stored in Supabase Storage buckets, linked to lease case records, trigger clause extraction workflows, populate intelligence signal tables, and generate negotiation positioning outputs.\n\nThis creates a repeatable ingestion-to-intelligence pipeline supporting portfolio-scale leasing workflows.\n\nExplore the platform using the links below:\n\nv0 Interface (Product Experience Layer) -                                                               https://v0.app/chat/property-lease-research-dLdkZvVbM33?ref=RSOBAM \n\nn8n Workflow (Agentic Intelligence Orchestration Layer)  -https://harleen21.app.n8n.cloud/workflow/WKFCZoKF9MaWTHIr\n\nEnhancing the existing functionality and developing the next phase of the Property Lease Research AI product.", "builder_name": "Harleen Kaur", "builder_linkedin": "https://www.linkedin.com/in/harleenkaur21/", "thumbnail_url": null, "banner_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-assets/banners/1775828340340.jpg", "user_image_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/user-images/1775647831473.jpg", "video_link": "https://www.loom.com/share/26500403faa348e7849f0d9932a47578", "workflow_link": "https://drive.google.com/file/d/1klXJSDPWWg0msSPrFYX1QOi7nWxmZiCU/view?usp=sharing", "doc_link": "https://prezi.com/view/tN1vrLIBdrclDzdAmMEo/?referral_token=IPtx5XlnB3FN\"", "hosted_link": "https://v0.app/chat/property-lease-research-dLdkZvVbM33?ref=RSOBAM", "project_category": "AI Tools", "what_you_learned": "Key Takeaways - \n\n1. Agentic AI enables negotiation-ready decision intelligence\n\n2. Enterprise leasing requires signal-driven reasoning beyond LLM summaries\n\n3. Evaluation improve agent reliability\n\n4. Explainability increases trust and adoption\n\n5. Multi-agent orchestration strengthens reasoning quality\n\n6. Structured persistence enables repeatable intelligence workflows\n\n7. Portfolio intelligence delivers the highest enterprise value\n\n8. Subscription pricing supports scalable product adoption\n\nSkills Gained -\n\n1. Designing agentic AI workflows using multi-agent n8n orchestration\n\n2. Building interactive dashboards with v0 UI\n\n3. Integrating Supabase for structured intelligence persistence\n\n4. Connecting UI, backend workflows, and database into a unified platform\n\n5. Implementing evaluation-driven AI with negotiation insights\n\n6. Designing subscription-based pricing strategy for enterprise AI products\n\n7. Developing an enterprise-focused AI product roadmap\n\nLearnings -\n\n1. Data ≠ Decision Intelligence - Enterprise teams already have leasing data. The real value comes from transforming fragmented signals into confidence-scored negotiation insights and CFO-ready intelligence.\n\n2. Generic LLMs Aren’t Enough for Enterprise Leasing - Document summaries alone don’t support negotiation decisions. Effective leasing intelligence requires vacancy signals, churn indicators, benchmarks, and portfolio context.\n\n3. Explainability Builds Trust in AI Systems - Evidence-based reasoning improve adoption and make AI suitable for real enterprise decision support.\n\n4. Learning Loops Create Long-Term Advantage - Capturing negotiation outcomes enables continuous improvement and builds a compounding intelligence moat over time.\n\n5. Portfolio Intelligence Drives the Most Value - Enterprise impact comes from portfolio-level prioritization, renewal sequencing, risk clustering, and savings opportunity scoring not just contract analysis.\n\n6. From Intuition to Intelligence - This platform shows how lease negotiation can shift from manual judgment to signal-driven, data-backed decision intelligence.", "about_user_description": "AI Product Leader designing evaluation-driven Agentic Decision-Intelligence Platforms for real-world enterprise workflows using modern AI infrastructure.", "whats_included": ["Agentic Lease Research Assistant - Analyzes leasing comps, vacancy shifts, tenant churn signals, and anchor tenant activity to generate negotiation-ready intelligence.", "Market Signal Synthesis Engine - Aggregates leasing indicators including vacancy trends, tenant churn patterns, and anchor tenant movements into actionable insights.", "Structured Clause Intelligence Extraction - Extracts key lease clauses and converts them into structured negotiation inputs.", "Workflow-Orchestrated Decision Intelligence Pipeline (n8n) - Powered by complex n8n orchestration workflows coordinating signal ingestion, reasoning steps, and output generation.", "Interactive Lease Case Dashboard (v0 UI) - Provides a centralized interface for managing lease cases, reviewing insights, and tracking negotiation intelligence outputs.", "Supabase-Powered Data Layer - Supports structured persistence of lease cases, signals, and intelligence outputs for repeatable workflow execution.", "Executive-Ready Intelligence Briefs - Transforms fragmented lease data into CFO-ready summaries that support faster strategic decisions.", "Multi-Tier Pricing Model Supporting Different Leasing Roles - The platform includes structured pricing tiers aligned with leasing team maturity: Explorer (Free), Leasing Analyst ($79/month), Portfolio Intelligence ($299/month), and Strategic Negotiation Copilot (Enterprise) ", "User Workspace & Profile Intelligence Layer - Each workspace includes structured user profile support"], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "0a43a34f-0914-4d4e-abb3-bfaa2d77e4f0", "project_id": "793cb511-0deb-43a3-9269-2219c1a63d1e", "section": "top10", "rank": 2, "award_name": null, "cohort_label": null}, {"id": "9e94281e-01ee-4ee1-969c-330657ec95bf", "project_id": "793cb511-0deb-43a3-9269-2219c1a63d1e", "section": "awards", "rank": 999, "award_name": "Scrappy MVP Award", "cohort_label": null}, {"id": "d578450b-3bbf-41a5-b81a-1fe3b72665fb", "project_id": "793cb511-0deb-43a3-9269-2219c1a63d1e", "section": "cohort8", "rank": 999, "award_name": null, "cohort_label": "Cohort 8"}]}, {"id": "b841b464-3668-4b6f-bd88-c96dc56bb4e3", "title": "Leeval", "description": "\"Shreya identified a gap at the layer above lead generation: platforms like Thumbtack (contractors), Zillow (real\n  estate), and Tinder (dating) have solved finding options, but evaluating them is still done manually by users\n  drowning in data. ChatGPT gives one-size-fits-all answers without knowing personal context. LeaveWell (branded LEVAL\n  in demo) is a decision-making layer: pull leads from any source → tell the tool what matters to you → it scores,\n  ranks, and explains why each option did or didn't make the cut → preps you for negotiation. Demo: window contractor\n  selection — 10 contractors pulled from static database, user states priorities (best warranty + after sales), LEVAL\n  returns ranked recommendation with reasoning, side-by-side comparison table, and a list of questions to ask\n  contractors. Safety eval: user asking \"\"can I DIY a window installation?\"\" is flagged as potentially harmful and\n  answered appropriately. Architecture: two N8N workflows (core with static vector store, evaluation workflow with\n  domain-specific HHH weights). Moat: proprietary vertical-specific evaluation graph — assessing a Tinder lead is\n  fundamentally different from a contractor lead. Roadmap: expand to real estate, insurance quotes; eventually an\n  autonomous negotiation agent. Pricing: free (3/month), pro $10/month, business data pack.\"", "builder_name": "Shreya Chadha", "builder_linkedin": "https://www.linkedin.com/in/shreya-chadha-10191115/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785965153059.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=dN0kLyVE6%2Fltcqap24%2BwLX3upe7Bm15KINl%2Bup5%2B3l8%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1790014558593.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ki%2Fb8fzSA9huv%2FCHDVZsNQtfPqaAokQbuzCw8ArxDxE%3D", "video_link": "https://www.loom.com/share/b0c9ac26ef714d528704b2c4f4dad989", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "1553a616-6a6d-43b3-b776-f0bad9a81d7f", "project_id": "b841b464-3668-4b6f-bd88-c96dc56bb4e3", "section": "awards", "rank": 999, "award_name": "Best Problem Solution Fit", "cohort_label": null}, {"id": "ccdf8c1e-2b9e-4be9-85c7-8b5094a64b8c", "project_id": "b841b464-3668-4b6f-bd88-c96dc56bb4e3", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "ac6cbee7-e9d7-433c-be91-beaea85b2231", "title": "Personalitrip", "description": "Personality Trip is an AI group travel planner that ends the “where do we stay?” debate. Each friend takes a 60 second quiz and gets a personality. The product then picks the neighborhood that is fairest for the whole group, shows each person what they give up, and plans the days, splitting the group when tastes differ and regrouping everyone for meals. It combines rule-based code for the fairness math with an AI agent for the judgment calls, and it is built for Mexico City today.\n\nThe Problem\n\n- Group trips stall at the first decision: where to stay. One friend wants tacos in Roma, one wants a hostel, one wants a rooftop hotel, one just wants a mezcal.\n- 44% of travelers say this is the hardest part of a group trip.\n- AI planners plan for one average traveler, so nobody sees who is giving something up.\n- Tools either generate itineraries or let groups vote. Nobody negotiates the compromise.\n\nThe Solution\n\n- Each friend takes a 60 second quiz and gets one of eight Personality Lands.\n- Personality Trip picks the neighborhood that is fairest for the whole group.\n- It shows each person exactly what they are giving up.\n- It plans the days, then regroups everyone for meals.\n\nKey Features\n\n- Fairness scoring: see how the plan scores against each person’s preferences.\n- Hotel picks: the top three hotels, with booking links to Booking.com.\n- Day-by-day plans: navigate each day on the left, see the route on the map on the right.\n- Smart splits: when tastes differ, the group splits to enjoy their favorites, then regroups for meals.\n- Place details: tap any restaurant or attraction to open it in Google Maps.\n- Local tips: practical advice before visiting certain spots.\n- Live events: events happening during the trip, pulled through the Ticketmaster API.\n- Conversational edits: tell the agent about rain on day 2 and it redistributes the plan toward indoor activities.\n\nHow It Works\n\n- Hybrid architecture: rule-based code plus an AI agent.\n- Code handles: the quiz, events, and neighborhood fairness scoring.\n- The agent handles: the judgment calls rules cannot make, choosing which of 6 tools to call.\n- Model: Claude Sonnet.\n- Multimodal interface: maps, plans, and fairness views, not just chat.\n\nEvals and Quality\n\n- The planner was tested on 3 different test groups.\n- 2 of the 3 passed every check.\n- Observability is built in.\n\nWhy It Wins\n\n- Every quiz is an invite, so the product spreads through the friend group.\n- Every trip teaches it which neighborhoods make which groups happy, a data advantage generic assistants do not have.\n- It sits in the gap between itinerary generators and group voting tools: it negotiates.\n\nBusiness Model\n\n- The first trip is free.\n- Paid trip passes, with an option for bigger groups.\n- The main revenue is hotel booking through affiliate partnerships.\n\nRoadmap\n\n- Shareable links, so every friend takes the quiz on their own phone or laptop.\n- More cities with curated picks that keep each city’s character. Mexico City is built.\n- Later: live prices, group voting, and in-app booking.\n- Next step suggested by Mahesh: close the loop by asking travelers for reviews of the places the app recommended, then use that volume to negotiate vendor discounts and cut out the middleman.", "builder_name": "Pedro Siqueira", "builder_linkedin": "https://www.linkedin.com/in/jpedrosiqueira/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1793309278717.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=eFCsRN5LPeYKLYt5vljmJAIKWvS5zVQdHBJb58UjQm8%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1793309279280.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=6Y6CqU43fMASh5SxrTzPSrbYGT2ChWS68oUCYHB81Nc%3D", "video_link": "https://drive.google.com/file/d/1T_ZdB7YDTuRBDdBI-_yGKrMcZjPORoPL/view", "workflow_link": null, "doc_link": "https://drive.google.com/file/d/1mLAL77-oCof4hWDHRi_0QQ6yhlqPSIsv/view", "hosted_link": null, "project_category": "Product", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "b135c670-7bc1-4fe8-af73-222f3d341810", "project_id": "ac6cbee7-e9d7-433c-be91-beaea85b2231", "section": "top10", "rank": 10, "award_name": null, "cohort_label": null}, {"id": "66b40e78-2cfd-4884-b472-a465507bfca5", "project_id": "ac6cbee7-e9d7-433c-be91-beaea85b2231", "section": "cohort10", "rank": 999, "award_name": null, "cohort_label": "Cohort 10"}]}, {"id": "a08fdc09-ced9-4203-b972-0619b1b9bd31", "title": "Agentic Project Tracker & Chatboard", "description": "\"Robin comes from 20+ years in credit cards and payments but built his product around his daily reality as a solution\n  architect managing multiple simultaneous projects across multiple teams. The pain: project status, dependencies,\n  and blockers are scattered across Smartsheets, Confluence, Jira, emails, and spreadsheets — there's no single\n  command center. His solution is a multi-agent project tracking system built around four agents: a project status\n  tracker, a dependency relations agent, a chatbot that answers questions about any project, and a monitoring/comms\n  agent that detects when a project is lagging and automatically sends stakeholder communications. Orchestrator\n  coordinates the agents. Demo: an Excel file serves as the current data source (POC phase) — the agent reads it,\n  validates it, generates a formatted project status dashboard, and runs a chatbot to answer project-specific\n  questions. Guardrails are built in: the chatbot is restricted to project-domain knowledge only, and\n  offensive/inappropriate content in input data is blocked before the project is added. Observability: 90% chatbot\n  exit frequency (questions answered without escalation), 100% due-steps coverage. Market context: 5M+ project\n  managers globally, 40% of their time spent on coordination rather than execution. Roadmap: move from Excel to\n  Smartsheet/Confluence/Jira live integration; replace file-based storage with MongoDB; expand to full PM and product\n  manager use cases. Learnings: registry maintenance is critical; RAG retrieval quality needs ongoing investment.\"", "builder_name": "Robin Khatwani", "builder_linkedin": "https://www.linkedin.com/in/robin-khatwani/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788553454719.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=QrUCpWm0vyoHdZL%2BvyIIJZc9IMP07adNgM7PYKOM7b0%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788553455207.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=b7jdrUVUdwaybVfH47jjWpRQWF4LBS%2FIcOwlWz3N4Yc%3D", "video_link": "https://drive.google.com/drive/folders/1-rNzu6VZ1mht12-fjN0oRMXsPHST_zC6/", "workflow_link": null, "doc_link": "https://drive.google.com/drive/folders/1-rNzu6VZ1mht12-fjN0oRMXsPHST_zC6", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "66bc85a4-42c5-42bc-9d73-9a578bf6029b", "project_id": "a08fdc09-ced9-4203-b972-0619b1b9bd31", "section": "awards", "rank": 999, "award_name": null, "cohort_label": null}, {"id": "7dbd5d9c-8b6d-4607-8709-36f624574364", "project_id": "a08fdc09-ced9-4203-b972-0619b1b9bd31", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "dd1391e6-e239-4a68-a0a9-fb61842cb848", "title": "Launch IQ", "description": "Angie built LaunchIQ, an AI-powered launch readiness agent, originally for her asset management vertical and then\n  expanded to all product teams. The core problem: 55% of software launches miss their planned ship date, and 20% miss\n  their targets even after shipping — because launch readiness signals are scattered across Jira, Confluence, GitHub,\n  and Slack with no cross-system view. LaunchIQ watches these tools continuously, detects conflicts, investigates,\n  and flags with judgment rather than just alerting. Her moat is learned judgment: every confirmed or dismissed flag\n  becomes training data that a competitor can't copy. The demo showed a launch readiness score, conflict flags,\n  real-time recalculation, and Slack alerts. She noted technical difficulties during the session but showed up and\n  made it work.", "builder_name": "Angie Fuller", "builder_linkedin": "https://www.linkedin.com/in/angiefuller01/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788552583332.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=nTqZoLEty0P0%2BAyUEWjT4hnsXCIqmcnqmayCe5rGRns%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788552584131.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=8iEze1DcmKk6bR3LPr3OvMZx8SMhop5llaCN5kziEoE%3D", "video_link": "https://drive.google.com/file/d/1jh3Vu6sJ70T6GOTl6pJ5ldXtNZZTEBQe/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1PtU7XLf79LElnyJnK2uYbEMUKf924LSH/edit?usp=drive_link&ouid=111014988661029690130&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "26eeeca5-9a93-4e86-b98f-29835af3b45c", "project_id": "dd1391e6-e239-4a68-a0a9-fb61842cb848", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "ab578fc3-3c6f-4bfb-ac0f-da8adf5dbfad", "project_id": "dd1391e6-e239-4a68-a0a9-fb61842cb848", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "c981a122-0a78-4c7f-80f5-d2ac65994e34", "title": "AdVance", "description": "\"Shipali works in India's print advertising industry and built Advance for a persona that sits between advertisers\n  (and their agencies) and publications: media reps. A media rep holds contracts with multiple newspapers in a\n  specific state (e.g., Gujarat) and earns commission — often worth lakhs — on each ad placement they facilitate.\n  Today their entire business runs on Gmail, WhatsApp, manual Excel tracking, and cold-call lead generation. The\n  bottleneck Shipali focused on for her MVP: ad placement validation. When an advertiser's email arrives, the rep must\n  manually verify all ad specifications against the newspaper's contract requirements, handle back-and-forth in Gmail\n  and WhatsApp, and only then pass the ad to the publication. One missed check = damaged client relationship and lost\n  commission. Her N8N workflow reads the Gmail inbox, classifies the incoming email, validates ad details against\n  contracts and newspaper specifications stored in Supabase, drafts an automated response for the rep to review and\n  edit, and saves it as a Gmail draft for one-click sending. Demo: RDSai (Gujarat-based, 8+ newspapers, 15+ brands)\n  received a placement email, workflow ran validation checks, the dashboard showed where it failed, and a pre-drafted\n  reply appeared ready for human editing. Key learning from the build: pivoting the MVP to lead generation (market\n  monitoring + new brand activity detection) would deliver higher monetary value than back-office automation. Market\n  context: India's print industry is still growing and highly manual — significant digitization opportunity. Business\n  model: SaaS subscription for media reps.\"", "builder_name": "Shipali Sharma", "builder_linkedin": "https://www.linkedin.com/in/shipalisharma/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788552141667.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=M8YnVxhZvg5bPZZAgZGHRYwmd2vJwew%2FZ2c0JolsBFg%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788552142169.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=oUB1grD8wVEx%2BjsZad%2BXQu8XFXlNQDK5IxLVgpfXPoA%3D", "video_link": "https://drive.google.com/file/d/1cc5XivLt2DRZ9TVL-SbqeJc0-H2BT2K8/view?usp=drive_link", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "ef19cdee-d865-4063-9a11-e6929443692c", "project_id": "c981a122-0a78-4c7f-80f5-d2ac65994e34", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "62581bb9-a722-4fff-a4cc-f3dee9f56264", "project_id": "c981a122-0a78-4c7f-80f5-d2ac65994e34", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "d780867a-41e5-4142-906f-9a2a3725fba3", "title": "Lectern", "description": "\"Anja built Lectern for a specific persona: experienced professionals with 20–30 years of credibility who will never\n  chase a conference or send a cold pitch themselves. The market context: 120M Americans are 50+, over half are being\n  involuntarily pushed out of jobs, and only 1 in 10 ever recover their income level — yet nearly all still want to\n  contribute. Meanwhile, podcast audiences, corporate events, and conference organizers are actively hunting credible\n  voices, and LinkedIn is explicitly incentivizing more expert content. Today's solution is a speaking agency costing\n  $2,000–$14,000/month — inaccessible for most. Lectern works as an engagement job tracker plus communication coach.\n  It generates a per-venue positioning brief: for each specific conference, podcast, or panel, it identifies the exact\n  angle, hook, and proof points that fit that room's audience (researched via Perplexity — past speakers, audience\n  demographics, upcoming themes). Venue matching ranks opportunities by credential fit, suggests a specific talk\n  title, and shows why the expert belongs there. Grounded pitch drafting produces a tailored outreach email with a\n  zero-fabrication rule enforced in code. Business model: free (one venue brief + one pitch in 48 hours, \"\"proof before\n  you pay\"\") → $400/month for a small cohort of clients + 15% commission on bookings. Key metric: placements, not\n  activity. Product is live.\"", "builder_name": "Anja Lee", "builder_linkedin": "https://www.linkedin.com/in/anjalee/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788551310057.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=17pQRveXrA496F%2FLaQSKyVqsx8NA9fvNrIkP4r%2FSK6U%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788551310803.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=gSY5Vo6YTLLL3gYoaK2Hal%2BkbGymUH0A3t0Ed8dpW08%3D", "video_link": null, "workflow_link": null, "doc_link": "https://gamma.app/docs/Lectern-Demo-Day-Pitch-weo3pb1db67uhnk", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "0bbcd85f-ade7-46d3-8bcb-44e1a272bbc9", "project_id": "d780867a-41e5-4142-906f-9a2a3725fba3", "section": "awards", "rank": 999, "award_name": "Best Agentic GTM Strategy", "cohort_label": null}, {"id": "bb3ba067-9755-43f1-9bd6-23b520694331", "project_id": "d780867a-41e5-4142-906f-9a2a3725fba3", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "9cbf42fd-5e8d-424a-b68c-a50a83040ce1", "title": "Craving", "description": "\"Sravya identified a gap in food delivery apps through a Zomato interview question: apps solve discovery well when\n  you know what you want, but completely break when you have a mood-based or ingredient-specific query. \"\"I want a\n  salad that doesn't have broccoli\"\" — today this requires opening multiple restaurant menus, manually checking each,\n  and often not finding what you want, leading to not ordering at all. User research with 20–25 friends confirmed the\n  pattern: post-workout, when tired and hungry, decision fatigue causes order abandonment. The product is Craig — a\n  conversational discovery layer that plugs into Zomato or Swiggy as a feature, not a standalone app. Architecture:\n  two N8N workflows. Ingestion: Google Places API pulled restaurants for 2 Bangalore locations (HSR and Indiranagar),\n  ran menus through an LLM to tag allergens, calories, mood attributes (comfort, light, etc.), built a Supabase\n  database with user order history, cuisine preferences, price sensitivity, and distance preferences, plus time-of-day\n  context awareness (no breakfast suggestions at lunchtime). Chat workflow: query triggers search across the database\n  and returns three price-ranged recommendations (budget, group value, treat yourself) grounded in user profile.\n  Evals: 18 real-life scenarios tested with HHH framework — no restaurant favoritism, no fake reviews, context-aware.\n  Business model: plugin within existing Zomato/Swiggy subscription tiers; free tier gives 5 chat queries to drive\n  upgrade. Metrics: time-to-order reduction, order volume increase, retention improvement. Roadmap: group ordering,\n  voice interface, full Bangalore scale.\"", "builder_name": "Sravya Siravuru", "builder_linkedin": "https://www.linkedin.com/in/sravya-siravuru/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788550836970.jpg?sv=2026-06-06&spr=https&se=2076-01-01
