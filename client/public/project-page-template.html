<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — MyAI Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f5;--ink:#09090b;--muted:#52525b;--soft:#71717a;--faint:#a1a1aa;--line:#ececee;--card:#ffffff;
  --navy:#02245b;--navy-2:#1a3a72;--navy-ink:#c3d0e8;--navy-soft:#a9bbdc;
  --amber:#fca93d;--amber-ink:#2b1a04;--amber-deep:#8a5305;--amber-wash:rgba(252,169,61,.15);--amber-edge:rgba(252,169,61,.55);
  --r-xl:36px;--r-lg:24px;--r-md:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}
a:hover{color:var(--amber-deep)}
img{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
@media (max-width:640px){.wrap{padding:0 16px}}
[hidden]{display:none!important}

/* nav */
.navbar{position:sticky;top:0;z-index:40;background:rgba(244,244,245,.86);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.navbar.scrolled{border-bottom-color:var(--line);box-shadow:0 4px 18px rgba(0,0,0,.04)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:18px 0}
.navlinks a.active{color:var(--amber-deep)}
section[id],header{scroll-margin-top:96px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:none}
.brand b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.brand small{font-size:13px;color:var(--soft);white-space:nowrap}
.navlinks{display:flex;gap:8px 28px;font-size:14px;font-weight:500;flex-wrap:wrap}
.navcta{display:flex;gap:16px;align-items:center}
@media (max-width:820px){.navlinks{display:none}.brand small{display:none}.nav{padding:12px 0;flex-wrap:nowrap}.navcta{gap:12px}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 26px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap;border:1.5px solid transparent;cursor:pointer;font-family:inherit}
.btn.sm{padding:11px 20px;font-size:14px}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{color:#fff;background:#0a3477}
.btn.ghost{border-color:var(--ink);padding:14px 26px}
.btn svg{width:16px;height:16px}

/* hero */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:48px;align-items:center;padding:40px 0 56px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);display:inline-block;box-shadow:0 0 0 4px var(--amber-wash);flex:none}
h1{margin:20px 0 0;font-weight:600;font-size:clamp(44px,6vw,76px);line-height:1.02;letter-spacing:-0.04em;text-wrap:balance;overflow-wrap:anywhere}
h1.long{font-size:clamp(36px,4.6vw,58px)}
h1.headline{font-size:clamp(38px,4.4vw,60px);line-height:1.04;letter-spacing:-0.035em}
.lede{margin:24px 0 0;max-width:540px;font-size:17px;line-height:1.6;color:var(--muted);text-wrap:pretty}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.visual{position:relative;min-height:520px}
.frame{position:absolute;inset:20px 40px 0 80px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:#fafafa}
.frame .blur{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(28px) saturate(1.1);opacity:.55;transform:scale(1.05)}
.frame .main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.frame.fit{top:50%;bottom:auto;height:auto;aspect-ratio:var(--ar);max-height:calc(100% - 20px);transform:translateY(-50%);background:#fff;box-shadow:0 20px 50px rgba(2,36,91,.12)}
.frame.fit .blur{display:none}
.frame.fit .main{object-fit:cover}
.cover-banner{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);flex:none}
.cover-banner img{width:100%;height:auto;max-height:120px;object-fit:cover}
.chips{position:absolute;top:70px;right:0;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:2}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.06);max-width:260px}
.chip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick{width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tick svg{width:11px;height:11px}
.float-card{position:absolute;left:0;bottom:60px;width:240px;background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.07);z-index:2}
.float-card .h{font-size:13px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;color:var(--amber-deep);border:1px solid var(--amber-edge);background:var(--amber-wash);padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge-card{position:absolute;right:10px;bottom:0;width:170px;background:var(--amber);color:var(--amber-ink);border-radius:18px;padding:16px;z-index:2}
.badge-card .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.badge-card .v{font-weight:600;letter-spacing:-0.03em;font-size:30px;line-height:1.1;margin-top:6px}
.badge-card .v.sm{font-size:18px;line-height:1.2}
.badge-card .s{font-size:12px;line-height:1.35;margin-top:4px}

/* generated cover (no thumbnail) */
.cover{position:absolute;inset:20px 40px 0 80px;border-radius:var(--r-lg);overflow:hidden;background:var(--navy);color:#fff;padding:28px;display:flex;flex-direction:column;gap:22px;
  background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px),radial-gradient(120% 80% at 100% 0%,rgba(252,169,61,.22),transparent 60%);background-size:18px 18px,100% 100%;padding-bottom:132px}
.visual.has-cover .chips{display:none}
.cover .bar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--navy-ink)}
.cover .bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);display:inline-block}
.cover .bar span{margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .id{display:flex;align-items:center;gap:16px}
.cover .tile{width:64px;height:64px;border-radius:18px;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;flex:none}
.cover .tile svg{width:32px;height:32px}
.cover .name{font-weight:600;font-size:clamp(24px,2.6vw,34px);letter-spacing:-0.03em;line-height:1.05;overflow-wrap:anywhere}
.cover .sub{font-size:14px;line-height:1.5;color:var(--navy-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover .rows{display:flex;flex-direction:column;gap:8px}
.cover .row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 14px;font-size:14px}
.cover .row svg{width:18px;height:18px;flex:none;color:var(--amber)}
.cover .row span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .row em{font-style:normal;font-size:11px;color:var(--navy-ink);flex:none}

@media (max-width:720px){
  .cover{padding-bottom:28px}
  .visual{min-height:0;display:flex;flex-direction:column;gap:12px}
  .frame,.cover{position:relative;inset:auto;min-height:380px}
  .frame{aspect-ratio:4/3;min-height:0}
  .frame.fit{transform:none;top:auto;aspect-ratio:var(--ar);max-height:none}
  .chips{position:static;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .float-card,.badge-card{position:static;width:auto}
  .visual:has(.cover) .chips{display:none}
  .preview{left:16px;right:16px;bottom:12px}
}

/* built with */
.built{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:20px 48px;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.built .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.tool{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;letter-spacing:-0.01em}
.tool svg{width:26px;height:26px}
.tool .gen{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:40px 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px 24px;text-align:center}
.stat .v{font-weight:600;letter-spacing:-0.03em;font-size:clamp(40px,5vw,60px);line-height:1}
.stat .l{margin-top:16px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.5;color:var(--muted)}
.stat .src{margin-top:8px;font-size:12px;color:var(--faint)}

/* section scaffolding */
section.block{padding:80px 0 0}
@media (max-width:640px){section.block{padding-top:56px}}
.tag-outline{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12px}
.tag-amber{display:inline-block;background:var(--amber);color:var(--amber-ink);padding:5px 11px;border-radius:12px;font-size:12px;font-weight:600;letter-spacing:.05em}
h2{margin:18px 0 0;font-weight:600;font-size:clamp(36px,4.4vw,52px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance}
.sec-lede{margin:18px 0 0;max-width:640px;font-size:17px;line-height:1.6;color:var(--muted);text-wrap:pretty}
.center{text-align:center;max-width:980px;margin:0 auto}
.center h2{text-wrap:balance}
.center .sec-lede{margin-left:auto;margin-right:auto}

/* big white card (from approved feature rows) */
.panel{margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px;align-items:start}
.panel + .panel{margin-top:20px}
.panel.solo{grid-template-columns:1fr}
.panel.solo h3{max-width:none;text-wrap:wrap}
.panel.solo p{max-width:none}
.panel h3{margin:20px 0 0;font-weight:600;font-size:clamp(28px,3.2vw,40px);line-height:1.15;text-wrap:pretty}
.panel h3.long{font-size:clamp(22px,2.2vw,28px);line-height:1.35;font-weight:500}
.panel p{margin:18px 0 0;max-width:460px;font-size:16px;line-height:1.65;color:var(--muted)}
.shot{aspect-ratio:4/3;border-radius:var(--r-lg);overflow:hidden;background:var(--bg)}
.shot img{width:100%;height:100%;object-fit:cover}

/* icon list */
.ilist{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.ilist li{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r-md);background:var(--bg);font-size:15px;line-height:1.55;color:#27272a}
.ico{width:38px;height:38px;border-radius:12px;background:var(--amber-wash);border:1px solid var(--amber-edge);color:var(--amber-deep);display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:19px;height:19px}
.ico.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.ico.c0{background:#fff1dc;border-color:#ffd9a3;color:#c26a00}
.ico.c1{background:#e6eeff;border-color:#c7d7ff;color:#2457d6}
.ico.c2{background:#ddf6ea;border-color:#b5e9d0;color:#13865a}
.ico.c3{background:#efe8ff;border-color:#d8c9ff;color:#6d3fd8}
.ico.c4{background:#ffe6ec;border-color:#ffc6d3;color:#d6336c}
.ico.c5{background:#dcf4f7;border-color:#b2e4ea;color:#0e7d8c}
.ico.lg{width:52px;height:52px;border-radius:16px}
.ico.lg svg{width:24px;height:24px}

/* who it's for */
.aud{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.aud-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;gap:18px}
.aud-card .t{font-size:17px;line-height:1.5;font-weight:500}
.aud-hero{background:var(--ink);color:#fff;border-color:var(--ink)}
.aud-hero .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.aud-hero .t{font-size:clamp(24px,2.4vw,30px);line-height:1.2;font-weight:600;letter-spacing:-0.02em}
.aud-hero .ico{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:var(--amber)}

/* problem: headline + labelled blocks */
.pgrid{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.pblock{background:var(--bg);border-radius:var(--r-md);padding:22px;display:flex;flex-direction:column;gap:12px}
.pblock .hd{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#52525b;font-weight:600}
.pblock .hd .ico{width:30px;height:30px;border-radius:9px}
.pblock .hd .ico svg{width:15px;height:15px}
.pblock .num{font-weight:600;letter-spacing:-0.03em;font-size:clamp(34px,3.4vw,44px);line-height:1;color:var(--ink)}
.pblock p{margin:0;font-size:17px;line-height:1.6;color:#27272a;max-width:none}
.pblock ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.pblock li{font-size:17px;line-height:1.55;color:#27272a;padding-left:16px;position:relative}
.pblock li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.pblock.pnum{background:#fff7ea;border:1px solid #ffe2b8}
.pblock.wide{grid-column:span 2}
@media (max-width:640px){.pblock.wide{grid-column:auto}}

/* hero byline */
.byline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px;font-size:14px;color:var(--muted)}
.byline b{color:var(--ink);font-weight:600}
.byline i{width:4px;height:4px;border-radius:50%;background:#c4c4cc;display:inline-block}
.bav{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.bcat{font-size:12px;color:var(--amber-deep);border:1px solid var(--amber-edge);background:var(--amber-wash);padding:3px 9px;border-radius:999px}

/* section header with a right-aligned link */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
.sec-link{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;border-bottom:1.5px solid var(--ink);padding-bottom:3px;white-space:nowrap;margin-bottom:8px}

/* explore panel */
.explore{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
.explore.solo{grid-template-columns:minmax(0,1fr)}
.explore h2{font-size:clamp(30px,3.4vw,42px)}
.ex-right{display:flex;flex-direction:column;gap:12px}
.ex-right .rcard{padding:18px 20px;background:var(--bg);border-color:transparent}
.ex-right .rcard:hover{background:#fff;border-color:var(--ink)}
.explore .incl{margin-top:28px;padding:0;border:0;background:none;border-radius:0}
.explore .incl ul{grid-template-columns:1fr;gap:10px}
@media (max-width:900px){.explore{grid-template-columns:minmax(0,1fr)}}

/* meet the builder band */
.band .in{align-items:start}
.band .in.solo{grid-template-columns:minmax(0,1fr)}
.b-left{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.b-left .quote{margin:0}
.btn.white svg{width:16px;height:16px}
.b-right{display:flex;flex-direction:column;gap:14px}
.bcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-lg);padding:24px}
.bcard .h{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px}
.bcard .h .ico{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.bcard ul{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.bcard li{position:relative;padding-left:18px;font-size:15px;line-height:1.55;color:#dbe4f5}
.bcard li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--amber)}

/* more projects */
.mgrid{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.08);color:var(--ink)}
.mthumb{position:relative;aspect-ratio:16/10;background:var(--navy);overflow:hidden}
.mthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mcover{position:absolute;inset:0;display:flex;align-items:center;gap:14px;padding:22px;color:#fff;background:var(--navy);background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px),radial-gradient(90% 80% at 100% 0%,rgba(252,169,61,.25),transparent 60%);background-size:16px 16px,100% 100%}
.mcover .tile{width:48px;height:48px;border-radius:14px;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;flex:none}
.mcover .tile svg{width:24px;height:24px}
.mcover b{font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.1;overflow-wrap:anywhere}
.mbadge{position:absolute;left:12px;top:12px;z-index:2;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbody{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.mmeta{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.mbody h4{margin:0;font-size:20px;font-weight:600;letter-spacing:-0.01em}
.mbody p{margin:0;font-size:14px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mby{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.mby .bav{width:24px;height:24px;font-size:10px}

/* footer bottom row */
.fbottom{margin-top:32px}
.fbrand{display:flex;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.fbrand small{font-weight:400;color:var(--soft);font-size:13px}
.flinks{display:flex;gap:8px 24px;flex-wrap:wrap;font-size:14px;font-weight:500}

/* data-source labels (toggle) */
.show-src [data-src]{outline:2px dashed rgba(214,51,108,.55);outline-offset:6px;position:relative}
.show-src [data-src]::before{content:attr(data-src);position:absolute;top:-14px;left:12px;z-index:30;background:#d6336c;color:#fff;font:600 11px/1.3 ui-monospace,Menlo,monospace;padding:4px 8px;border-radius:6px;white-space:pre-wrap;max-width:min(560px,90%);pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.src-toggle{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;align-items:center;gap:8px;background:#0b0b0f;color:#fff;border:0;border-radius:999px;padding:12px 18px;font:600 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.src-toggle[aria-pressed="true"]{background:#d6336c}

/* features: alternating rows with a generated product-window visual */
.frows{margin-top:36px}
.frow-panel{align-items:center;margin-top:20px}

<script>
/* ============================================================
   PROJECT → PAGE MODEL
   Turns one project record (same shape as /api/cohort-projects/:id)
   into structured page content. Explicit fields (future admin
   fields) always win; otherwise content is derived from the
   free-text description. Nothing is invented: every sentence or
   number shown comes from the project's own text.
   ============================================================ */
var PrimerParser = (function () {

  // ---------- text cleanup ----------
  function cleanDescription(raw) {
    if (!raw) return '';
    var t = String(raw).replace(/\r\n?/g, '\n').trim();
    // admin-pasted text often arrives wrapped in quotes with CSV-escaped "" inside
    if (/^"[\s\S]*"$/.test(t)) t = t.slice(1, -1);
    t = t.replace(/""/g, '"');
    // hard-wrapped continuation lines (newline + 2 or more spaces, not a bullet)
    t = t.replace(/\n[ ]{2,}(?![•\-*–▪◦]|\d+[.)])/g, ' ');
    t = t.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
    return t.trim();
  }

  var ABBR = /\b(e\.g|i\.e|etc|vs|approx|incl|Mr|Ms|Dr|Inc|Ltd|St|No)\./gi;
  function splitSentences(text) {
    var safe = text.replace(ABBR, function (m) { return m.replace(/\./g, '․'); });
    return safe
      .split(/(?<=[.!?]["”')]?)\s+(?=["“(]?[A-Z0-9$₹€£])/)
      .map(function (s) { return s.replace(/․/g, '.').trim(); })
      .filter(function (s) { return s.length > 2; });
  }

  function cap(s) { s = (s || '').trim(); return s.charAt(0).toUpperCase() + s.slice(1); }
  function trimTo(s, n) {
    s = (s || '').trim();
    if (s.length <= n) return s;
    var cut = s.slice(0, n);
    var sp = cut.lastIndexOf(' ');
    return cut.slice(0, sp > n * 0.6 ? sp : n).replace(/[,;:\-–—\s]+$/, '') + '…';
  }
  function stripEndPunct(s) { return (s || '').replace(/[\s.,;:]+$/, ''); }

  // ---------- classification ----------
  var HEADING_MAP = [
    ['summary', /^(vision|overview|summary|mvp goal|goal|about|tl;?dr|introduction|mission|what is|elevator)/i],
    ['problem', /(problem|pain|challenge|why it matters|the gap|status quo|friction|why now)/i],
    ['audience', /(customer|persona|audience|who (it'?s|is it|this is) for|target|users?\b|icp|segment|built for)/i],
    ['arch', /(architecture|tech|stack|how it works|how it'?s built|built with|pipeline|workflow|infrastructure|system design|implementation|agents?\b)/i],
    ['features', /(solution|feature|benefit|what it does|capabilit|how it helps|product|mvp|functionality|value prop|key value|use cases?)/i],
    ['market', /(market|opportunity|business model|pricing|go.to.market|competit|monetiz)/i],
    ['learned', /(learn|takeaway|lesson|reflection)/i],
    ['future', /(next steps?|what'?s next|future|roadmap|v2|improvement)/i],
    ['results', /(eval|result|metric|impact|outcome|success)/i]
  ];

  var SCORE = {
    problem: /\b(problem|pain|struggl\w*|frustrat\w*|manual(ly)?|bottleneck|barrier|expensive|slow|wast\w*|time-consuming|overwhelm\w*|miss(ed|ing)?|hard to|difficult|lack\w*|gaps?|fragmented|today|currently|no one|ineffici\w*|friction|stale|outdated|leakage|chaos|confus\w*|forget\w*|tedious|error-prone|out of reach|cost(s|ing)?\b|spend\w*|hours)\b/gi,

  // "Aggregates signals from GitHub, vendor sources, research, and curated web queries" → short items for the mock window
  function featureItemsFrom(body) {
    var parts = (body || '').replace(/\([^)]*\)/g, '').split(/\s*(?:,|;|→|->|\+)\s*|\s+and\s+(?=[a-z])/i)
      .map(function (x) { return x.replace(/^(and|or|with|plus)\s+/i, '').replace(/[.\s]+$/, '').trim(); })
      .filter(function (x) { return x.length >= 3 && x.length <= 60; });
    var raw = (body || '').replace(/\([^)]*\)/g, '').split(/\s*(?:,|;|→|->|\+)\s*|\s+and\s+(?=[a-z])/i).map(function (x) { return x.trim(); }).filter(Boolean);
    if (raw.length >= 2) {
      var lead = raw[0].match(/^.*\b(?:based on|on|of|from|for|like|such as|including|across|into|with)\s+(.{3,})$/i);
      if (lead && raw[0].length > 30) raw[0] = lead[1];
      parts = raw.map(function (x) { return x.replace(/^(and|or|with|plus)\s+/i, '').replace(/[.\s]+$/, '').trim(); }).filter(function (x) { return x.length >= 3 && x.length <= 60; });
    }
    if (parts.length < 2) return [];
    if (parts.length === 2 && (raw[0] || '').length > 40) return [];
    return parts.slice(0, 4).map(function (x) { return x.charAt(0).toUpperCase() + x.slice(1); });
  }

  // drop the title from the body when the body just repeats it
  function featureBody(f) {
    var b = (f.body || '').trim(), t = (f.title || '').replace(/…$/, '').trim();
    if (!b || !t) return b;
    if (b.toLowerCase().indexOf(t.toLowerCase()) === 0) {
      var rest = b.slice(t.length).replace(/^[\s,:;–—-]+/, '').trim();
      return rest.length >= 12 ? rest.charAt(0).toUpperCase() + rest.slice(1) : '';
    }
    return b;
  }

  // formatted original description for the collapsible write-up
  function writeup(desc) {
    var out = [], list = [];
    function flush() { if (list.length) { out.push('<ul>' + list.map(function (x) { return '<li>' + linkify(x) + '</li>'; }).join('') + '</ul>'); list = []; } }
    desc.split('\n').forEach(function (line) {
      var l = line.trim();
      if (!l) { flush(); return; }
      if (/^\s*(?:[•\-*–▪◦●]|\d+[.)])\s+/.test(line)) { list.push(l.replace(/^(?:[•\-*–▪◦●]|\d+[.)])\s+/, '')); return; }
      flush();
      if ((l.length <= 60 && /[A-Z]{3}/.test(l) && !/[a-z]/.test(l)) || (/:$/.test(l) && l.length <= 60)) { out.push('<h5>' + esc(l.replace(/:$/, '')) + '</h5>'); return; }
      // split run-on paragraphs at inline labels: "… Demo: … Architecture: … Pricing: …"
      var parts = l.split(/(?<=[.!?])\s+(?=[A-Z][A-Za-z /&-]{2,28}:\s)/);
      parts.forEach(function (part) {
        var m = part.match(/^([A-Z][A-Za-z /&-]{2,28}):\s(.+)$/);
        if (m) out.push('<p><b>' + esc(m[1]) + ':</b> ' + linkify(m[2]) + '</p>');
        else out.push('<p>' + linkify(part) + '</p>');
      });
    });
    flush();
    return out.join('');
  }

    if (window.PROJECT) return render(window.PROJECT);
    var all = SAMPLE_PROJECTS;
    var pick = all.filter(function (s) { return s.id === id; })[0];
    if (pick || !id) { show(pick || all.filter(function (s) { return s._featured; })[0] || all[0]); return; }
    fetch(API + '/cohort-projects/' + encodeURIComponent(id)).then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.data) show(j.data); else throw new Error('not found'); })
      .catch(function () { show(all[0]); });
  }

  // review bar: featured tabs (one per data situation) + every project + what data this one has
  function show(p) {
    render(p);
    var old = document.getElementById('review'); if (old) old.remove();
    var M = PrimerParser.build(p);
    var featured = SAMPLE_PROJECTS.filter(function (s) { return s._featured; });
    var rest = SAMPLE_PROJECTS.filter(function (s) { return !s._featured; }).slice().sort(function (a, b) { return a.title.localeCompare(b.title); });
    var nm = function (t) { return t.split(/\s[-–—|:]\s/)[0]; };
    var d = (p.description || '').trim().length;
    var cov = [
      ['Description', d > 600 ? 'y' : d > 0 ? 'd' : 'n', d ? d + ' chars' : 'none'],
      ['Thumbnail', p.thumbnail_url ? 'y' : 'd', p.thumbnail_url ? 'uploaded' : 'generated cover'],
      ['Video', videoEmbed(p.video_link) ? 'y' : 'n', ''],
      ['Slides / docs', p.doc_link ? 'y' : 'n', ''],
      ['Live link', p.hosted_link ? 'y' : 'n', ''],
      ['Problem', p.problem ? 'y' : M.problem ? 'd' : 'n', p.problem ? 'admin' : M.problem ? 'from text' : ''],
      ['Audience', p.audience ? 'y' : M.audience ? 'd' : 'n', p.audience ? 'admin' : M.audience ? 'from text' : ''],
      ['Features', (p.features || []).length ? 'y' : M.features.length >= 2 ? 'd' : 'n', M.features.length ? String(M.features.length) : ''],
      ['Build steps', (p.steps || []).length ? 'y' : M.steps.length >= 2 ? 'd' : 'n', M.steps.length ? String(M.steps.length) : ''],
      ['Hero subtext', p.subtitle ? 'y' : M.lede ? 'd' : 'n', ''],
      ['Builder photo', p.user_image_url ? 'y' : 'n', '']
    ];
    var bar = document.createElement('div');
    bar.className = 'review'; bar.id = 'review';
    bar.innerHTML = '<div class="in"><div class="row1"><span class="lab">Review · ' + SAMPLE_PROJECTS.length + ' projects</span><div class="tabs" role="tablist">' +
      featured.map(function (s) { return '<button class="tab" role="tab" data-id="' + esc(s.id) + '" aria-selected="' + (s.id === p.id) + '"><b>' + esc(nm(s.title)) + '</b><small>' + esc(s._note) + '</small></button>'; }).join('') +
      '</div><select aria-label="All projects"><option value="">All projects…</option>' +
      featured.concat(rest).map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === p.id ? ' selected' : '') + '>' + esc(nm(s.title)) + (s.builder_name ? ' · ' + esc(s.builder_name) : '') + '</option>'; }).join('') +
      '</select></div><div class="row2">' + cov.map(function (c) { return '<span class="cov ' + c[1] + '">' + (c[1] === 'n' ? '✕' : '✓') + ' ' + esc(c[0]) + (c[2] ? ' · ' + esc(c[2]) : '') + '</span>'; }).join('') +
      '<span class="legend">green = provided · amber = derived from text / fallback · grey = missing, section hidden</span></div></div>';
    document.body.insertBefore(bar, document.body.firstChild);
    var go = function (pid) {
      var s = SAMPLE_PROJECTS.filter(function (x) { return x.id === pid; })[0]; if (!s) return;
      history.replaceState(null, '', '?id=' + s.id); show(s); window.scrollTo(0, 0);
    };
    window.__previewGo = go;
    bar.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { go(t.getAttribute('data-id')); }); });
    bar.querySelector('select').addEventListener('change', function (e) { if (e.target.value) go(e.target.value); });
    var sel = bar.querySelector('.tab[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  // label each block with the admin field(s) that feed it
  var SRC = [
    ['.navbar', 'title · video_link / hosted_link (button)'],
    ['.hero > div:first-child', 'title · description (headline + subtext) · project_section_assignments (eyebrow) · video_link / hosted_link / doc_link (buttons)'],
    ['.visual', 'thumbnail_url / banner_url (else generated cover) · project_category · project_section_assignments (badge)'],
    ['.built', 'description (tools detected)'],
    ['.stats', 'description (numbers in text)'],
    ['#problem .panel', 'description → problem, pain points, numbers, cost, why now'],
    ['#audience .persona', 'description → audience'],
    ['#features .frows', 'description → features (admin screenshot replaces the generated visual)'],
    ['.hero .byline', 'builder name · user_image_url · project_section_assignments (cohort) · project_category'],
    ['.band .who', 'builder name · user_image_url · project_section_assignments (cohort)'],
    ['.band .quote', 'about_user_description (else builder sentences in description)'],
    ['.band .btn.white', 'builder_linkedin'],
    ['.band .b-right', 'what_you_learned · description → roadmap / next'],
    ['#player', 'video_link · thumbnail_url / banner_url (poster)'],
    ['#architecture .steps', 'description → "A → B → C" steps / architecture sentences'],
    ['#architecture .sec-link', 'workflow_link'],
    ['#demo .sec-link', 'video_link'],
    ['#resources .ex-right', 'hosted_link · doc_link · workflow_link · video_link'],
    ['#resources .incl', 'whats_included'],
    ['#more .mgrid', 'other projects: thumbnail_url / banner_url · title · builder · project_category · project_section_assignments'],
    ['details.story', 'description (full text)'],
    ['footer .ftags', 'project_category · project_section_assignments · description (tools)'],
    ['footer .flinks', 'builder_linkedin (link)']
  ];
  window.__annotate = function () {
    SRC.forEach(function (r) { document.querySelectorAll(r[0]).forEach(function (el) { el.setAttribute('data-src', r[1]); }); });
  };
  var _render = render;
  render = function (p) { _render(p); window.__annotate(); };
  if (window.SHOW_SOURCE_TOGGLE) {
    var tg = document.createElement('button');
    tg.className = 'src-toggle'; tg.type = 'button'; tg.setAttribute('aria-pressed', 'false'); tg.textContent = 'Show data sources';
    tg.addEventListener('click', function () {
      var on = document.body.classList.toggle('show-src');
      tg.setAttribute('aria-pressed', on); tg.textContent = on ? 'Hide data sources' : 'Show data sources';
      if (on) document.querySelectorAll('details.story').forEach(function (d) { d.open = true; });
    });
    document.body.appendChild(tg);
  }
  // inside the site's iframe: #anchors scroll this page, site links navigate the parent window
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.target === '_blank') return;
    var h = a.getAttribute('href');
    if (h.charAt(0) === '#') {
      var el = document.getElementById(h.slice(1));
      if (el) { e.preventDefault(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    } else if (h.charAt(0) === '/' && window.PROJECT && window.top !== window) {
      e.preventDefault(); window.top.location.href = h;
    }
  });
  boot();
})();
</script>
</body>
</html>
