T00%3A00%3A00Z&sr=b&sp=r&sig=65KWjvpV096kS%2BfuSAmCYPd9Xw4PdcE%2FNHaL5czD4Ms%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788550837483.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=%2BNJEtC5ytOrFDWkkz40beVNpZDbbQ49bVMrNi54HACw%3D", "video_link": "https://www.loom.com/share/0bbea3551429496fb1509a27fbef172e", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1Z42YH5QXHtgK9zcBc0blGYTdOmm8Lyq9/edit?usp=sharing&ouid=112820795853539858886&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "1dbf4cf2-116d-4f04-a71c-2a10386ac6b3", "project_id": "9cbf42fd-5e8d-424a-b68c-a50a83040ce1", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "bd494c3c-f30a-44e8-8f59-15a6e78a1e0e", "project_id": "9cbf42fd-5e8d-424a-b68c-a50a83040ce1", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "14190e3a-ac71-4cb4-afe0-e3d77e6def98", "title": "Customer Support Agent", "description": "\"Sonia built Creative Console for a friend — a genuinely talented artist who couldn't convert talent into sales. She\n  identified three gaps: no structured single source of truth for the business (offerings, classes, past work were\n  scattered across portals), no clear positioning strategy, and no visibility into what was or wasn't working. Her\n  thesis: \"\"Great creative work shouldn't fail because the business around it is invisible.\"\" The problem couldn't be\n  solved economically before AI — there's no CAC-to-LTV equation that makes it viable to serve individual solopreneur\n  artists at $39K average annual revenue, but building cost with AI makes it possible now. Phase 1 MVP: built the\n  artist's website on Lovable, catalogued all offerings and classes, deployed an AI inquiry agent grounded in the\n  artist's real inventory. The agent handles inbound questions (vague to specific) without requiring the artist to\n  context-switch out of creative flow. Every inquiry is captured as structured data. Phase 2 (planned): a strategy\n  agent that analyzes inquiry patterns and advises on what's attracting interest and what isn't. Vision: a full\n  Business OS for creative professionals — multi-agent system to tag and organize artifacts, manage workshop\n  inventory, and handle publishing and marketing. Plan: start with one artist, prove it works, then generalize.\n  Market: 1.17M US creative artist businesses.\"", "builder_name": "Sonia Kulkarni", "builder_linkedin": "https://www.linkedin.com/in/sonia-kulkarni-8886002a/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788550670868.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=%2BpgJ91GKCHw6yKdigOGYXNiJdgRykOoMFKQAUWTROjg%3D", "banner_url": null, "user_image_url": null, "video_link": null, "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "88fd1b65-bafe-4eef-97c4-6038bbc49b70", "project_id": "14190e3a-ac71-4cb4-afe0-e3d77e6def98", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "70feba0f-2287-454d-813e-47d88dccecb8", "project_id": "14190e3a-ac71-4cb4-afe0-e3d77e6def98", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "b62423ce-f853-4f60-a316-2d88287e17f9", "title": "Planner", "description": "\"Meha built Story, an India-first AI social media planner targeting early-stage D2C founders who can't afford a\n  competent social media agency and end up with junior resources who underdeliver. Market: 180,000 Shopify stores\n  growing at 41% YoY; 67% of D2C brands use Instagram as primary growth channel. The product generates a 7-day\n  Instagram content plan using multiple live signals: store performance, market trends, past post performance, and\n  India-specific upcoming events (FIFA World Cup used as a live demo example). For each post, Story outputs: image\n  prompt, topic, timing, hook, confidence score, relevance score, virality score, and a rationale citing the specific\n  sources that drove the recommendation. A judge agent runs HHH (helpfulness/honest/harmless) evaluation on every plan\n  (scores 75/75/87.5 in demo); founder can provide feedback for regeneration; approved plan is stored and tracked for\n  engagement performance. Architecture: React + N8N + Claude (planning agent) + GPT/DALL-E (image generation) + judge\n  agent. Pricing (INR): 12,000/month (7 images) or 14,000/month (expanded plan) — cheaper than hiring a junior\n  resource (15–20K INR for only 4–5 posts). Phased roadmap: Phase 1 WooCommerce + carousels; Phase 2 video +\n  auto-posting; Phase 3 WhatsApp + Tier 3 micro-SMEs + regional languages; Phase 4 enterprise version for social media\n  agencies. Key learning: context management balloons fast — \"\"your system prompt can hit 10 pages in no time.\"\"\"", "builder_name": "Meha Sinha", "builder_linkedin": "https://www.linkedin.com/in/meha-s-6333a063/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788550469086.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=SX%2B5OLLnRPb5JXkuVVkRfNQOLWAI5dBhY4urfiAduYk%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788550469580.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=lQKCgzJJp66eFaG6TOdI6zZQC%2FY0xM4Pli4gSheD1Ak%3D", "video_link": "https://drive.google.com/drive/folders/1-rNzu6VZ1mht12-fjN0oRMXsPHST_zC6", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/10lVyUI6CZ0rGFiXGSFD7ut2PVH9zyXnn/edit?slide=id.p1#slide=id.p1", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "44f114cf-244f-4ee3-bc46-5fe887e62bba", "project_id": "b62423ce-f853-4f60-a316-2d88287e17f9", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "6232475b-0759-440c-b8fd-36520a845358", "project_id": "b62423ce-f853-4f60-a316-2d88287e17f9", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "791ea4c3-a1a7-4688-addb-cf42baaf1831", "title": "Exception IQ", "description": "\"Ayaz built ExceptionIQ to automate warehouse exception handling — the process of resolving anomalies (damaged\n  packages, missing picks) that currently takes 2–10 minutes each and costs warehouses ~$2M annually. Using an n8n\n  agentic workflow, the system classifies each exception as auto-resolvable or human-in-loop, routes human-approval\n  cases to Slack, and includes a separate evaluation branch with ground truth. Demo showed 10 exceptions processed: 6\n  auto-executed, 4 sent for human review, 12 minutes saved. He flagged that 73% of warehouse ops remain manual, and\n  built a simplified UX for non-tech operators. Next: expand exception types, tighten ground truth evaluation.\"", "builder_name": "Ayaz Shaik", "builder_linkedin": "https://www.linkedin.com/in/ayazshaik/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788548912163.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=o2ryD7U0C0Ds3RJfu48NjMEej4jpzvbwFmxZFyYg9t0%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788548912835.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=%2Fs1YJ90QPdj%2FqiiEbqbDcbFB9SlPgGkP49AaYZiNpUQ%3D", "video_link": "https://drive.google.com/file/d/1YerywgTcBxSU4ndTt2gGffs7h3JFXD_D/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1rc1CKnr1f-99qDzjPihWBXV9sOQ6vBjE/edit?usp=sharing&ouid=104080355755674411879&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "44c04d97-3ede-4c60-9148-858469818480", "project_id": "791ea4c3-a1a7-4688-addb-cf42baaf1831", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "4c105f11-8d90-4b43-bd58-491de8cf0033", "project_id": "791ea4c3-a1a7-4688-addb-cf42baaf1831", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "c2b4c041-78a0-4103-9a57-963e8ce2ba2b", "title": "Pocket Farm Stand", "description": "\"Sandra built Parket Farm Stand from six years of working directly at New York City farmers markets. The core\n  problem: no structured dataset exists for small farm harvests. Farmers post inconsistently or not at all; weather\n  events affect harvests months in advance (this season's Northeast frost in April wiped out the Jersey peach crop);\n  shoppers show up to market with no way to know what's available. The product has two layers: a consumer-facing\n  availability tool (search produce by type, day, and market; each result shows which farm stands should have it and\n  why; weather-effect banners explain shortages), and an AI-powered dataset-building engine underneath. Two agents: a\n  data extraction agent that scrapes harvest data from scattered sources (farm websites, Instagram, CSA pages, market\n  photos) plus manual collection; and an impact reasoning agent that maps known harvest windows to micro-regional\n  weather events and learns across multiple seasons how each weather pattern affects each crop in each location. MVP\n  scoped to Union Square Market (NYC's largest, 200-mile radius sourcing area covering multiple micro-regions).\n  Currently in mockup and manual data-gathering phase; AI loop activates once initial dataset is seeded. Design\n  principle: achieve prediction accuracy before scaling to additional markets. Sandra confirmed an evaluation\n  framework exists conceptually but did not have a slide.\"", "builder_name": "Sandra Naidich", "builder_linkedin": "https://www.linkedin.com/in/sandranaidich/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788548774113.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=gptn5NnhphaU08osj%2FWiljHvSkEiWTjliMpzPzLLJFQ%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788548774586.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=lkZvF2sn5vaGPNN7h%2FYWv%2BHLWu5P7FoYv%2BCqWvoDPE0%3D", "video_link": null, "workflow_link": null, "doc_link": "https://1drv.ms/p/c/95ea85be6898464d/IQCLXteBYhg7TpYpPjI9AUJOAX1kK3SDuZY0N1DCKS7Ae2w?e=seGH1w", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "1f7194d9-eb6c-4621-9b44-05efc072dd3b", "project_id": "c2b4c041-78a0-4103-9a57-963e8ce2ba2b", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "98c734fc-117a-47b7-a322-6e626928f2ef", "project_id": "c2b4c041-78a0-4103-9a57-963e8ce2ba2b", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "b5b420de-501f-4f06-b9a7-cfc7a105da7b", "title": "Core Compass", "description": "\"Abhishek built Care Compass to address the first decision patients face when something feels wrong: what level of\n  care do I actually need? His data: 59% of US adults use the wrong healthcare channel; 155 million ER visits\n  annually, many avoidable; the AI healthcare market is growing to $180B. The product is a chat-based triage agent —\n  patient describes symptoms, and a multi-agent system (context gathering → assessment → structured recommendation)\n  classifies the situation into emergency, urgent, or routine, then provides specific guidance on the appropriate care\n  setting. All assessments are stored in Supabase to build a longitudinal history that enables personalized future\n  recommendations. Demo: chest pain and shortness of breath → classified as urgent → recommendation plus reasoning\n  displayed → record written to Supabase. Architecture: N8N workflow, three agent categories, Supabase memory.\n  Business model: individual subscriptions → enterprise licensing for healthcare providers. Key metrics:\n  classification accuracy, completion rate, retrieval success rate. Roadmap: Phase 1 MVP done; Phase 2 granular\n  medical history collection and improved assessment accuracy; Phase 3 real-time physician directory + appointment\n  booking by zip code.\"", "builder_name": "Abhishek Srivastava", "builder_linkedin": null, "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788548656862.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=KgIZm4j32WrUmRV8czYxdFx1e2gy1VdHZNPo3PKL%2BbM%3D", "banner_url": null, "user_image_url": null, "video_link": "https://app.screenity.io/view/6a34c9bf6ab0793952c2588e", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1_x5s7FZdowrukSncnELkFjX5_3Vw9Kgc/edit?slide=id.p1#slide=id.p1", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "8540fde0-5d4b-4361-a7b6-6747a7e4c31b", "project_id": "b5b420de-501f-4f06-b9a7-cfc7a105da7b", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}]}, {"id": "7d8afd83-fa1c-4694-a265-c0aefa0cffac", "title": "HappyTravelsAI", "description": "\"Sharda built Happy Travels AI as a family travel planning concierge to solve a specific breakdown: planning a trip\n  starts with excitement but collapses into preference battles and analysis paralysis. Research she cited: trip\n  planning generates as much dopamine as the actual vacation — it should be fun, not a fight. The $480B travel market\n  has no tool that reconciles multi-member family preferences before destination selection. Her system: each family\n  member enters their own preferences and past favorite trips via a personalized link → AI generates 5 destination\n  options, each with a rationale citing which family member's preferences drove the suggestion, a source URL, and a\n  live travel advisory check → each member votes → concierge picks the winner based on love-vote count. Phase 1 (live\n  and deployed): preferences plus destination recommendation with voting. Phase 2: day-by-day itinerary synthesis.\n  Phase 3: deal monitoring, flight booking, trip curation. Moat: a learning loop that persists family preference\n  history across trips — no existing tool builds this. Stack: Lovable (UI), N8N (orchestration), GPT-4o (AI + live\n  sighting validation), Supabase (data). Evals: 10 live results — 100% helpfulness, family-member-tagged citations,\n  off-beaten-path destinations surfaced, live source URLs, no PII in output, travel advisories displayed. Pricing:\n  free initially → $149/year family deal (anchored to 2–3 annual trips).\"", "builder_name": "Sharda Bharatula", "builder_linkedin": "https://www.linkedin.com/in/sharda-bharatula/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788548262473.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=XheC1U7zgDr%2BNq9G69tFkqKhJd7WFgJ7%2BEYUY3dlSeg%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788548263192.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=4KKWDQW4GKa2SmhQA2fkUKFGt%2B8KouHdUzZ2v29P0Fs%3D", "video_link": "https://www.loom.com/share/82fd011172a04e528aa0d3ec9f5e55dc", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1soz3SjT2uuK2flexsgwvPZaz2MMbfaCACHJuKzl6MaI/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "a72ad507-7bec-4801-b209-1dabd5e5595a", "project_id": "7d8afd83-fa1c-4694-a265-c0aefa0cffac", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "72d8f85d-6c6f-40e8-bfb1-41dc38bb850c", "project_id": "7d8afd83-fa1c-4694-a265-c0aefa0cffac", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "76d5dec6-8a71-49ee-a408-f17d49ed02fc", "title": "ClaimForge", "description": "\"Vishu works in a TMS/DMS (Transportation Management System) company and built ClaimForge to recover freight revenue\n  that enterprise shippers are leaving with carriers. The mechanism: insurers routinely pay providers less than the\n  contracted rate, but the biggest driver of loss isn't fraud — it's missed filing windows. Every carrier has a\n  different claim deadline, analysts must manually cross-reference invoices, contracts, bills of lading, and\n  proof-of-delivery documents across disparate systems, and the volume makes it impossible to catch everything in\n  time. Money that rightfully belongs to the shipper stays with the carrier by default. Three revenue-leak types:\n  overbilling (carrier charges above contracted rate), unclaimed service failure refunds (missed SLA deadlines = owed\n  money, never claimed), and lost/damaged claims never filed. Market: ~3,000–4,000 enterprise shippers spending >$50M\n  in freight annually, high willingness to pay, clear ROI framing. The SAVR agent (Self-improving, Autonomous,\n  Vigilant, Evidence-focused, Resolution-driven): detects claim windows approaching, assembles evidence from contracts\n  and playbooks, drafts the claim, runs it through a confidence gate — auto-sends if high confidence, routes to human\n  review if not. Demo: dashboard with case status, a 92%-confidence auto-sent claim with full reasoning visible, and\n  a human-review case showing which playbook rules failed. Evaluations done to tune confidence scoring via system\n  prompt iteration. Pricing: workflow-based initially, outcome-based (cut of recovered revenue) as the end state.\n  Roadmap: multi-turn agent that reads carrier replies and auto-drafts responses; learning loop from successfully\n  closed threads to build carrier-specific playbooks over time. Edge advantage: already embedded in a TMS company and\n  connected to the data sources.\"", "builder_name": "Vishu Gupta", "builder_linkedin": "https://www.linkedin.com/in/vishugupta1/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788547477329.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=haPIdpxtqMKtvvowFZQrRbjlGIS1YL2TmsySEBRNsNg%3D", "banner_url": null, "user_image_url": null, "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1giz_t4adFTEqYMkXPuuc4LSaPq8hw_KV/edit?usp=sharing&ouid=114585898931099979706&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "602cfb78-9a7c-48a6-a138-359323f1f18c", "project_id": "76d5dec6-8a71-49ee-a408-f17d49ed02fc", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "e0e19f1a-5061-4831-9895-24fc7b186ba4", "title": "DigiFreezerTwin", "description": "\"Biplab built DigiFreezerTwin around a specific, overlooked bottleneck: every online grocery order passes through the\n  frozen backroom — a 200 sq ft sub-zero space that nobody is optimizing. Four problems collide there simultaneously:\n  wasted motion (converts directly to labor cost), FIFO violations from misplaced SKUs (creates shrink), peak-hour\n  pick-window collapse, and cold exposure fatigue and turnover — all rooted in one cause: unsequenced work paths. The\n  solution is a live digital twin of the freezer paired with an agentic pick-path optimizer. Architecture is\n  deliberately split: a deterministic control plane owns all the math (2-opt route solver, FIFO checker, demand\n  forecaster, KPA engine) and a probabilistic AI plane (Claude running Observe → Plan → Act → Reflect) calls those\n  solvers as tools — the agent never invents a path or count from scratch. Every recommendation includes its reasoning\n  and human approval gates for rezoning decisions. The agent gives associates one next move and one short reason;\n  they walk less, stay warmer, and maintain FIFO compliance. Demo simulation: 6 SKUs queued, optimized path — 42-meter\n  walking distance down to 30 meters (29% reduction), FIFO at 100%. Moat: evolving labeled corpus — every executed\n  pick path becomes a training case, making the system sharper shift by shift in a way a general AI assistant cannot\n  replicate. Business model: per-store subscription plus a share of verified savings (upside tied to outcomes). Ask:\n  one freezer pilot to prove the loop, then scale on evidence.\"", "builder_name": "Biplab Dutta", "builder_linkedin": "https://www.linkedin.com/in/biplab-d-2407911/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1788547146669.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=gTv4XoypF%2B6J3KtxwbFw1CQ5uk7p8aIkspFcEnqbgew%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1788546979752.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=70YN2JEpLhMYG5BHwH0tR22fqgHcI03%2BFGzdqKhQDhI%3D", "video_link": "https://drive.google.com/file/d/1v7rCNMmmRZt9xCAJdTsdEnA5RZsekL1N/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1ANU9fMTpGlOl1u8NGZ2KNXxO8o5KnWBM/edit?usp=drive_link&ouid=106012053015190289253&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "34596c8d-b5a1-4bf4-88c5-8c00389bf674", "project_id": "e0e19f1a-5061-4831-9895-24fc7b186ba4", "section": "awards", "rank": 999, "award_name": "Best Agentic Design", "cohort_label": null}, {"id": "6256e9f3-e427-41fa-98b6-dcf018aa04cc", "project_id": "e0e19f1a-5061-4831-9895-24fc7b186ba4", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "6cfb54a9-124a-4e15-a24c-020f1562d771", "title": "ProblemDefinitionAgent", "description": "\"Shankar built a Problem Identification Agent to break what he called \"\"confident writing\"\" — the tendency to fund products based on polished solution decks without validating the underlying problem. His stats: 95% of new products fail; 42% of startups failed due to lack of market need; JTBD-aligned products succeed at 86% vs. 17% industry average. Target personas: VCs, enterprise DRIs, startup founders. The system works in three stages: (1) Upload pitch deck PDF → Fluff Filter Agent strips the solution out and extracts only the problem statement, identifying functional, social, and emotional jobs-to-be-done; (2) Proof Finder Agent sends the market claims to a Tavily web-search agent for real-time fact verification — each claim is checked against live sources; (3) CDA Scorer\n  (deterministic, pure JavaScript — not LLM) produces a score 1–100 graded A/B/C: 40% weighted on JTBD coverage and\n  60% on verified market evidence. Output: two tabs — a Fact Check tab (what was verified) and a Gap Lock tab (what\n  dimensions are missing). Demo: Shankar's own pitch deck with emotional job removed → scored 93; re-added emotional\n  job → scored 100, gap lock closed. Cost: $1.22/month hosting, $0.04/run, 97% gross margin. Pricing: $1.09/month for 3 free analyses plus co-op licensing. Competitor: Pitch Score ($20/month) lacks the architectural scoring and CDA layer.\"", "builder_name": "Shankar Ranganathan", "builder_linkedin": "https://www.linkedin.com/in/ranganathanshankar/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1787842085077.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=nJuIAGASZXd%2BKQ4n0SbVV%2F0v2cpCb73EjPm4c1DpIQs%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1787842085965.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=Kl9ehZlNwjB8h0ImmOS%2BBlIpJAqcuWCfFCalp6r27bE%3D", "video_link": "https://drive.google.com/file/d/1iFaT3bv2reH8zHfSuOmlhUlyMpDLtYsk/view?usp=drive_link", "workflow_link": null, "doc_link": "https://drive.google.com/file/d/1vl_0DKuMxuZFUvy7mPjLVbzMgDwOUnYa/view?usp=drive_link", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "f9c42a25-4fd9-40e1-8099-083b5f574483", "project_id": "6cfb54a9-124a-4e15-a24c-020f1562d771", "section": "top10", "rank": 5, "award_name": null, "cohort_label": null}, {"id": "fad8ca5d-a4af-411c-baf6-cb3225032fe4", "project_id": "6cfb54a9-124a-4e15-a24c-020f1562d771", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "3e643f15-52b7-40b0-9114-3744588bb258", "project_id": "6cfb54a9-124a-4e15-a24c-020f1562d771", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "9a2eb2ca-df16-4990-9829-d5e18720e377", "title": "AI Assessment and Intelligence Agent", "description": "\"Avi comes from a data engineering and strategy background (not product), and built his idea around the problem he\n  encounters most in his consulting and corporate leadership roles: the enterprise AI assessment process is slow,\n  expensive, and heavily human-dependent. When any organization tries to determine where they stand on AI readiness —\n  identifying bottlenecks, prioritizing use cases, understanding ROI gaps — they either engage external consultants\n  ($15K–$50K per engagement, 4–12 weeks) or rely on ad hoc internal judgment. The framework Avi replicated is based on\n  the DAMA data management assessment model, extended to cover AI dimensions. The system takes three input\n  dimensions: (1) industry/company profile (revenue, size, high-level attributes); (2) AI budget, tech stack, and data\n  readiness; (3) governance posture. Three parallel agents score each dimension independently, share context through\n  a common JSON layer via a JavaScript merge node, and feed into a synthesizer LLM that generates a unified\n  recommendation report. Output: a PDF assessment covering current-state scoring, problem areas, and indicative\n  approaches — described as \"\"not executive-ready\"\" but functional as a door-opener for both consulting and corporate\n  conversations. Roadmap: add more dimensions, build a dashboard with live tracking, tie recommendations to\n  ROI-tracked action items. Core thesis: companies are failing to realize AI ROI not because AI doesn't work, but\n  because they haven't done a rigorous current-state assessment first. Built in N8N with Claude.\n --\n The Problem: Enterprise AI assessments are traditionally slow, heavily dependent on human consultants, and expensive ($15k to $50k), taking anywhere from 4 to 12 weeks to complete.\n \n The Bottleneck: Organizations struggle to realize ROI on AI because they skip or fail to perform proper, structured readiness assessments.\n \n The Solution: An automated tool mimicking the DAMA framework that collects data, processes variables, and generates horizontal strategic recommendations to bridge the gap between initial state and execution.\n \n The Logic Loop: A three-stage process: Input Data Collection $\\rightarrow$ Data Processing $\\rightarrow$ Recommendation Generation.Multi-Agent Context: Utilizes three distinct agents mapping across different organizational dimensions (Industry/Scale, Tech Stack/Data Readiness, and Governance Posture) that merge into a single JSON output. A final synthesizer LLM translates this unified context into a structured, executive-ready PDF report.\"", "builder_name": "Avinendra Chauhan", "builder_linkedin": "https://www.linkedin.com/in/avinendra-chauhan-bb699514/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1786402678607.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=Mo9utOmtwvUURG3vfUOEhqVFCkB2f1KY44LDUvU6V%2FY%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1786402679334.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=c8WbxJwG8cQPScBanmqzA2kjT7Rckow8Cxg1f2vW6z4%3D", "video_link": null, "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "89472af1-6096-4f1c-b753-9e2da9ae8fa5", "project_id": "9a2eb2ca-df16-4990-9829-d5e18720e377", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "7534f3ac-1092-41f8-b461-8ccc72a3130f", "project_id": "9a2eb2ca-df16-4990-9829-d5e18720e377", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "0e0c8f69-38ac-4293-9e0a-cc853e0ea962", "title": "TripShastra", "description": "\"Manjunath built Trip Shastra to solve his own problem: his wife's extremely specific hotel requirements (must be\n  downtown, must view Google Street View of surroundings for safety, hotel rating minimum 8, and many more criteria)\n  make family trip planning exhausting. His user research found the true time cost is 30–35 hours per family trip —\n  not the 10–15 hours people initially estimate, once the full planning workflow (destination shortlisting, deep\n  research, hotel comparison, flights, cab logistics, preference balancing) is counted. Trip Shastra takes a single\n  natural-language input (source, destination, dates, number of people, budget, preferences, activity types) and runs\n  four parallel agents — local sightseeing, hotels, flights, and transport — coordinated by an orchestrator agent. The\n  orchestrator identifies which agent handles which task and distributes work, bringing the 35-hour process down to a\n  few minutes. Demo: Bangalore to Mumbai, 4 people, 4-star minimum, beach and cultural activities, no nightlife,\n  moderate budget — agents ran simultaneously and returned a granular day-by-day itinerary with hotels, flights, and\n  cabs. He also built a separate local LLM setup so his wife can use the tool independently. Business model: freemium\n  → booking commissions (hotels, cabs); proposed a revenue-share partnership with Kranthi (another cohort member who\n  built a hotel reservation tool) — Manjunath drives users, Kranthi converts hotel bookings, both share the\n  commission.\"", "builder_name": "Manjunath Sanjeev", "builder_linkedin": "https://www.linkedin.com/in/manjunath-sanjeev/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1786402131771.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=pQ1Xq7V%2BgsnAJp0L%2Fy4stwSYCVZ5e%2BwaoLNS1SHQsCo%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1786402133294.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=NSJwBlAzLvgchkqLUS2BREl77Q3pJRvYWDEPrNaTwM4%3D", "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1hllaFycziOlAMEgNa4RIg_QskL_FV3_R/edit?usp=drive_link&ouid=105592479947081270234&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "c8ef0a62-f565-4579-9936-a243d3e69648", "project_id": "0e0c8f69-38ac-4293-9e0a-cc853e0ea962", "section": "top10", "rank": 9, "award_name": null, "cohort_label": null}, {"id": "b59da04a-14e6-406d-9485-c6dd1196feb1", "project_id": "0e0c8f69-38ac-4293-9e0a-cc853e0ea962", "section": "awards", "rank": 999, "award_name": "Best Parallel Agentic Design", "cohort_label": null}, {"id": "cb5e3a97-7383-45ca-9f67-3fbcd3974ec9", "project_id": "0e0c8f69-38ac-4293-9e0a-cc853e0ea962", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "9b1e6bc7-3d0b-4f31-a8c6-21be7b31ba3a", "title": "Rhythm Assistant", "description": "\"Latha built Rhythm to fix the timing failure in wellness apps. Her user research finding: 80% of wellness\n  recommendations are dismissed without action; of 33 respondents, only one followed through consistently. The problem\n  is not a behavior problem — it's that recommendations arrive when recovery is impossible, not when a gap actually\n  exists in the calendar. Existing wellness apps have great content but no schedule awareness. Rhythm is a \"\"choice\n  architect\"\" — it monitors the user's Google Calendar, finds micro-gaps (15 or 30 minutes between commitments), and\n  sends a contextual nudge at exactly the moment when a recovery activity is actually feasible. The approach is\n  libertarian paternalistic: it suggests, never dictates. Users set guardrails at onboarding: which days, which time\n  window, which activity types they're open to. MVP is deliberately minimal — only 4 recommendation types, constrained\n  by mentor feedback to avoid over-building before content is validated. When a nudge is sent and accepted, the\n  activity is logged. When dismissed, the reason is captured. All stored in memory to learn which recommendations\n  resonate with each individual. Demo: N8N form submission → agent analyzes schedule → returns a recommendation → user\n  accepts or dismisses. Not yet integrated with Supabase. Target user: working parents with kids 5–12, managing dual\n  schedules. Market framing: $5.6T wellness market; $61B employer wellness spending; persistent burnout problem\n  despite investment.\"", "builder_name": "Latha Ranjani Sundaresan", "builder_linkedin": "https://www.linkedin.com/in/latharanjanisundaresan/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1786401961259.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=uV42AMhKPB0tT6p26g%2FdzrRijOzkXO%2FGhKeUf2R76Dc%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1786401963175.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=5akaKhF5B3%2FVSL81%2FGf6jQLDhJ7knICH6PlJP06om5I%3D", "video_link": "https://drive.google.com/file/d/1dx3-YCF-m3vphFZT-7PMNBnwj2zir1NM/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1GwSHOE4yAJHQQOUwRK1oDup3Q5WymcPn/edit?usp=drive_link&ouid=108965335986787826876&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "d24dd4bc-f33e-435d-af2c-0f693f9aa247", "project_id": "9b1e6bc7-3d0b-4f31-a8c6-21be7b31ba3a", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "7fd8b6e1-02a4-473c-b744-f3d326efe5a1", "project_id": "9b1e6bc7-3d0b-4f31-a8c6-21be7b31ba3a", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "7581927b-38ef-41e6-be12-896607020308", "title": "Forward1 - LLM Wiki", "description": "\"Hiren comes from escalation and support engineering and built Forward1.ai to address a gap in customer support\n  architecture: vendors deploy powerful AI internally but their customers still open tickets, write zero-context\n  problem descriptions, and wait through back-and-forth triage. His concept: every B2B vendor should deploy an AI\n  Forward Deployed Support Engineer inside the customer environment — grounded in the vendor's documentation, KB\n  articles, playbooks, and policies (loaded as LLM wiki markdown files, inspired by Andrei Karpathy's LLM wiki\n  concept). The customer's developer describes a problem, adds context (environment, priority, version), and the agent\n  retrieves relevant resolution steps with a confidence score and source citations, showing its retrieval path\n  transparently. If the resolution works, the admin can approve it and it gets permanently added to the wiki —\n  compounding knowledge over time. If the agent is not confident, the customer escalates and the system automatically\n  pre-populates a CRM case (Salesforce, etc.) with the full AI conversation history, so the vendor's human engineers\n  start with complete context instead of zero. Admin panel: skill-loading for specialized domain resolution, approval\n  workflow, activity logs. Built entirely on Claude Code (no N8N available, built custom UI and backend). Competitor\n  context: Sierra.ai (Brett Taylor) at $200M ARR, $900M funding — validates the market. Per-ticket cost for human\n  support: $100–$150. The product reduces that cost and customer churn risk.\"", "builder_name": "Hiren Shah", "builder_linkedin": "https://www.linkedin.com/in/hiren-shah-6365b91/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1786401763927.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=FofoE5m82%2BcdW%2FCio09hfQStGnieaf3A0oj%2F8eY0K3k%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1790021396623.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=15v70Wde7TUT%2B0YNuALhWHBK0HwjSFcRwO8L8SBT6TE%3D", "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1EWSUCEwv5nndbeEAugPu9dTzA9D1t44pxuroVaYL3YY/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "d9a99d36-59d5-42ed-8a75-06e9939a4dfd", "project_id": "7581927b-38ef-41e6-be12-896607020308", "section": "awards", "rank": 999, "award_name": "Best Data Moat Strategy", "cohort_label": null}, {"id": "872d06ea-ecdc-4966-9654-0fa0376225f5", "project_id": "7581927b-38ef-41e6-be12-896607020308", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "0e9f7199-1e2e-4744-8734-8c9d19babd39", "title": "Ownership Language Coach", "description": "\"Denise leads culture transformation at a software services company (~1,800 engineers in India) and its associated\n  foundation for kids, both of which she is trying to pivot toward an AI-ready ownership mindset. She did not formally\n  sign up for a demo session (\"\"I did not sign up for a session because mine fell apart\"\") but shared her journey as a\n  learning case. The problem she set out to solve: her company operates with a heavy service culture — engineers do\n  what they're told rather than exercising ownership and ambiguity tolerance, which is necessary for AI work. She has\n  had real success using specific vocabulary (\"\"non-negotiables,\"\" ownership-framing language) to shift behavior over\n  time — measured by how often people use that language in transcripts when she's not in the room. Her MVP was an N8N\n  workflow: pull meeting transcripts from Google Meet → tag speakers, anonymize → score against an ownership rubric →\n  generate coaching notes for delivery leads → write results back to Google Docs, creating a flywheel of personalized\n  coaching at scale. The technical pipeline worked perfectly, but the rubric failed — the ownership evaluation was too\n  subjective and broad for the AI to score reliably. She identified the unblock: build an eval harness first, get the\n  rubric right before automating the workflow. She ended the session asking the group for experiences dealing with\n  such ambiguous, qualitative AI evaluation challenges. Not monetization-focused — the internal culture change is the\n  product.\"", "builder_name": "Denise Cheung", "builder_linkedin": "https://www.linkedin.com/in/denise-tran-cheung/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1786391588580.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=z2ZiAcY97tCvSC6EbboElK3jg1OkguBNUfbOEvMNXBA%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1786391589066.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=5Q4NBIkiM%2FUivWYgOiEI4Y4prnba4f1eiaCSErquUGI%3D", "video_link": "https://docs.google.com/document/d/1jEf5T7Bbb143Eo8L0jlPVEDGy9rZMT70D8tk-bxtQyI/edit?usp=sharing", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "9c1377df-992a-41e4-9bdb-e4d9a334d4df", "project_id": "0e9f7199-1e2e-4744-8734-8c9d19babd39", "section": "awards", "rank": 999, "award_name": "Moonshot Idea", "cohort_label": null}, {"id": "b4c126d9-2fe8-495d-a165-968060b9cd73", "project_id": "0e9f7199-1e2e-4744-8734-8c9d19babd39", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "b419dd94-c6be-45d6-bcab-6ba0865d4609", "title": "NurtureOS", "description": "\"Sahil built NurtureOS, a personalized child development platform for parents. The problem: parenting apps give\n  generic age-bucket advice; school reports are 30–40 pages of jargon with no actionable next steps; and parents have\n  no personalized signal for what works best for their specific child. His flow: parent enters child details and\n  location → 8–10 swipe questions build a learner profile across 6–8 dimensions → school report uploaded and analyzed\n  by 3 agents (academic, social, behavioral) → conflicts between parent observations and school report are surfaced\n  and resolved by the parent → nearby activities are recommended with Google reviews, match percentage, and distance.\n  Next steps include email integration, multi-year trend tracking, and WhatsApp check-ins to follow up on activity\n  outcomes.\"", "builder_name": "Sahil Aggarwal", "builder_linkedin": "https://www.linkedin.com/in/sahilaggarwal1808/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1786391359675.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=E%2B05WgQwmNP58%2FPOrMrsG1U6oryWk%2BWYMPV57ojOLRs%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1786391360135.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=3pRFPULO%2BRArJ8Cht1nsB0A04yPIvYd3JXQ78lk4G4A%3D", "video_link": "https://drive.google.com/file/d/17sfFmXnwKqjEeoB-Nmf3PoiIktl5nxv8/view?usp=sharing", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1m7Itqr0cG080yyY9fYM8ULprVJF-ApXvRa6139NohAw/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "e9011ef6-e6d0-44e7-9ffc-acb0deb3d65b", "project_id": "b419dd94-c6be-45d6-bcab-6ba0865d4609", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "1bb7ca4b-7f0d-4c84-9df4-fe394a158558", "project_id": "b419dd94-c6be-45d6-bcab-6ba0865d4609", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "1c5d2da0-5ab7-4f8e-8246-0008c4593493", "title": "CapitalFusion", "description": "\"Jaya built CapitalFusion to bridge the gap between small businesses with disorganized financials and the lenders who\n  want to fund them. The problem: lender-facing AI tools are abundant, but SMBs — who often have financials scattered\n  across files in various formats — have no tool to normalize, analyze, and present their data in a lender-ready\n  package. Hiring financial consultants to do this is expensive. She built two agents in Azure AI Foundry: a Financial\n  Normalization Agent that ingests any file format and outputs P&L, balance sheet, and cash flow; and a Credit\n  Readiness Agent that benchmarks the normalized data against standard Canadian bank ratios to produce a credit\n  readiness score and recommended financing amount. Scope is deliberately limited to debt financing only. Validated on\n  10 Kaggle business datasets.\"", "builder_name": "Jaya Sridhar", "builder_linkedin": "https://www.linkedin.com/in/jaya-sridhar/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1786390750351.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=0nM2nMGjEIUuwSyiP%2Bdsc3oVmtV0tyxvXSupLBNPAFo%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1786390750827.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=dMCPHg8AVEy7lpX4oICdJIGyBi1kOBLqXV5E4cDb5lo%3D", "video_link": "https://docs.google.com/presentation/d/1HgdSVpc30Yb7L42DSz9nztpXaAZS87Co/edit?slide=id.p1#slide=id.p1", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1HgdSVpc30Yb7L42DSz9nztpXaAZS87Co/edit?slide=id.p1#slide=id.p1", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "e008cfd7-0917-4b39-b2f1-59d0d5cd3b9c", "project_id": "1c5d2da0-5ab7-4f8e-8246-0008c4593493", "section": "top10", "rank": 6, "award_name": null, "cohort_label": null}, {"id": "fa21fa68-878b-4e09-bd78-2c39a6961a85", "project_id": "1c5d2da0-5ab7-4f8e-8246-0008c4593493", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "5edf676a-b3da-4740-8829-f4331b4a22d8", "project_id": "1c5d2da0-5ab7-4f8e-8246-0008c4593493", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "dde808bc-a8b4-492c-9ad4-dc4489923f39", "title": "CraveAI", "description": "\"Amit built Crave AI to solve a specific failure point in food delivery: Swiggy and Zomato solved supply\n  (availability) but not choice (decision). He personally takes around 30 minutes to decide what to order, and\n  research shows 58% of users struggle with the same problem — users know how they feel, but can't translate that\n  emotional state into a specific food order. Crave AI converts mood-based or context-based craving input into a\n  ranked food recommendation. The UI presents keyword tiles (e.g., fast food, quick delivery, budget Rs. 600) — the\n  user selects what fits their current craving, clicks Find My Food, and the agent interprets the intent explicitly\n  (\"\"fast food with quick delivery suggests prioritizing speed over cuisine quality\"\"), then surfaces ranked options\n  pulled from Swiggy MCP and Zomato MCP integrations. The user can thumbs-up or thumbs-down each result; this feedback\n  feeds a per-user taste profile that reranks future suggestions. If the initial recommendations miss, the agent\n  offers a clarification flow (\"\"Did you mean something else?\"\") with alternate categories. Business model: referral\n  commissions of Rs. 2–8 per order routed through Swiggy or Zomato; freemium core with monthly subscription for\n  premium features. Market: $30B India food delivery market projected at $140B by 2030. North Star metrics: orders per\n  active user and craving-to-order conversion; also tracking D7/D30 retention. Next steps: knowledge graph for better\n  LLM context, golden dataset for evals and fine-tuning, then pilot. Roadmap: dine-out reservations (Swiggy\n  dine-out), voice assistant for conversational ordering, group decision-making for families, and eventually a\n  personal AI consumption agent across food, groceries, travel, and entertainment.\"", "builder_name": "Amit Karamchandani", "builder_linkedin": "https://www.linkedin.com/in/amit-karamchandani-b7943b13/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1786389951699.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=aTZ%2FRwqK4uQ5wH40OxRE8tzdrJcKluC4Cu3IF72C0gI%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1786389952405.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=216E%2FcOZ9cJPktNXtrDx9L6gS4WR2G1vp5VbQGmzb4o%3D", "video_link": "https://drive.google.com/file/d/1oiOoHagtrXM4zhBndc9GLzZeitbMgOYr/view?usp=sharing", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/12gpuAImvpdUdg3w3vPCAn3loqIeWUrCR/edit?usp=sharing&ouid=110509280102162434492&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "43042845-3e8a-440f-bab0-1f5c653f3eaf", "project_id": "dde808bc-a8b4-492c-9ad4-dc4489923f39", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "5aefd9cf-9eea-4b2c-a734-821310132217", "project_id": "dde808bc-a8b4-492c-9ad4-dc4489923f39", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "06edd78e-d62b-4de0-8c2f-473b57aef8a4", "title": "BatchSafe", "description": "\"Hans built BatchSafe for a real client: a cider brewery in Ireland. European food production is heavily regulated —\n  every batch must be certified with a full audit trail, and any deviation must be traceable back to production. The\n  problem: the brewery's production workers are on their feet on the factory floor; all compliance logging was done on\n  paper scraps then occasionally migrated to Google Docs — scrappy and audit-risky. Solution: a Telegram-based mobile\n  interface (no new app to install; workers use the chat app they already know) — workers speak or type batch\n  information directly into their phone → N8N agent checks the input against ingested CIDER production compliance\n  documents stored in Supabase → immediate feedback: green (pass), amber (concern), or red (stop production) with\n  specific action instructions. Demo video: Pat at cider brewery says \"\"Batch 50, Pasteurization Unit 1, Temperature\n  68°C, Hold 15 seconds\"\" → agent confirms the inputs → checks compliance docs → RED: stop production. Manager views a\n  web dashboard with complete batch history, verdicts, and details — always audit-ready. Eval work done: initially\n  everything was flagged red (too strict); tuned until it returned honest amber results and appropriate \"\"need more\n  information\"\" responses. Stack: Telegram + N8N + Supabase + Claude Sonnet + OpenAI for RAG ingestion. Pricing:\n  $200/month; 8,000 food producers in Ireland alone → 50 customers = $120K annual. Roadmap: compliance → stock\n  management → finance integration.\"", "builder_name": "Hans Winkelmann", "builder_linkedin": "https://www.linkedin.com/in/hanswinkelmann/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785972589230.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=bsa57lhqWJiyI05o6fJunVGZe6BZQo6vqt%2BGveHgpBs%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785972590026.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=dPho7U52fvx3d5N8lqSfNrVS8crqmr0hpojKaXsecig%3D", "video_link": "https://drive.google.com/file/d/1MuBbAXzMaF-T6bl478w9bzdyRwqTyyGW/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1_m6NfMlu0kxq26chZQ5kc0VpqDv9xVCAY2GfJjNPEDw/edit?slide=id.p#slide=id.p", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "2de50b68-dbf4-4b56-8e3e-95e58cf72def", "project_id": "06edd78e-d62b-4de0-8c2f-473b57aef8a4", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "35eb3caf-6d3f-477a-a524-65e1094e39f8", "project_id": "06edd78e-d62b-4de0-8c2f-473b57aef8a4", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "44220f66-178c-4e28-8ec4-6b6a7f3b0376", "title": "Grid Seven AI", "description": "\"Nihit (15 years working closely with CEOs, COOs, and Chiefs of Staff on transformation strategy) built Leadership OS\n  to fix execution drift — the gap between what executives commit to strategically and what their organizations\n  actually deliver. He targets mid-sized companies (hedge funds, boutique firms, under-1,000 people) with a single\n  Chief of Staff or a small C-suite. The product has three agents: (1) Strategic Intel — reads live investor relations\n  documents, board meeting minutes, and strategy docs, extracts priorities, asks the Chief of Staff to confirm before\n  writing to the graph; (2) Operational Signal — intended to connect to Jira or Clarity and tie ground-level\n  execution signals to the initiatives that matter to the C-suite (future state); (3) Drift/Escalation/Decision engine\n  — calculates a drift score (< 50 = critical risk, > 50 = healthy) based on execution dependencies, decision\n  backlogs, and ownership clarity; generates escalation docs from templates; produces a one-page briefing that can be\n  sent as PDF to the CEO. Additional module: Tiny Fish integration pulls live market sentiment and weights it into the\n  drift score. Demo: Bethany Franco (Chief of Staff at Airbnb sample company) — extracted Q1 2026 investor\n  priorities, confirmed selections, tracked initiatives on command center, generated escalation doc, produced one-page\n  briefing. Stack: Claude + Supabase + Microsoft Foundry (6–7 agents). Pricing: $25K/year (benchmarked as 50% of\n  Workboard's $50K, ~10% of one Chief of Staff salary).\"", "builder_name": "Nihit Bhargava", "builder_linkedin": "https://www.linkedin.com/in/nihitbhargava/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785972022311.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=75TlcaduDUPu6NhLTTSugCyIyWzBdlfsrYE2y2sNwfc%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785972022906.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=kCsoI%2FE3CYDsqADeKX9QJ3Lvvy%2BoKjTeizJXv5FIB8w%3D", "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1XWhcXjWyhYYIf42Ui1jDcY5m18KhNE0g/edit?slide=id.p1#slide=id.p1", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "814c2811-3f61-4760-bac6-3a110d4e1165", "project_id": "44220f66-178c-4e28-8ec4-6b6a7f3b0376", "section": "awards", "rank": 999, "award_name": "Best AI Innovation - Leadership & Strategy", "cohort_label": null}, {"id": "37724e0f-88ee-4e43-9e0a-224e765cf916", "project_id": "44220f66-178c-4e28-8ec4-6b6a7f3b0376", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "03b0196c-5542-4050-8107-f1ef79f03808", "title": "StorySmith", "description": "\"Sunil built a Content Localization Studio to solve a bottleneck in his own project: creating native-language audio\n  content for an Indian family kids app. Before the course, he had been asking his wife to record stories; AI now\n  makes this automated. Demo: takes an English fable → multi-agent pipeline runs. Agent 1 evaluates age\n  appropriateness (grades 2–4 years, 95% confidence) and screens for profanity or non-kid-friendly content. With human\n  approval, Agent 2 translates into Hindi (not word-for-word but preserving the storytelling voice — \"\"as a mom or\n  grandparent would tell it\"\"). Agent 3 generates a natural narrative script line by line. Agent 4 synthesizes the\n  audio file. Inline editing: if a single line's emotion is off, edit that line and regenerate just that line's audio\n  without redoing the entire file. Output feeds into his kids app. Architecture: ClaudeCode + Google LLMs + Firestore\n  + Firebase for auth and file storage; HHH evaluations built in. Roadmap: audio-first MVP → audiobook platform →\n  YouTube voiceover content → multilingual YouTube channels.\"", "builder_name": "Sunil Gangavarapu", "builder_linkedin": "https://www.linkedin.com/in/sunil-gangavarapu/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785971796201.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=%2FF%2BDqxAo%2BukZw%2B2ygU13kTbEa91p%2FDHatgr%2BADNaHxc%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785971797060.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=v8AKJAdWE16J82K4x7bBvP6KFGrC5xlyyZBLVIv95Dg%3D", "video_link": "https://drive.google.com/file/d/1TicF15S9_Z5ZmRbDzehIp5wLTJcbCIS4/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1sY8UqJxGh0ujwv4DhLbKurae9NrHoxpFcSBZHotQaDk/edit?slide=id.p6#slide=id.p6", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "c7da2f59-40ba-4e63-ae02-ab8e4c79020c", "project_id": "03b0196c-5542-4050-8107-f1ef79f03808", "section": "awards", "rank": 999, "award_name": "Best AI Innovation - Content Localization", "cohort_label": null}, {"id": "2ed83bcb-f089-4d12-8a36-af4462821d68", "project_id": "03b0196c-5542-4050-8107-f1ef79f03808", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "bca6e024-0894-4508-8401-5dacb9ecda85", "title": "Wonder Plot", "description": "\"Surbhi (a sales account manager at SCL Tech serving Walt Disney World) built WonderPlot to eliminate the decision\n  fatigue parents experience when planning kids' activities. The trigger: Friday night, five open apps (weather, Yelp,\n  calendar, Facebook group, Maps), 30 minutes later still no decision. The product is not a chatbot or recommendation\n  engine — it is an agent that reasons through tradeoffs, checks conflicts, learns from every activity the family\n  does or skips, and builds a compounding preference graph that a static model cannot replicate. Parents provide child\n  ages, location, and budget in a 60-second Claude conversation (no sign-up), and receive a ready-to-go two-week\n  activity plan, each card showing distance, cost, and the AI's reasoning. After each activity, a 30-second feedback\n  check-in retrains the system. Under the hood: N8N orchestrates three workflows; the plan generation workflow has 9\n  nodes including an LLM-as-judge step (separate Claude call scoring the plan across 5 dimensions; plans below 7.0/10\n  are automatically regenerated before delivery). Full cycle runs in 8–12 seconds. Demo: Chen family, two kids ages 4\n  and 7, Orlando — 31 venues filtered to 18 matching, plan scored 8.2/10, delivered; post-activity feedback at Wakiva\n  Springs updated the preference graph in real time. Business: freemium → $9.99/month family tier or $26.99/summer\n  season; 92–97% margins; break-even at 500–900 paying families; targeting June 2027 launch with $150K–$250K pre-seed\n  ask. Key moat claim: no competitor is building a year-over-year child activity preference graph at scale.\"", "builder_name": "Surbhi Pandey", "builder_linkedin": null, "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785971309515.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=kgf875bsLy7qtpjB8yO2LS9EoYkKacj5OaxvptdhxBs%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1790015056291.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=wjK1I2yqsLUHhCryOmjXQ7aAkDhAPn%2BRVuTcIlgf0sk%3D", "video_link": "https://1drv.ms/v/c/f19951f22397df2d/IQBuy8bOCvd2T6xrgxzJT76DAQWzw4QTAJutGUcukWlDgOE?e=EVtqkW", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "19db3294-8185-4967-85b1-2f60da592f3b", "project_id": "bca6e024-0894-4508-8401-5dacb9ecda85", "section": "awards", "rank": 999, "award_name": "Best Preference Learning AI", "cohort_label": null}, {"id": "fe5a1f37-0ef7-413c-a57e-36cd4df38792", "project_id": "bca6e024-0894-4508-8401-5dacb9ecda85", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "41b2f2e5-c1c3-4c38-ba6e-0a27243df107", "title": "Packpilot", "description": "\"Parul built PackPilot after hearing a friend vent about a chaotic move. The product is a photo-to-inventory moving\n  assistant for renters and young professionals. Problem: 93% of renters surveyed said they couldn't find a specific\n  item after moving; people also lose deposits due to untracked wear and tear; planning a move consumes entire\n  weekends. PackPilot's flow: photograph any space → AI scans and categorizes every visible item, counts them, and\n  flags suggestions (keep vs. toss) → generates a numbered QR label for each box → at the new place, search by item\n  name to instantly identify which box contains it. Partner with cleaning and moving services to offer a one-stop\n  platform (15% referral cut). Demo: live photo upload showing item scan, categorized list with AI suggestions, and\n  printed QR labels. Pricing: freemium → Move Mode ($1.12 one-time per person, benchmarked against coffee-vs-pastry\n  willingness-to-pay); North Star metric: manifest-to-retrieval rate. Evaluation uses the HHH framework.\"", "builder_name": "Parul Mahajan", "builder_linkedin": "https://www.linkedin.com/in/parulmahajan03/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785970892805.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=idfb0u0Z%2FFsF%2FThHJyLWYGbEu02rphkznB0jSe%2BSOtg%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785970896400.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=S5vp4Wr0t%2FbcmA4uQaK8lF9Jn4e%2BVePLg6Y1UbQ22N4%3D", "video_link": "https://www.loom.com/share/c9fb5c8d86c64dad9f0ced7a43204401", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/16M7VDFF7s5Th0K-1ZaGuq4cToa5821Jv/edit?slide=id.p11#slide=id.p11", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "2a39838c-54ed-4c42-9fc0-4df2739c3791", "project_id": "41b2f2e5-c1c3-4c38-ba6e-0a27243df107", "section": "awards", "rank": 999, "award_name": "Best Physical World AI Application", "cohort_label": null}, {"id": "68f3e4fe-8225-4431-aabb-781443192a95", "project_id": "41b2f2e5-c1c3-4c38-ba6e-0a27243df107", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "092fb9a9-b3b4-4a21-91ac-481bbecf1f00", "title": "ParolePath AI", "description": "Sankar built Parole Path AI to modernize the parole leave process in the Indian judicial system. The problem: when a\n  prisoner applies for parole, the probation officer must review years of scattered historical data (family\n  circumstances, judicial amendments, police records — mostly in manual/paper form), conduct a field inspection, write\n  a report, and reach a 100% compliant decision. This process takes 14–30 days per case, with 60% of officer time\n  consumed by documentation rather than judgment. Parole Path AI handles three parts: (1) Intake agent — ingests leave\n  application via email/petition with voice-to-text + OCR, checks eligibility against Tamil Nadu Prisons Act bylaws,\n  issues a go/no-go with key extracted parameters (name, reason, date); (2) Field inspection assistant — mobile-first\n  voice dictation for field notes, auto-transcribes and classifies observation type, officer can edit; (3) Report\n  generation agent — synthesizes all evidence, issues recommendation, officer can override (human-in-loop), override\n  feeds back as training data. A fourth feature: when family or victim names are mentioned in notes, the system nudges\n  the officer to add them to a structured database, building context over time. Demo (audio voiceover): showed\n  Ramkumar's case — agent recommended emergency leave, but PO's field inspection revealed the mother's cardiac claim\n  was false and the victim family objected, so the PO overrode to reject, training the agent.\n \n --\n Sankar, based in India, built ParolePath AI to automate the parole assessment process for probation officers in\n  Tamil Nadu's prison system. The problem has three layers: data scarcity (historical records are scattered across\n  paper files, government databases, and manual notes — spanning 5–15 years of a prisoner's sentence during which\n  families move, laws change, and officers change); compliance risk (any approved leave for a public-safety threat is\n  a serious failure, so every assessment must be 100% grounded); and backlog (60% of a PO's time goes to manual\n  documentation, and each report takes 14–30 days to produce). Three-agent system: (1) Leave application ingestion —\n  email or in-person submission, voice-to-text OCR, legal guardrail that checks the application against Tamil Nadu\n  Prisons Act bylaws and returns a go/no-go decision with extracted parameters (name, reason, circumstances); (2)\n  Field inspection — mobile-first app where the PO voice-records observations on-site, the agent transcribes and\n  classifies them (family/victim/evidence type), the PO reviews and approves, and corrections to agent recommendations\n  feed back into training; (3) Report generation — agent synthesizes all inspection notes and application parameters\n  into a structured compliance report with recommendation. Continuous entity capture: when family members or victims\n  are mentioned during any interaction, the agent surfaces a prompt to add them to a persistent database, building\n  richer context over time. Next steps: image/document processing, social risk modeling. Architecture: N8N + Claude +\n  OpenAI, with human-in-the-loop throughout.", "builder_name": "Sankar Panchaksharam", "builder_linkedin": "https://www.linkedin.com/in/sankar-panchaksharam-97592338/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785968960745.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ByK5PY8os4XyuvjFAekH768H1ssUlkQHUWdaPbA1jOg%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785968961699.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=pToti%2FLrGUq2KA2CFp6a0R0sDdHYkvXSg4iXLXWvcwY%3D", "video_link": "https://www.loom.com/share/f0761ab2d2eb49eebb51f704eb1651a5", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1aodXTPTd0HgU36Z_hJJ7570zIL8Fz-eS/edit?slide=id.p1#slide=id.p1", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "9a502015-f06f-4c8b-ba81-941b7e9660db", "project_id": "092fb9a9-b3b4-4a21-91ac-481bbecf1f00", "section": "awards", "rank": 999, "award_name": "Best AI Innovation - Civic Justice", "cohort_label": null}, {"id": "75259325-65d3-4cbc-a2d0-09e61aaf5dff", "project_id": "092fb9a9-b3b4-4a21-91ac-481bbecf1f00", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "1f69569e-d1c5-4754-aa0f-4645d5a36449", "title": "FirstPass", "description": "\"Darren, a former wedding and aerospace photographer turned PM, built First Pass to eliminate the most time-consuming\n  step in professional photography post-production: culling. A single Saturday wedding generates 10,000–15,000\n  images; photographers spend 4–16 hours selecting the best 40–100, which is 40% of total post-production time. The\n  urgency is real: \"\"Uncle Bobs\"\" post phone photos to social media by Saturday night, and by Sunday morning clients are\n  asking for their photos. Sports photographers face the same problem at deadline speed — first photo to wire (Getty,\n  Corbis) gets the front page. Adobe Lightroom detects only technical defects (blur, exposure), not taste or style.\n  First Pass learns the photographer's personal aesthetic through a feedback loop (where rejects go, where picks go)\n  and culls an entire shoot to the best selections in under 15 minutes with rationale for each pick. Evaluation: 85%\n  of First Pass picks make the final gallery = success. No demo available (presentation only, as advised by mentor).\n  Pricing: $15 basic / $25 pro. Roadmap: MVP for weddings → sports → style-based editing as future vision.\"", "builder_name": "Darren Sabino", "builder_linkedin": "https://www.linkedin.com/in/darrensabino/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785967419127.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=gp%2FEOxNPjvfIAQOEGeAvSPTSzuHn3z2YfQCkssbzu3Y%3D", "banner_url": null, "user_image_url": null, "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1qCHmR8qJdhkXZ5z2LoeQKrqE9P0RI_Sn/edit?usp=sharing&ouid=118439738764607420946&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "d47ffb45-8eaa-482e-a701-5cd7848b9658", "project_id": "1f69569e-d1c5-4754-aa0f-4645d5a36449", "section": "awards", "rank": 999, "award_name": "Agentic AI Innovator", "cohort_label": null}, {"id": "9b087d67-41f8-4401-bab5-ee50f7d28df8", "project_id": "1f69569e-d1c5-4754-aa0f-4645d5a36449", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "a90000d0-ecbb-4d23-ac92-7ee04f8fba00", "title": "PM Conductor", "description": "\"Rajani, a GPM managing 5 PMs, built PM Conductor to solve a pain she lives daily: routing 40+ issues from Slack\n  channels to the right PM manually wastes time and causes delays. She built an n8n workflow integrated with Slack\n  bots that listens to messages, filters noise vs. real issues, classifies by product area using an ownership map, and\n  routes to the correct PM with a summary, next steps, and citation to the original post. She also built an LLM judge\n  evaluation layer with a golden set of 48 product areas and a scorecard after each routing. Current accuracy is 7\n  out of 15 records routing incorrectly — she plans to enrich the golden set and improve the worker agent prompt. Next\n  steps include expanding to other channels and improving GPM visibility when the agent takes no action.\"", "builder_name": "Rajani Yadav", "builder_linkedin": "https://www.linkedin.com/in/rajani-yadav-07960113/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785967195372.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=lS5SmK3u1wmQjdHC7cNH10tZ0S56nMMyldYZUTF4sws%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1790015703517.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=LQWT0GP%2FpZXMKjb8x7gStBwq6u0K9q9KbucQt8UCtaw%3D", "video_link": "https://drive.google.com/file/d/1ntx2Ipk87NCeiUuCArNZP1lKhJN4uL2f/view?usp=sharing", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1Y-JbzoJKS3OrjT4epxMXcq7CUSrgS-Nd/edit?usp=sharing&ouid=104300026721775064130&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "6d4c0129-de79-4691-854f-e682880ddc5a", "project_id": "a90000d0-ecbb-4d23-ac92-7ee04f8fba00", "section": "awards", "rank": 999, "award_name": "Best AI for PM Operations", "cohort_label": null}, {"id": "13aeb93d-40f8-4fd9-8eaa-b2bb326ba15b", "project_id": "a90000d0-ecbb-4d23-ac92-7ee04f8fba00", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "6eadeb08-9f75-474d-a8f8-824d553c1137", "title": "Stumble", "description": "\"Jatin, based in Perth, Australia (presenting at 2AM), built Stumble to solve a very specific Saturday morning\n  frustration: stressed parents open Google to find a family activity, get 50–100 results or 47 Facebook group\n  suggestions, and make zero decisions in 30 minutes. Stumble returns one recommendation — not a list — with address,\n  cost, best time, a tip, and a reason. Input: kids' ages, suburb, weather, budget, and last activity visited (memory\n  call). Architecture: Claude Code frontend + Azure AI Foundry backend, with file search for locations and a live web\n  search for events; seasonal logic shifts recommendations during school holidays (away from crowded paid venues). V1\n  is deliberately stateless — no accounts, no persistent memory — to ship fast and eliminate data privacy liability.\n  Evaluation framework: triple-H (helpful, honest, harmless), 20 questions across 3 product dimensions, 15 golden test\n  cases, 85% pass required to ship V1, rising to 92% for V2. Pricing: freemium (2/week free, Family plan unlimited).\n  V2 roadmap: persistent memory, auto-weather detection, multi-agent architecture, expansion to Melbourne.\"", "builder_name": "Jatin J", "builder_linkedin": "https://www.linkedin.com/in/jatin-janiyani-32a0674/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785966336309.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=hZU0pLI6xZ5KZV0ElrJfdGxbDEICwP6FlIJwLRXtwcs%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.
