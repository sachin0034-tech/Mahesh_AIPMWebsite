net/project-thumbnails/user-images/1790014897125.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=QMrWXRITL2BHKaeW%2FCX63r2yu1z8As2dKZq2RUmYRqE%3D", "video_link": "https://www.loom.com/share/ec0ef4348915439294c7d665aefef18c", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1f4n7rIY3guCwl_tWTwzeBnKBaHOF4FbkP7DqepiKtuE/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "3eecbf92-4266-4fad-9bf4-578f3290ace0", "project_id": "6eadeb08-9f75-474d-a8f8-824d553c1137", "section": "awards", "rank": 999, "award_name": "Best Constraint-Driven AI Design", "cohort_label": null}, {"id": "cc0c779e-d5f5-42ed-9e28-ff2f9f248db1", "project_id": "6eadeb08-9f75-474d-a8f8-824d553c1137", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "2200cbed-4baa-4d10-a482-2c6f2654ff67", "title": "Alpha AI", "description": "\"Karl built Alpha AI as an autonomous equity research and stock monitoring tool for an underserved market: registered\n  investment advisors, sub-$15M family offices, and professional individual investors who are completely ignored by\n  enterprise-grade tools (which target $30M+ hedge funds and bulge bracket banks). The core problem: finding\n  undervalued stocks is time-consuming and expensive. With hundreds of thousands of stocks, each requiring analysis of\n  filings, earnings, financial ratios, and news, average analyst research time is under 30 minutes per stock —\n  meaning most analysts cover the same popular names repeatedly and miss the long tail. Five-agent architecture: (1)\n  Valuation agent — scans historical price-to-sales ratios, flags stocks 1–2 standard deviations from their historical\n  mean and from their sector average; (2) Financial agent — analyzes balance sheet, cash flow, earnings trends; (3)\n  News agent — surfaces recent developments that may explain the price anomaly; (4) Risk agent — determines whether\n  the low valuation is genuine mispricing or reflects an underlying structural problem with the company; (5) Ranking\n  agent — synthesizes all inputs into a ranked recommendation list. Continuous monitoring: after a stock is flagged,\n  the system continues watching it and alerts the user if valuation metrics deviate. Self-improvement loop: compares\n  recommendations against 30/90/180-day returns to evaluate whether picks outperform the S&P 500 (target: 95% of the\n  time). Architecture: Next.js frontend, Claude agent, N8N for data fetching and alerts, Snowflake for storage,\n  integrations with Yahoo Finance, NASDAQ, S&P. Could not demo live (bugs remain); described architecture and\n  rationale. Regulatory positioning: deliberately structured as a ranking/analysis tool (not investment advice),\n  avoiding advisory regulatory requirements.\"", "builder_name": "Karl Atiyeh", "builder_linkedin": "https://www.linkedin.com/in/karl-atiyeh/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785966012217.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ETKgqPfALZTXrhYdOJSlM2yLusTZBDtRy42p5YQLOpU%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785966012794.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=orGvnQpekhMoI2wIzh5KrwJ1NB7hv8HHMVLyrHtYtHY%3D", "video_link": null, "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "57e49c15-8c4f-4ec1-83a7-c00c4959c6b0", "project_id": "2200cbed-4baa-4d10-a482-2c6f2654ff67", "section": "awards", "rank": 999, "award_name": "Agentic AI Builder", "cohort_label": null}, {"id": "9aef0a99-8ade-465a-bdbd-f7e84112a1b7", "project_id": "2200cbed-4baa-4d10-a482-2c6f2654ff67", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "848b2fd0-6af0-42f6-af00-6e8ea321ac21", "title": "GP Decision", "description": "\"Izabella, a global product leader and expansion strategist, built a Global Product Sequence Multi-Agent — a decision\n  support tool for scale-up consumer platform leaders deciding which market to enter first. Based on qualitative\n  research with 25 leaders across scale-ups and companies including Amazon: most leaders make expansion decisions\n  before strategy, evidence, and cross-functional readiness are fully mature. The pain points are compressed decision\n  timelines, fragmented multi-source evidence that keeps evolving, and cross-functional siloes with misaligned\n  incentives. The tool answers one focused question — \"\"which market should we enter first?\"\" — via 7 specialized agents\n  collaborating over a shared data and knowledge layer (ingestion, retrieval, and synthesis focus). Output is a\n  CPO-level decision memo. Three core design choices: multi-agent for accuracy, accuracy-first model selection (for\n  reasoning and explainability over cost), and dual-layer evaluation (evidence quality + synthesis outcome) with\n  human-in-loop. MVP hypothesis: will leaders pay for higher-confidence expansion decisions? Current state: early\n  mock-up; next steps are user-friendly UI, business model, and data strategy before testing market assumptions.\"", "builder_name": "Izabella Koukorava", "builder_linkedin": "https://www.linkedin.com/in/izabella-koukorava/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785965693452.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=Yw9CgD844ONB4aUkRgUZzTQ5sNiDScOPbpk%2FNZZ0bgg%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785965694573.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=LEJ3IOy%2FcM%2FABuW%2BA1J5rEid3FVA5dFjUDwxDmAPyUA%3D", "video_link": null, "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "90a775d5-7161-4f44-a96c-fa550f8f4a73", "project_id": "848b2fd0-6af0-42f6-af00-6e8ea321ac21", "section": "awards", "rank": 999, "award_name": "Best AI Product Pitch Award", "cohort_label": null}, {"id": "7bc23111-27b6-473f-b6d8-0cc624796193", "project_id": "848b2fd0-6af0-42f6-af00-6e8ea321ac21", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "b94839a3-087c-4939-85e6-e04e645ab92a", "title": "VynAI", "description": "\"The product's core value IS an AI-native GTM motion: VIN AI acts as the first sales rep, calling leads autonomously, qualifying by intent confidence score, and routing hot leads to human reps. The GTM strategy leverages AI as the distribution mechanism — not just to support it. Creates an unfair advantage: sales motion scales without headcount, which traditional Tier 2 city dealer onboarding cannot match.\n\nVynAI - AI voice agent IS the sales rep; calls leads, qualifies by intent, routes hot leads to human closers. The\nAI executes the GTM motion.\nvs \nLectern - product demos itself at conferences to professors, converts to PLG, then institution. AI-native distribution design.\"", "builder_name": "Hritika Mehta", "builder_linkedin": "https://www.linkedin.com/in/hritikamehta/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785965349570.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=lglk6T%2BhBI65twl139VG6isqrebjtfBXeNUv4u5DhyI%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785965350362.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=bov766HVj5Ww32UTg0YaIqiNd4f7TiMm1tyS%2FRo9VeA%3D", "video_link": "https://drive.google.com/file/d/1L-KxQrUyT-3h1Mce8JVsVqgdtGhvpfGI/view?usp=sharing", "workflow_link": null, "doc_link": "https://drive.google.com/file/d/1h42Pa8ipfta_ZObI-GA_rH52VdrwFtJg/view?usp=drive_link", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "7499fec3-6604-4cc8-9d02-aebefe9bb1cd", "project_id": "b94839a3-087c-4939-85e6-e04e645ab92a", "section": "top10", "rank": 1, "award_name": null, "cohort_label": null}, {"id": "976ab14d-db66-41bb-bf48-4e6496a321a7", "project_id": "b94839a3-087c-4939-85e6-e04e645ab92a", "section": "awards", "rank": 999, "award_name": "Best Agentic GTM Strategy", "cohort_label": null}, {"id": "7a02032a-ccd7-43f1-8e87-e26322f26f0d", "project_id": "b94839a3-087c-4939-85e6-e04e645ab92a", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "cfff3044-d6ca-46f2-8a9d-ccf60177e817", "title": "Deal Room", "description": "Alex built DealRoom to fix a broken B2B sales experience: everything about a deal lives in scattered email threads,\n  buyers chase status, sellers fly blind on what the buyer actually cares about, and deals stall and go cold. DealRoom\n  is one branded, secure space per deal. Buyer view: deal status, documents, pricing, mutual action plan, and an AI\n  co-pilot that answers questions with every claim cited to its source document — and is architecturally blocked from\n  ever retrieving seller-only internal notes (100% retrieval precision in live eval). Seller view: AI drafts deal\n  updates for seller approval before anything surfaces to the buyer; seller sees buyer engagement signals. Admin\n  control room proves it's working: strict access leak gate, answer quality scored per audience, token costs per call\n  tracked, learning loop driven by feedback. Architecture: Claude Code + Azure + Supabase, two role-scoped agents.\n  Built in 4 minutes of demo time — visibly production-ready.", "builder_name": "Alexander L", "builder_linkedin": "https://www.linkedin.com/in/chef-/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785964750238.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=8jK0OLAlK%2BaSvzLUsciEZkxag6PXWOqi%2B3LoPc5I%2Fvs%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1786037321912.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=BqbmLJbDD%2FVgC492V%2BuhegU7kADwdKuRPJcy%2F0t76gk%3D", "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/document/d/1D-zm4Xn4Y85Va5JFve-ulncdHozmU_aGXf93yZCTw20/edit?usp=drive_link", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "e6258212-d2e8-435d-8dfb-8ded46e4eafb", "project_id": "cfff3044-d6ca-46f2-8a9d-ccf60177e817", "section": "awards", "rank": 999, "award_name": "Best B2B Sales AI", "cohort_label": null}, {"id": "16ea90c5-1873-454e-a9fa-cd5e142db913", "project_id": "cfff3044-d6ca-46f2-8a9d-ccf60177e817", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "82be7c4e-69fd-4c35-9095-3dd4e5479bc2", "title": "Values-first Contract Studio", "description": "\"Macy, an IP law educator who teaches design students to read and negotiate contracts, built Values First Contract\n  Studio — a contract review agent that deliberately withholds interpretation until the creative has articulated what\n  matters to them. Problem: creatives sign agreements in language not built for them, and AI tools that immediately\n  summarize risks bypass the user's judgment and produce passive consumers of legal opinion. Macy's hypothesis: a good\n  legal advisor always asks for context before interpreting risk — because a risk in a 3-month gig is different from\n  a risk in a multi-generational business. The tool: upload a contract → agent identifies a risky clause (e.g. a\n  buried moral rights waiver) → asks the creative what matters to them → gate model judges whether they have taken a\n  real position → only then unlocks interpretation grounded in Canadian IP law plus discussion prompts for\n  negotiation. The gate is enforced architecturally in N8N, not in the model itself. Two knowledge bases: the\n  elicitation framework (Macy's years of teaching methodology) and Canadian IP law. Evaluation North Star is\n  qualitative: did the creative take a real position and can they explain it? Safety hard zero: never writes final\n  language or issues a verdict. Current state: gate and grounded interpretation live; frontend designed but not\n  connected. Mission: \"\"How can we make AI reliably withhold so the human stays the author?\"\"\"", "builder_name": "Macy Siu", "builder_linkedin": "https://www.linkedin.com/in/macysiu/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785761552978.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=VNy3Ut7OxlsPJ2PkPoxm86oS4I56lu0zT5gBkT6XueM%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785761553881.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=yrxlbYnuMocyXSr64gcdKUzVxC7zQhxlm2fesBuAgkU%3D", "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1S4VBy8yJ-TJXVMKjMm_9I1lHgBnx_wpM/edit?usp=sharing&ouid=115822318800703199888&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "7cfc76a1-97e2-4b08-9799-31d96e1200c5", "project_id": "82be7c4e-69fd-4c35-9095-3dd4e5479bc2", "section": "top10", "rank": 10, "award_name": null, "cohort_label": null}, {"id": "83075ba9-0661-434b-9c5e-9af29becc48c", "project_id": "82be7c4e-69fd-4c35-9095-3dd4e5479bc2", "section": "awards", "rank": 999, "award_name": "Most Innovative Use of AI", "cohort_label": null}, {"id": "2e85e601-022f-4bf6-9d48-6eb2d33f0fa9", "project_id": "82be7c4e-69fd-4c35-9095-3dd4e5479bc2", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "75ebd6e7-6ed9-4f42-aa3e-453bde0c21d8", "title": "DirectStay", "description": "Kranthi, based in the Bay Area, built DirectStay around a simple arbitrage: booking directly with a hotel is always\n  cheaper than using Expedia or Booking.com (they charge 15%+ commission), but no existing AI agent actually makes\n  that direct reservation on your behalf. AI tools today focus on trip planning and itineraries — nobody solves the\n  actual booking transaction. Two-sided pain: travelers overpay because they can't negotiate at scale; independent\n  hotels (30–40% of 60,000+ US hotels) overpay OTAs to remain discoverable, and actively want to cut them out.\n  DirectStay is an API-first conversational booking agent: user sends a text with travel dates and city, gets a list\n  of hotels with pros/cons, selects one, and the agent emails the hotel directly to negotiate a rate. Confirmation\n  details come back via email. Business model: free API for any travel company to integrate, 5% commission from hotels\n  on completed reservations (vs. 15% OTA take). Break-even: 2,500 reservations/month. Currently partnered with 2 Bay\n  Area hotels for live testing. Roadmap: evaluations on chat-to-book conversion rates, expanded hotel network,\n  consumer trust-building. Key metric tracked: chat-to-book conversion rate.", "builder_name": "Kranthi Kandi", "builder_linkedin": "https://www.linkedin.com/in/kranthikandi/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785761396671.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=LcvC3dsaNzyAenhUJ8EQxuHrSWog6GGtbUuo6YvoRzE%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785761397327.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=W7vRQrRkpRgFKJSxoj4S1eG51Qt0uypY%2FrDoQYQvwCg%3D", "video_link": "https://www.loom.com/share/9de39d46ca4e4abb94fb39bb764edd4b", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "75c9fb7d-1782-4a9c-96bb-a617c765c319", "project_id": "75ebd6e7-6ed9-4f42-aa3e-453bde0c21d8", "section": "top10", "rank": 9, "award_name": null, "cohort_label": null}, {"id": "3df540af-e775-4880-bf07-fc4f6ba28d36", "project_id": "75ebd6e7-6ed9-4f42-aa3e-453bde0c21d8", "section": "awards", "rank": 999, "award_name": "Most Market-Ready Idea", "cohort_label": null}, {"id": "a259912e-bcfe-482c-b83a-e405d2dbacf6", "project_id": "75ebd6e7-6ed9-4f42-aa3e-453bde0c21d8", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "d14532c9-c0b0-476b-a90e-060eda81744c", "title": "Dossier", "description": "\"Saudamini presented via a pre-recorded video — a deliberate choice to stay within time. Her product, Dossier, solves\n  the long-relationship problem in real estate: the buyers who take 12 years to be ready go with the agent who stayed\n  in their corner the whole time — not the one who followed up fastest. The gap: no real estate agent can hold\n  hundreds of relationships in their head for a decade, and existing CRMs track deals, not people. Every lost\n  relationship is a missed $12,000 commission on a $400K home. Total market gap she estimates: $750M, with zero\n  purpose-built tools. The core mechanic: after any client interaction, the agent voice-logs to Dossier — no forms, no\n  typing. \"\"First call with Sarah Mitchell, met at open house on Habersham Road — 4 bedrooms, large backyard, daughter\n  starts middle school, school district is a top priority.\"\" Sarah becomes a living profile. Every subsequent\n  conversation stacks on top: six months later, Dossier knows the daughter's name, her age, and that the family has\n  expanded their search area — context the agent could never hold mentally. Pre-meeting: Dossier generates a fresh\n  brief before every interaction. The agent can listen hands-free on the drive over. Proactive: when the agent is\n  about to call Sarah, a phone widget surfaces her latest context automatically. Listing match: a browser extension\n  highlights the right client at 91% match with criteria breakdown when a new listing drops. Architecture: 5 agents —\n  ingest, extract, enrich, synthesize, surface — built on Supabase, N8N, GPT-4o Mini, and Whisper. AI operating cost:\n  $0.86/user → ~95% margins. Pricing: free at pilot → $49/seat at beta → $100/seat at full launch. North Star: not\n  logins — \"\"enriched briefs actually opened\"\" (2/month at pilot, 5 at beta). \"\"Open means trusted.\"\" Roadmap: mobile app\n  → agentic playbooks → live listing matching engine → full AI-native CRM.\"", "builder_name": "Saudamini Sehgal", "builder_linkedin": "https://www.linkedin.com/in/saudaminisehgal/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785761108183.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ta67s7cCtcJagHS%2FA1cvd6p0ubUrTWqvH64zAXAJXJI%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785761108846.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=IdyLEXqczaEyJBDiM%2Bzjq%2BYhF9owdDzwkV%2B5RKEOs%2B4%3D", "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1Pu_3lBVEgBJNtyWuqHSM1exILXy_A8msD2GvzsqNBnA/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "86017587-bec1-46ce-afd4-d54affc63cb5", "project_id": "d14532c9-c0b0-476b-a90e-060eda81744c", "section": "top10", "rank": 8, "award_name": null, "cohort_label": null}, {"id": "70e4b081-41d2-4047-a706-4d1b7810e89a", "project_id": "d14532c9-c0b0-476b-a90e-060eda81744c", "section": "awards", "rank": 999, "award_name": "Best Data Moat & Relationship Intelligence AI", "cohort_label": null}, {"id": "4ffb7f87-5157-492a-af3c-79ae456dd8ce", "project_id": "d14532c9-c0b0-476b-a90e-060eda81744c", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "17cf07b9-d3b4-4393-b107-c3a580beac8c", "title": "GrantSignal", "description": "\"Jackie works at a nonprofit and built GrantSignal for the clients she supports daily - she's solving a problem she\n  watches up close. The core issue: nonprofits want to pursue grants but evaluating whether a grant is even worth\n  applying for takes 20–40 hours per grant, often ending in a \"\"no apply\"\" decision after all that work. Each\n  application itself is 60–100 pages. Organizations cycle through this process repeatedly, never reaching a rate of\n  return that justifies the effort. The agent's job: make the \"\"should we apply?\"\" decision fast and accurate.\n  GrantSignal takes the nonprofit's profile (mission, past grants, service areas, demographics served) - which can be\n  uploaded or pulled from public datasets - and compares it against available grants. Each grant gets a scorecard with\n  a recommendation: apply now, consider for later, or skip. The scoring surface is a dashboard where nonprofits can\n  immediately see their best-fit opportunities and the rationale behind each. Built on Azure AI Foundry using a\n  labeled dataset of grants, associations, and evaluation examples. Tested with in-house clients who found it\n  valuable. North Star metric: hours saved making the apply/don't-apply decision. Pricing: modest start with per-brief\n  pricing for single or bundled grants; custom plan for high-volume search.\"", "builder_name": "Jackie Adhiambo", "builder_linkedin": "https://www.linkedin.com/in/jackie-adhiambo/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785760641107.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=KFqmCupuMYH2EJHstZsv4r2V8Tgr8TDAnibpGOiiSYw%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785760641963.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=BXNBQHf3QoFknCbFD%2FtlgYQMbQztNvrsr89xxM2fkA4%3D", "video_link": "https://grantsignal.netlify.app/", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/17KzDVCmmp56_PyJgN28o_RKR1jgnLM202G8CmVxjEow/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "ce757020-5bc4-4aa2-9011-4abb6a878774", "project_id": "17cf07b9-d3b4-4393-b107-c3a580beac8c", "section": "awards", "rank": 999, "award_name": "Best AI for Grant Management", "cohort_label": null}, {"id": "731aa24e-e4d2-4b3a-8aec-c65d4c2fed2e", "project_id": "17cf07b9-d3b4-4393-b107-c3a580beac8c", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "9650e8d0-259b-42ce-92a4-88ee2c0461e0", "title": "Holly — AI Work Coach", "description": "\"Darcy built Holly, an AI job coach for neurodivergent employees, designed to operate alongside a human\n  Gallup-certified coach. Problem: 15–20% of the workforce is neurodivergent, yet 85–90% are unemployed or\n  underemployed; $122.8B annual economic cost from adult ADHD alone. Existing support (job coaching) is scarce,\n  expensive, and time-limited. Holly's model: the human coach conducts deep Gallup Strengths interviews and validates\n  Holly's responses, building a golden ground-truth dataset used to fine-tune Holly over time (starts as prompt + RAG,\n  moves to LoRa adapter); target is 70% preference over ChatGPT in blind tests. GTM anchor: the Department of\n  Rehabilitation (DOR) already funds solutions to exactly these problems and is a named pilot sponsor. Pilot plan: 10\n  coaches + 10 neurodivergent participants over 8–12 weeks. Pricing: ~$150/month vs. $100+/hour for a human coach.\n  Moat: structured, expert-validated knowledge of a specific person — not a chatbot, a knowledge system. Darcy also\n  built her own personal Claude OS using context files integrated with Plaid (auto-records conversations), designed to\n  her own ADHD specs with David Allen's GTD framework embedded as an advisor persona.\"", "builder_name": "Darcy Feld", "builder_linkedin": "https://www.linkedin.com/in/darcyfeld/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785759969104.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=njURU1wPz2A2xt%2FZgZSxMcJu7YCbsZojBAhXCvWHe7g%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785759969909.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=cSM1I67gzb3K4srPq1GzD%2FOD2hdyI2mT04C%2BxfpWxGY%3D", "video_link": null, "workflow_link": null, "doc_link": "https://drive.google.com/file/d/1wsnYDDy-NuL949_mhFxaV7HEFQxr0AGV/view?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "502b8150-40fd-40bf-87e1-671976ec2b1d", "project_id": "9650e8d0-259b-42ce-92a4-88ee2c0461e0", "section": "awards", "rank": 999, "award_name": "Best AI for Workforce Inclusion", "cohort_label": null}, {"id": "3a5e1b77-d110-44a5-8f86-58a93c959840", "project_id": "9650e8d0-259b-42ce-92a4-88ee2c0461e0", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "e9708f40-21b7-4492-869c-c1963252bb80", "title": "PoreProof", "description": "\"Kishore is a fintech product manager at Uber and built PoreProof as a consumer skin-tracking product for teens and\n  young adults. The problem: skin changes slowly, so it's genuinely difficult to know whether a routine is working\n  without systematic tracking — and multiple dermatologist visits are expensive and inconvenient. Daily routines\n  (sleep, swimming, medication, face products, vitamins) all affect the skin, but no tool correlates them against\n  visible skin changes over time. PoreProof asks users to take a daily photo and log their routine. The AI analyzes\n  the image and generates skin scores across multiple dimensions (clarity, redness, texture, hydration) and stores\n  them as a personal dataset that grows over time. A chatbot lets users ask natural language questions: \"\"Is my skin\n  improving?\"\" \"\"What needs to change?\"\" The moat is the personal longitudinal dataset — high switching cost once a\n  user's history is established, something a one-shot AI analysis tool can't replicate. Architecture: image analysis,\n  result storage, chat interface; HHH principles applied; guardrails and evaluations planned. Eval plan: compare\n  against dermatologist assessments as ground truth. Current build: 7-snapshot tracking, wellness language, face skin\n  focus. Pricing: $8/month premium tier.\"", "builder_name": "Kishore Attaluri", "builder_linkedin": "https://www.linkedin.com/in/attvenkish/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785759129515.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=%2BG7u%2F%2FLH4Q9XQs%2BjS2bBWQ5%2F%2BxGbz1gS0imUrNzMDSw%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785759130078.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=95%2FfU5UX0olgKHj%2B29xuSJIDpjo2RukL81zUWVt7XfA%3D", "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1leckFcvWf41DamY-GPYowRYQw1sMaqPcgNX2raVggtg/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "c7eb203f-c2a0-40d2-be79-c01ca13e952c", "project_id": "e9708f40-21b7-4492-869c-c1963252bb80", "section": "awards", "rank": 999, "award_name": "Best AI Innovation - Health Tech", "cohort_label": null}, {"id": "0a76d89e-4146-49ad-9271-95dda59e60a7", "project_id": "e9708f40-21b7-4492-869c-c1963252bb80", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "32e2fab0-be8b-46c5-8a35-cff499561738", "title": "Ship Sentinel AI", "description": "Shweta has 10+ years in enterprise supply chain and built her product (called \"Agent Tech AI\" in her presentation,\n  \"Ship Sentinel AI\" in the award sheet) to automate logistics disruption decision-making for freight brokerage\n  operations. The problem: when disruptions hit (carrier delays, weather events, labor shortages), a dispatcher\n  managing 40–50 active shipments has to manually find out via emails and phone calls, then manually calculate\n  rerouting options — a process that can take hours or days. Gartner data supports that supply chain disruptions will\n  continue to grow, making this an expanding pain. The solution has three components: (1) deterministic rules-based\n  risk score engine — scores each disruption by severity based on customer tier, disruption type, SLA status, and\n  shipment history; (2) agent recommendation engine — surfaces one recommended action per disruption (reroute /\n  escalate / defer) with full reasoning trace, so the dispatcher never starts from scratch; (3) human-in-the-loop\n  approval — dispatcher approves, rejects, or defers; every human decision feeds back into the system as a learning\n  signal. The UI: a decision control tower showing all distressed shipments ranked by criticality, with reasoning\n  visible for each alert and trade-off screens showing cost of each option. Key challenge encountered: getting\n  realistic, connected supply chain data (ERP order → shipment → customer → disruption) was \"a huge pain.\" Also\n  navigated multi-agent evaluation complexity using Azure AI Foundry's red-teaming capabilities. Already has early\n  customer interest (two contacts want to see a solid use case before moving forward). Built on Azure, with a\n  knowledge graph for context.", "builder_name": "Shweta Sharan", "builder_linkedin": "https://www.linkedin.com/in/shwetasharan/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785758686009.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=7ZOOPIRyjNdMw8tRMQHTH1RgJaOx%2FBsqnu9%2F6PUQwXE%3D", "banner_url": null, "user_image_url": null, "video_link": "https://drive.google.com/file/d/1xOapF6Glb3Tyw6TpAPpdsZJjwGgZD0bF/view?usp=drive_link", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "f8a1cd58-391a-4c80-8a7f-e034081c2d20", "project_id": "32e2fab0-be8b-46c5-8a35-cff499561738", "section": "awards", "rank": 999, "award_name": "Best Human-in-the-Loop Design", "cohort_label": null}, {"id": "031ca2ed-815d-4b29-9d26-1edbfd7c5cff", "project_id": "32e2fab0-be8b-46c5-8a35-cff499561738", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "1bc0784d-13fe-4f84-9c18-0b9cfc3b2d22", "title": "Tenex", "description": "Ravi leads a 1-year-old organization of 150 data and AI product managers at a legacy company and built THENX to make\n  them more effective. The core problem: data scientists do solid analysis but face \"blank faces\" from stakeholders —\n  no decisions, no impact, wasted budget, and eventually eroded trust. Nobody has built a tool to help the data\n  scientist themselves land their work. THENX acts as a product management coach in three phases: (1) PRD coaching and\n  scoring against a 7-dimension rubric (Streamlit app using Sonnet 4.6, with pattern-based component weakness\n  detection, all runs logged); (2) prototype acceleration from validated PRDs; (3) adoption measurement to track\n  AI-native culture growth across the team (not a performance tool). Architecture is deliberately hybrid:\n  deterministic rules first to check if something is even an AI use case and prevent waste, then agentic for coaching.\n  Rollout: 8–12 PM pilot → full function → all 150 DPMs. Conservative ROI estimate: $450K savings at full scale. Ravi\n  positioned the $150K/year data science PM as the pricing anchor.", "builder_name": "Ravi Gopalan", "builder_linkedin": "https://www.linkedin.com/in/ravi-s-gopalan/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785758418151.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=mDURpngrCOAjX4paAtaoNxVRH5Kp6wwu5NYEfPsjEjU%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1790023197110.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=NwR8iy%2Bs1FNeo3KDZTSzpSve0BPLAv9jfWSD0U6uN%2FA%3D", "video_link": "https://drive.google.com/file/d/1InhKOVKDH_yXLnuGuen95d0GD2sa7Flk/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1O_EWWuAKfPHcA69pJcZf5JlGRXCp55W0/edit?usp=drive_link&ouid=103773047101235218297&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "31e0cd22-c0d7-49e4-b5a5-c35c4a9fdada", "project_id": "1bc0784d-13fe-4f84-9c18-0b9cfc3b2d22", "section": "awards", "rank": 999, "award_name": "Best AI Innovation - Data & Analytics", "cohort_label": null}, {"id": "8b7f7a40-cc38-4a24-a315-396f1d79d2a4", "project_id": "1bc0784d-13fe-4f84-9c18-0b9cfc3b2d22", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "db877a30-b2d9-4f52-8677-55dd6269f168", "title": "DataPM - Decision and Impact driver", "description": "Dhruv, with 20 years of data science experience, built DataPM — an AI product partner that helps data scientists\n  frame the right question, plan their analysis, and communicate findings so they land decisions with stakeholders.\n  The core problem: data scientists do good work but present to \"blank faces,\" no decisions are made, budgets are\n  wasted, and the data scientist gets branded low-ROI and eventually leaves. The gap is the \"last mile\" — turning\n  analysis into a stakeholder decision — and nothing currently helps the data scientist themselves make that leap.\n  Three interlocking agents: Framer (multi-round conversation to sharpen the question), Planner (builds the analytical\n  plan), Communicator (produces the final deliverable: deck outline, Slack summary, or email). Every project logs the\n  data scientist's voice alongside what landed with stakeholders, personalizing over time. Users can rate every\n  output — the feedback loop trains the system. Pricing: free tier to drive data/adoption, $29/month individual,\n  $19/seat enterprise; cost per project is 11 cents (90% gross margin). Target first cohort: beta data scientists\n  within this community network.", "builder_name": "Dhruv Bhargava", "builder_linkedin": null, "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785758060307.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ZP84XZGl8LecJFioMt%2BXF2ALskyn7VZCo%2Bf03sY27Mw%3D", "banner_url": null, "user_image_url": null, "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/13Spt1aTzzVBFnfpziS_3XIYYDR8Zv4d4qOSNxNE9pYU/edit?slide=id.p1#slide=id.p1", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "349e858f-c7b5-4a2c-9cd0-e0f3dd2dc26e", "project_id": "db877a30-b2d9-4f52-8677-55dd6269f168", "section": "awards", "rank": 999, "award_name": "Best Problem Solution Fit", "cohort_label": null}, {"id": "5aab377c-6450-41ba-9fc8-8a9cce8cad11", "project_id": "db877a30-b2d9-4f52-8677-55dd6269f168", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "a5f36a62-8409-4955-9a4e-bd6b24a6a92b", "title": "\"AI Commercial Decision Engine   Five-Stage Deal Intelligence for Enterprise AI\"", "description": "\"Tiffanie built the AI Commercial Decision Engine to solve \"\"pilot purgatory\"\" — the moment enterprise AI pilots\n  succeed technically but deals stall when pricing discussions begin, because founders can't justify numbers to\n  procurement or CFOs. The engine runs a 5-stage workflow: (1) Acceptance — reads company signals to determine if the\n  deal is worth pursuing (push/hold/reposition); (2) Qualification — sizes the value pool; (3) Proposal — generates a\n  defensible pricing range using three deterministic lenses (human replacement value, delivery cost formula,\n  context-adjusted value); (4) Negotiation — establishes walkaway floor and guardrails; (5) Renewal — projects renewal\n  range. Crucially, AI never sets the price — the pricing formulas are fully deterministic and auditable. Live demo\n  walked through a financial services deal generating a £57K–66K+ range. Validation from an enterprise AI director:\n  \"\"If I worked at Microsoft, I'd expect something like this plugged straight into the problem.\"\" Roadmap: auto-pull\n  company signals from Companies House and LinkedIn; build a companion tool for more ambiguous AI projects; feed real\n  deal outcome data back to improve recommendations.\"", "builder_name": "Tiffanie Burt", "builder_linkedin": "https://www.linkedin.com/in/tiffanieburt/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785757783115.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=6Ae9IIgjHpqJY8iAXYU6ukrwEBy%2BOSEYYjfgRU2vQco%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785757783666.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=YCXb%2B8t3%2Bk6e20%2BBiyFQBiUk7coO7qrtXKIDcHEjSaA%3D", "video_link": "https://drive.google.com/file/d/1ufHaA36Ei-0kFXqZauNIhLa_tsGokdUs/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1oM7RBBZsOE4KpsJ3Hy-LF5rKAfOTbLTl/edit?usp=drive_link&ouid=101283600689330198199&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "4a25a8f1-394b-4983-91ce-82b654e4d11b", "project_id": "a5f36a62-8409-4955-9a4e-bd6b24a6a92b", "section": "awards", "rank": 999, "award_name": "Best AI for Commercial Intelligence", "cohort_label": null}, {"id": "bf2f5f06-a8db-40e7-9ddc-5628a82cf9ed", "project_id": "a5f36a62-8409-4955-9a4e-bd6b24a6a92b", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "f01cfc32-e913-4abb-8dbb-6f4561739692", "title": "ARIA - Adaptive Runtime Interactive Ads", "description": "\"Harjot, who works in the ad industry, built ARIA (Adaptive Runtime Interactive Ads) — a prototype that personalizes\n  connected TV interactive ad call-to-action overlays in real time based on each viewer's position in the purchase\n  funnel. Problem: interactive CTV ads are growing but show the same CTA to all viewers regardless of whether they're\n  in-market (ready to buy) or in the awareness/inspiration phase; this kills ROI for advertisers. ARIA reads viewer\n  signals from the ad server (e.g., Sarah browsed Target.com → in-market; Matt has never visited → inspiration phase)\n  and decides in milliseconds which CTA to display — \"\"Shop Kids / Build Their School Kit\"\" for Sarah vs. \"\"Gift Ideas /\n  Explore\"\" for Matt. Built as an n8n workflow sitting between the ad server and viewer — no infrastructure changes\n  required for publishers or advertisers. Moat: performance data accumulated per publisher creates a switching cost.\n  Evaluated at small scale; next steps: 100K profiles, HITL scoring of CTAs, mixing CTA approaches. Acknowledged\n  agents could improve every stage: signal enrichment before decisioning, post-click email tailoring, etc.\"", "builder_name": "Harjot Grewal", "builder_linkedin": "https://www.linkedin.com/in/harjot-grewal-4ab5b711/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785757398401.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=IzkawSJtOEHOJRLp39bF%2FSVpbG9hst7MFGIjXiYhFL8%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785757398877.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=xxcd5UafXfW1VyoOHymCOeg8ZPIy0VDomMTp%2BoTvA7I%3D", "video_link": "https://drive.google.com/file/d/1r7XNHq76rlV8P4x4Tayycg68uB4x0TJK/view?usp=drive_link", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "e07f89ca-e0cd-4a6b-ae74-c2bea713bebe", "project_id": "f01cfc32-e913-4abb-8dbb-6f4561739692", "section": "top10", "rank": 2, "award_name": null, "cohort_label": null}, {"id": "70ca8492-d0da-4d9b-ae88-6daf77ec84a2", "project_id": "f01cfc32-e913-4abb-8dbb-6f4561739692", "section": "awards", "rank": 999, "award_name": "Most Innovative Use of AI", "cohort_label": null}, {"id": "d6ff73c8-5923-4279-b6c1-c8711c86e922", "project_id": "f01cfc32-e913-4abb-8dbb-6f4561739692", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "1eaadc2d-a74b-4d5f-a3a1-f1de439ee740", "title": "Investor Outreach & Relationship Intelligence Agent", "description": "\"Nikolaos, targeting emerging managers and first-time investment funds, built RAISE — an investor outreach AI agent\n  that automates LP targeting, personalized outreach, and portfolio updates. Problem: 60% of first-time funds miss\n  their fundraising targets; the cycle is long and capital gets consumed by operating costs. Features: a scored LP\n  list aligned to the fund's thesis, AI-drafted outreach emails with deterministic SEC guardrails (auto-block of\n  non-compliant claims), human-in-loop GP approval before any email is sent, a relationship graph with interaction\n  scores, a tamper-proof audit log of all actions including blocked ones, and automated compliance tests that fail the\n  GitHub CI gate if rules are relaxed. Key principle articulated: \"\"Compliance is the product — it cannot be bolted\n  on. Trust is more important than automation.\"\" Next: build a learning harness tracking which outreach methods produce\n  successful fundraising outcomes.\"", "builder_name": "Nikolaos Voutos", "builder_linkedin": "https://www.linkedin.com/in/nikolaos-voutos/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785757161434.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=qjER0ooaCoHR0XGGGa03dDMkSMgvIONBr0JUZDSOTPo%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785757161956.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=3S4IyP1KNwGg2fvz7euEgBfw9tecE1S4ESeGWlsOndo%3D", "video_link": "https://drive.google.com/file/d/1IskKrlTbzepWfnFgRyMgD90kr2DVwu51/view?usp=sharing", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "64bdaf00-f737-4065-a15f-ff37526e4c60", "project_id": "1eaadc2d-a74b-4d5f-a3a1-f1de439ee740", "section": "awards", "rank": 999, "award_name": "Most Market-Ready Idea", "cohort_label": null}, {"id": "f16b7f1b-a402-4996-904e-f0b38412dc29", "project_id": "1eaadc2d-a74b-4d5f-a3a1-f1de439ee740", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "82713da5-6620-40f8-9dd8-76fde01d415a", "title": "Primer", "description": "\"Primer — AI agent for home documentation and maintenance. Personal story: bought first house last August,\n  overwhelmed with closing documents, appliance issues cost money and confidence. 70% of homeowners feel overwhelmed,\n  80% of new homeowners, 75% of insurance claims stem from not knowing warranties. Architecture: n8n ingestion\n  pipeline, Supabase vector storage, Claude agent. Features: manual lookup by product name/photo/model number scan,\n  OCR for scanned PDFs, grounded AI chat citing specific manuals, shared home knowledge base. Demo: dishwasher clog →\n  Primer finds the right manual → step-by-step fix. Honest about challenges: 33% hit rate on manual discovery, much\n  time spent on building vs. formal evaluation, consumer willingness to pay uncertain given Home Depot's free\n  alternative.\"", "builder_name": "Zach Wasserman", "builder_linkedin": "https://www.linkedin.com/in/zach-wasserman/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785756842817.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=uEJHZUuRZXbBAP1whAcxhLDl%2B%2Bja2YmeQs%2BBiE0G1e0%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785756843522.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=iitKKZbMZ3IKzDEO8vTLq4w%2FNcjM8QguGHMiz7ypArE%3D", "video_link": "https://drive.google.com/file/d/1t3d8G4Vo49EcLw17PVRxyAJWGUTVZ5cP/view?usp=sharing", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1fF9Cd5WwKiuv1MNCuNl_AWAwEh6gyOfn3-v8cVASEJU/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "cb40a1d5-43b8-4fd5-81e0-e60c1e549c1e", "project_id": "82713da5-6620-40f8-9dd8-76fde01d415a", "section": "top10", "rank": 1, "award_name": null, "cohort_label": null}, {"id": "138c1d0e-1bb9-42ee-9c2f-0bdf7ff8f5e4", "project_id": "82713da5-6620-40f8-9dd8-76fde01d415a", "section": "awards", "rank": 999, "award_name": "Best Use of Tools from Our Labs", "cohort_label": null}, {"id": "2d65695e-69ba-4e43-8e00-70639994fc4c", "project_id": "82713da5-6620-40f8-9dd8-76fde01d415a", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "7de943fb-c69f-4727-a923-e8783f779146", "title": "GrowCubs", "description": "\"Vallari, a Senior TPM at Visa, pivoted mid-project from developer productivity (Visa data couldn't be demoed) to\n  GrowCubs — a teacher-to-parent intelligence layer for K-12 classrooms. Problem: teachers send generic weekly class\n  emails to all parents (\"\"this week we learned X\"\") with no student-level personalization; parents don't know what's\n  happening specifically with their child. GrowCubs generates a personalized weekly note and practice worksheet for\n  each student in one click, emailed directly to parents. Under the hood: 7 agents (summary, worksheet, insight, etc.)\n  with a PostgreSQL backend; AI confidence scores per summary (grounded, specific, complete, long-term); a teacher\n  feedback loop for self-learning; and LLM observability (model, token count, latency). Demo showed: load class →\n  generate week's update → per-student summary with confidence score → teacher refines → worksheet generated → email\n  sent to parent. Plans: Chrome extension to plug into Google Classroom and Canvas.\"", "builder_name": "Vallari Shah", "builder_linkedin": "https://www.linkedin.com/in/shahvallari/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785756613661.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=1%2F5C2ws6fwMhgJ65YwAAcIyGSSrWuHyJYLoU7GrLWMo%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785756614205.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=nF2LrhL7Xn2OMemQwZlDnrcxOcjU7OCBvIOO91UtqZ0%3D", "video_link": "https://drive.google.com/file/d/1A32k7baPcnU8bEdH-rRRmS1mzmPbbVps/view?usp=sharing", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "57f15fcc-9ee3-45a3-87f7-567d069cbf14", "project_id": "7de943fb-c69f-4727-a923-e8783f779146", "section": "top10", "rank": 4, "award_name": null, "cohort_label": null}, {"id": "8bf424d8-768d-494e-be7c-abeacb520752", "project_id": "7de943fb-c69f-4727-a923-e8783f779146", "section": "awards", "rank": 999, "award_name": "Most Thoughtful Personalization Design", "cohort_label": null}, {"id": "23e412df-05a7-4f4a-995a-ae19818151fe", "project_id": "7de943fb-c69f-4727-a923-e8783f779146", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "92b67a54-26f7-437a-817c-049259aaa560", "title": "Claros", "description": "\"Neeharika, from the customer data platform (CDP) world, built Claros — a consent compliance agent that sits in the\n  marketing activation path. The problem: when marketers activate audience segments to send emails, they must manually\n  check consent flags for every user (has each person agreed to receive marketing?); this is legally required,\n  error-prone, and done entirely by hand. Claros automates this: when a marketer activates a segment, the agent scans\n  each user against the master consent database, compares flags, and either approves or blocks the activation for each\n  individual user. Future extensions include other policy checks (third-party data sharing rules, business-specific\n  rules). Built with multi-agent architecture. Demo showed segment activation → agent scan → non-consenting users\n  flagged and blocked.\"", "builder_name": "Neeharika Adavikolanu", "builder_linkedin": "https://www.linkedin.com/in/neeharikaadavikolanu/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785756375687.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=xmtqgwKVisF38UgnbobOhJn8WHDEHWt0oAneuJe2FTg%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785756376397.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=wGx7gwNh4dN7xzpLoH2hSCBA%2BRtKiZHC%2FpzqQRKhpGg%3D", "video_link": "https://drive.google.com/file/d/133Grita-cPxgCpGFWa4IafPRPRieHVaj/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1vvL5B6CarzZl9oBTMdP4JDoNnimFRRp7XcOeOnHwaAY/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "ae3a63ca-1bb5-4c0c-bc7c-9934d4050ad4", "project_id": "92b67a54-26f7-437a-817c-049259aaa560", "section": "awards", "rank": 999, "award_name": "Best Privacy-First AI Design", "cohort_label": null}, {"id": "8c3c6c81-a6de-4548-b227-aa89a78ac714", "project_id": "92b67a54-26f7-437a-817c-049259aaa560", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "139d77b3-e2a8-46ad-bb8c-745fac6a321a", "title": "HealthCura AI", "description": "\"Kartiki, a TPM with healthcare experience, built HealthCura AI as her first product — an AI-powered patient intake,\n  triage, and routing system for small-to-mid-size outpatient clinics. The problem: admin staff receive freeform calls\n  and chat messages, manually enter data into systems, producing incomplete records and poor provider summaries.\n  HealthCura automates the intake conversation (a series of adaptive questions), performs triage and risk detection\n  (flagging emergencies like chest pain in red), generates a structured provider-ready summary, and routes to the\n  appropriate care setting — all without requiring EHR integration. Built on n8n and Claude Code with a HIPAA-aligned\n  evaluation framework; demo showed emergency and routine case flows with screenshots. Pricing: $99/provider/month.\n  Roadmap: expand from 1 to 3 agents, eventually migrate to Foundry. Market: $330B US outpatient market, 230K clinics.\"", "builder_name": "Kartiki Saraf", "builder_linkedin": "https://www.linkedin.com/in/kartikisaraf/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785755954426.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=aP1pvzEYLvYqA5TvWu%2FVmosFQZVZJg4q2SHwRDo4mEg%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785755954916.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=X7QVPCLUeneDz%2B9pmOGQDJJ2yGrqTCcpTny5KgKstvw%3D", "video_link": "https://drive.google.com/file/d/11TBTeFeaFGze0g3WkfoKKGPB-yLXtGYn/view?usp=sharing", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1Lu2Xx1qWgITAxbiw7dHCwiRQ62sW1WgV/edit?usp=sharing&ouid=113295583693904747263&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "0e65ccd3-986a-4f58-828e-d34cdb9dc885", "project_id": "139d77b3-e2a8-46ad-bb8c-745fac6a321a", "section": "awards", "rank": 999, "award_name": "Best Patient Safety AI Design", "cohort_label": null}, {"id": "824a902f-0a9d-4a06-924e-f0ef88c06088", "project_id": "139d77b3-e2a8-46ad-bb8c-745fac6a321a", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "cc7d6350-6605-4fb8-9ea9-cea4a882b389", "title": "Acquaint", "description": "\"Rani built Acquaint to lower the barrier to entrepreneurship through acquisition — specifically targeting the wave\n  of boomer-owned businesses coming to market as owners retire. One in four BizBuySell listings is a retiring boomer;\n  approximately 6 million businesses expected to transfer this decade totaling $5 trillion in value. The problem\n  Acquaint addresses: listings on BizBuySell are heavily curated by sellers who spend 2–3 months polishing their\n  online presence, using terms like \"\"turnkey\"\" and \"\"highly lucrative.\"\" The buyer can't easily verify the gaps, the real\n  employee climate, whether the head chef is the entire moat, or what's missing from the financials without deep\n  industry knowledge or an in-person visit. An average business acquisition search takes 19 months; the opportunity\n  cost of a bad bet is enormous. Acquaint's POC: paste a BizBuySell URL and receive an AI intelligence brief in 15\n  minutes across 8 dimensions, each with citations, scoring, and confidence levels. The brief also surfaces\n  intelligence questions to ask the seller or broker and flags what additional data would improve the analysis. Demo:\n  seafood restaurant in Maine (strong brief with a key risk flag — head chef is the main success driver); art studio\n  (honest assessment of insufficient data with a clear list of what to add next). Once generated, the brief joins a\n  pipeline view where the user can compare multiple listings side by side on each dimension. Pricing: per-brief or\n  bundle pricing for active search; custom plan for higher volume. Key learning: rich business data lives in\n  gated/private environments — improving data sourcing accuracy is the immediate next step. Roadmap: better data\n  matching → more source integrations → beta testing.\"", "builder_name": "Rani Arvapally", "builder_linkedin": "https://www.linkedin.com/in/raniarvapally/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785755749495.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=I0tROiKnQvwoxGtHGQLI0HT%2F6kaM77bQdD1ljAIjW2U%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785755750075.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=VO%2BOD4aYyh3LuRSn%2FA6VwqeAUo9YxeufM0btwsgelMA%3D", "video_link": "https://drive.google.com/file/d/19E2T-0CYzZC98wzlzg5RYegzmByeU5ib/view?usp=sharing", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "6253740d-14cf-4477-ab75-d078f92b2533", "project_id": "cc7d6350-6605-4fb8-9ea9-cea4a882b389", "section": "top10", "rank": 7, "award_name": null, "cohort_label": null}, {"id": "6d2f6dc7-f98d-48b7-8f9a-21307298ce70", "project_id": "cc7d6350-6605-4fb8-9ea9-cea4a882b389", "section": "awards", "rank": 999, "award_name": "Best Decision Intelligence Product", "cohort_label": null}, {"id": "dc3e6cea-fac3-4945-b7b3-7fe93b92ac47", "project_id": "cc7d6350-6605-4fb8-9ea9-cea4a882b389", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "196df3c3-9443-4ac3-b190-2c20d039f07a", "title": "ChargebacksIQ - An Intelligent Enterprise App", "description": "\"Ashit comes from the Enterprise Applications/ERP world and built ChargebacksIQ to address the indirect sales\n  complexity in life sciences manufacturing — specifically the chargebacks and contract dispute process between large\n  pharma manufacturers, GPOs (Group Purchasing Organizations), distributors, and end customers. Because products move\n  from manufacturer → distributor → contracted customer through multiple channel partners, ambiguities are endemic:\n  customers get added to GPO memberships without the manufacturer knowing, pricing eligibility mismatches accumulate,\n  distributor claims pile up in the millions of lines, and fraudulent or duplicate claims go undetected. Today's\n  deterministic contract management software handles the rules-based side (contract pricing, claim compute, payment)\n  but stops short of the AI layer needed to handle the messy, high-volume exceptions. ChargebacksIQ layers AI on top\n  of the existing deterministic workflow in three areas: (1) Entity resolution — address standardization and\n  normalization to resolve customer identity mismatches between GPO-submitted addresses and internal records; (2)\n  Pattern intelligence — anomaly detection across adjudication history to flag over-aging, overbilling, duplicate\n  claims, and volume spikes that suggest diversion (distributor selling at contracted price to non-contracted\n  customers); (3) Natural language analytics — Analytical Studio where analysts can interrogate millions of claim\n  lines in plain language, launch an agent to investigate a specific error, and get recommended next actions. Demo:\n  end-to-end app showing claim loading, approval/dispute/rejection stats, exception workflow where the AI agent\n  analyzes an anomalous claim and recommends whether it's a manufacturer-side or distributor-side data problem.\n  Architecture: AI intelligence layer built on top of deterministic ERP workflow.\"", "builder_name": "Ashit Taneja", "builder_linkedin": "https://www.linkedin.com/in/ashit-taneja-9bb67664/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785754950075.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=atMFB29OHbqctCCMrJH6%2BlFk97ToOrq%2BE9FkQ63ItFI%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785754950597.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=hY%2F%2BgWya1ZTm%2FyC3gW34PxjtXvTDiNdqm83TB9jKtQc%3D", "video_link": "http://localhost:5173/product-demo.html", "workflow_link": null, "doc_link": "file:///Users/ashittaneja/Contract/Contract%20Review%20Claude%20Code/chargebackiq-app/public/pitch-deck.html", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "d6d4c411-a401-43fe-bce8-94cf79601525", "project_id": "196df3c3-9443-4ac3-b190-2c20d039f07a", "section": "awards", "rank": 999, "award_name": "Best Domain Expert AI", "cohort_label": null}, {"id": "b2ab9402-f923-43dc-82a2-b6ffde2343e0", "project_id": "196df3c3-9443-4ac3-b190-2c20d039f07a", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "5b3453e3-a3c0-48ee-a987-57d93cb34446", "title": "Prep Sense AI", "description": "\"Praneetha (with teammate Vivek) built PrepSense to solve a daily restaurant operations problem: with ~30 minutes\n  before service, a restaurant owner has perishable inventory (fresh salmon, day-old produce) and no data-driven way\n  to decide what to run as a special or what to prep. Owners currently guess. PrepSense answers \"\"what exactly should I\n  run tonight?\"\" with a clear reason, grounded in the restaurant's own sales data, item pricing, and ingredients. The\n  pitch was cut short on time, but the architecture used restaurant-owned data for recommendations.\"", "builder_name": "Praneetha Reddy", "builder_linkedin": "https://www.linkedin.com/in/praneethareddyv/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785754653203.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=P7j%2BM7mFFSbzqmosKOz7iTMN61kNvKmsNXgYOfrEhPc%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785754653750.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=wAL5fIC4VQTJq4qkKH%2BpXXUD4FZ5y73lB9tAQCfRV%2FI%3D", "video_link": "https://www.loom.com/share/9c3f9dd2d3444278ba42ca4a95482aca", "workflow_link": null, "doc_link": "https://1drv.ms/p/c/af7fa89965dabf48/IQC3FADT1zzaQJbHHimBHus4AYEg9u8tsa1xaULy5RiBufw?e=SL8EFL", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "cbf0ff36-d6eb-487f-8f6d-d803f77a5e3b", "project_id": "5b3453e3-a3c0-48ee-a987-57d93cb34446", "section": "awards", "rank": 999, "award_name": "Best AI Innovation - Restaurant Operations", "cohort_label": null}, {"id": "538bbdcd-4c8e-46fc-92c8-904cae532e1b", "project_id": "5b3453e3-a3c0-48ee-a987-57d93cb34446", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "de773273-5152-4390-9e58-6ab7dd397995", "title": "Prep Sense AI", "description": "Vivek (with teammate Pranita) built PrepSense to solve a daily restaurant operations problem: with ~30 minutes\n  before service, a restaurant owner has perishable inventory (fresh salmon, day-old produce) and no data-driven way\n  to decide what to run as a special or what to prep. Owners currently guess. PrepSense answers \"what exactly should I\n  run tonight?\" with a clear reason, grounded in the restaurant's own sales data, item pricing, and ingredients. The\n  pitch was cut short on time, but the architecture used restaurant-owned data for recommendations.", "builder_name": "Vivek Singh", "builder_linkedin": null, "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785754336545.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=%2F8tC0zX8saridHRI%2FhD58zG2FsNpjAYDctCdcXDCkO4%3D", "banner_url": null, "user_image_url": null, "video_link": "https://www.loom.com/share/9c3f9dd2d3444278ba42ca4a95482aca", "workflow_link": null, "doc_link": "https://1drv.ms/p/c/af7fa89965dabf48/IQC3FADT1zzaQJbHHimBHus4AYEg9u8tsa1xaULy5RiBufw?e=SL8EFL", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "4729aaed-f6ef-48a0-926b-2221d9054df8", "project_id": "de773273-5152-4390-9e58-6ab7dd397995", "section": "awards", "rank": 999, "award_name": "Best AI Innovation - Restaurant Operations", "cohort_label": null}, {"id": "76530bc4-f355-4280-9ef2-9c676ece0633", "project_id": "de773273-5152-4390-9e58-6ab7dd397995", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "7f726dfc-6ae9-4574-962c-712ede82be59", "title": "Ownercare.AI - Your home, finally understood", "description": "OwnerCare.AI helps homeowners manage their home as a financial asset. Problem: home is the biggest asset for most\n  Americans but maintenance is entirely reactive — no source of truth, no owner's manual at closing. 1.2M home\n  purchases/year each with an inspection report as the anchor document. Demo: inspection partner emails homeowner →\n  OwnerCare onboards using the inspection report → dashboard surfaces prioritised issues by system (foundation, roof,\n  plumbing, electrical) → AI chat answers specific questions grounded in the report → project creation for follow-up.\n  Two revenue segments: homeowners (freemium, $4.99/mo paid tier), partners (tiered SaaS from free Seed to Scale).\n  Lead gen layer on top: partners earn revenue share on leads. GTM: start with co-founder's 6,000 existing inspection\n  reports from his home inspection business.", "builder_name": "Dan Anderson", "builder_linkedin": null, "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785754170029.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=uZVlxsDvGr5AHvNNdG0H%2FEESK1yUOS8brmSZNv9DHUk%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1790022690041.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=V6k8Ta4RjwvRycZ1ZS4H8hPI37qCz5ACgxat%2FWxbwsA%3D", "video_link": "https://www.loom.com/share/6103b29930304810acd020b425ee6957", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1regnKNu9SsiQUwxi8FWcxxF36oD-n6AQRf5y_M5LxwQ/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "7b7fbe3e-3467-4a62-a5c7-f9ae33686cb8", "project_id": "7f726dfc-6ae9-4574-962c-712ede82be59", "section": "top10", "rank": 6, "award_name": null, "cohort_label": null}, {"id": "ca873c08-abbb-4cec-b425-48d090acd745", "project_id": "7f726dfc-6ae9-4574-962c-712ede82be59", "section": "awards", "rank": 999, "award_name": "Strongest Business Case", "cohort_label": null}, {"id": "8b798c43-4d05-4f46-aa6b-3a466aaf0e8a", "project_id": "7f726dfc-6ae9-4574-962c-712ede82be59", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "fe2e7868-a4ab-4558-9fac-e3554abf95ed", "title": "Mosaic", "description": "\"Rakesh built Mosaic for sell-side research analysts who process dozens of earnings call transcripts each quarter\n  across multiple companies and industries, racing against time to find hidden signals before competitors. The hidden\n  signals he targets: language softening between calls (management becoming less certain), KPI/guidance divergence\n  from prior statements, management contradictions, and silent estimate revisions — details that are easily missed\n  when reading transcripts sequentially but become visible when compared systematically across history. In this\n  industry, wrong model estimates mean reputation damage and lost client relationships. Mosaic takes an earnings\n  transcript, extracts claims, and runs them through three parallel agents: guidance tracker, demand/deal tracker, and\n  contradiction detector. A faithfulness agent sits on top of all outputs — if a flag isn't backed by a direct\n  citation from the source transcript, it doesn't go out. The result: a structured report delivered via webhook or\n  email. Memory layer: Supabase vector store for company-specific historical transcripts. When a new earnings call\n  arrives, it's compared against the full history. The moat is in the reasoning layer, not the data; citation accuracy\n  is non-negotiable. Industry-specific parameters (what matters in IT vs. banking vs. healthcare) are stored as JSON\n  files, making horizontal expansion tractable. Pricing: hybrid cost-plus and competitor-anchored model. Roadmap:\n  expand to multi-source inputs (not just transcripts), full financial model parameter impact analysis — the complete\n  picture of how an earnings call should shift an analyst's model estimates.\"", "builder_name": "Rakesh Retnakaran", "builder_linkedin": "https://www.linkedin.com/in/rakeshretna/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785753671533.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=71NPXa1UfrZp4R6DklIyULF0jkqGJWCt9zZ%2Fce%2BPGpQ%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785753673057.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=uO%2FaQ0cJbnoqKmwU6kJzjDBXbSR%2Bu5tzHEMY9DszS2M%3D", "video_link": "https://drive.google.com/file/d/1Bq80uhuKsfyKLv71FDCsO-DuRT2VevXv/view?usp=sharing", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "5b374c1b-6c74-4ed3-9e98-8f57119eea4c", "project_id": "fe2e7868-a4ab-4558-9fac-e3554abf95ed", "section": "awards", "rank": 999, "award_name": "Best AI Product Pitch Award", "cohort_label": null}, {"id": "65101b5c-bd50-4abc-a057-a1fe56e067d4", "project_id": "fe2e7868-a4ab-4558-9fac-e3554abf95ed", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "cb122a97-3490-4a81-aa09-fa7f08f64beb", "title": "MySyndik AI", "description": "Kristine, based in France, built MySyndikAI for self-managed condominiums (3–20 units) where volunteer council\n  presidents — ordinary neighbors with no legal or financial training — are personally liable for building management.\n  A new French law mandates a 10-year multi-year works plan for all buildings over 15 years old (virtually all of\n  France), reviewed annually; a consultant typically charges $8,000 to produce it. MySyndikAI offers a document vault,\n  a legal chat assistant, and a works planner that generates this plan from the building's uploaded documents.\n  Incumbents charge $1,200/year; Kristine's freemium model targets the most price-sensitive segment. She already has\n  interest from 5 buildings as potential pilot customers. Next: council member task assignment with role-based\n  permissions, general meeting agenda generation, and automated convocation documents.\n \n --\n \n Kristine is based in France and built MySyndik AI for a very specific, underserved persona: the volunteer council\n  president of a self-managed condominium. In France, smaller buildings (3–20 units) are often managed not by\n  professional property managers but by a neighbor-volunteer who has a full-time job, no legal or financial training,\n  and is personally liable for compliance. Kristine experienced this firsthand — all institutional knowledge lived in\n  one person's head, then that person moved out and left behind wonky spreadsheets. A new French law compounds the\n  problem: every building over 15 years old (essentially all of France) is now legally required to maintain a 10-year\n  works plan, update it annually, present it at general meetings, and face personal liability if non-compliant. A\n  professional consultant charges up to €8,000 to create this plan — a cost that's prohibitive for a small\n  self-managed building. MySyndik AI is a shared workspace that changes the dynamic: document vault for building\n  records, a legal chat assistant grounded in the uploaded documents, and a planner that automatically generates the\n  10-year works plan from the building's memory. Features in roadmap: council access with role-based permissions, task\n  assignment, general meeting prep (agenda drafting from prior-year decisions), compliance convocations\n  (time-sensitive legal notices). Pricing: free tier to start (competing against incumbents at €1,200/year), priced at\n  a level that undercuts the professional manager while showing clear value quickly. North Star: monthly active\n  condominiums, documents indexed, plans generated. Already has interest from 5 self-managed buildings for pilot.", "builder_name": "Kristine Ugalde", "builder_linkedin": "https://www.linkedin.com/in/kristineugalde/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785753407966.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=siaq1vLzs5bnexAPzjm6nOJ%2FbOXpOVI86TZgwAut7Ko%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785753408733.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=yWuomB%2B53XxPNqH2GOey0b%2F4%2BTX%2F1v6Ykzr6HPUb%2B44%3D", "video_link": "https://www.loom.com/share/5bbbdc56bd3544579239faaed17bec55", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1S3DUj5j6IpleDGH5w_686gaQQ8eUr_a9V6FOaSBjjuQ/edit?slide=id.p7#slide=id.p7", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "668437da-703c-46fd-a827-c7dcf34d15f0", "project_id": "cb122a97-3490-4a81-aa09-fa7f08f64beb", "section": "awards", "rank": 999, "award_name": "Best Regulated Tech / Compliance AI", "cohort_label": null}, {"id": "8d7064f4-2b54-4460-92f7-b77675463bc1", "project_id": "cb122a97-3490-4a81-aa09-fa7f08f64beb", "section": "cohort9", "rank": 999, "award_name": null, "coh
