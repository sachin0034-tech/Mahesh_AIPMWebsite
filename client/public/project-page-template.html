<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — MYAI Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ===== MYAI Community design system (copied unchanged from the community site) ===== */

:root{
  --obsidian:#09090b; --graphite:#18181b; --slate:#27272a; --iron:#3f3f46;
  --steel:#52525b; --fog:#71717a; --ash:#a1a1aa; --mist:#d4d4d8;
  --cloud:#ececee; --paper:#f4f4f5; --snow:#ffffff;

  --accent-ink:#2b1a04;
  --accent-deep:#8a5305;
  --accent-soft:rgba(252,169,61,.15);
  --accent-line:rgba(252,169,61,.55);

  --font: 'DM Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --max:1200px; --pad:24px;
  --r-card:36px; --r-mid:24px; --r-sm:20px; --r-btn:14px; --r-badge:12px; --r-pill:10000px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  position:relative;margin:0;background:var(--paper);color:var(--graphite);
  font-family:var(--font);font-size:15px;line-height:1.45;font-weight:400;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .24s var(--ease)}

/* ================= background system ================= */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* Two rails framing the content column, set well clear of the cards
   (52px of air at 1440px) and only drawn when the page is wide enough. */
.bg-rails{position:absolute;inset:0;display:none}
.bg-rails i{
  position:absolute;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(9,9,11,.15) 7%,rgba(9,9,11,.15) 93%,transparent);
}
.bg-rails i:nth-child(1){left:calc(50% - 628px)}
.bg-rails i:nth-child(2){right:calc(50% - 628px)}
@media (min-width:1360px){ .bg-rails{display:block} }
.bg-glow{
  position:absolute;top:-320px;right:-220px;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(252,169,61,.16),rgba(252,169,61,0) 62%);
}
.bg-glow-2{
  position:absolute;bottom:-380px;left:-260px;width:820px;height:820px;border-radius:50%;
  background:radial-gradient(circle,rgba(39,39,42,.07),rgba(39,39,42,0) 64%);
}
.nav,main,footer{position:relative;z-index:1}

/* horizontal structural rule with accent segment */
.rule{position:relative;height:1px;background:var(--mist)}
.rule::before{content:"";position:absolute;left:0;top:0;width:68px;height:1px;background:var(--accent)}

/* ================= nav ================= */
.nav{
  position:sticky;top:0;z-index:60;
  background:rgba(244,244,245,.72);backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  box-shadow:0 1px 0 0 rgba(9,9,11,.05);
}
.nav-in{display:flex;align-items:center;gap:22px;height:70px}
.logo{display:inline-flex;flex-direction:column;justify-content:center;
  font-size:15px;font-weight:700;line-height:.94;letter-spacing:-.015em;
  text-transform:uppercase;color:var(--obsidian)}
.logo span{display:block}
.nav-links{display:flex;gap:4px;margin-left:22px}
.nav-links a{
  position:relative;font-size:13px;font-weight:500;letter-spacing:.07em;color:var(--steel);
  padding:9px 15px;border-radius:var(--r-pill);transition:.22s var(--ease);
}
.nav-links a.is-active{color:var(--obsidian);background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud)}
.nav-cta{margin-left:auto;display:flex;align-items:center;gap:10px}

.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;
  padding:11px 18px;border-radius:var(--r-btn);transition:.24s var(--ease);white-space:nowrap}
.btn-dark{background:var(--obsidian);color:#fff;
  box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.5),inset 0 9px 14px -5px rgba(117,123,133,.4),
             0 0 0 1.5px rgb(44,46,52),0 4px 6px 0 rgba(0,0,0,.14)}
.btn-ghost{color:var(--iron);border:1px solid var(--mist);background:var(--snow)}
.btn-pill{border-radius:var(--r-pill);padding:10px 20px}
.btn-neutral{background:#fafafa;color:var(--graphite);border:1px solid var(--cloud)}
@media (hover:hover) and (pointer:fine){
  .nav-links a:hover{color:var(--obsidian);background:rgba(9,9,11,.045)}
  .btn-dark:hover{transform:translateY(-1px)}
  .btn-ghost:hover{border-color:var(--iron);color:var(--obsidian)}
  .btn-neutral:hover{background:var(--snow);border-color:var(--mist)}
  .btn:hover .ico{transform:translate(2px,-2px)}
}

/* ================= section furniture ================= */
section{padding:84px 0}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:500;
  letter-spacing:.15em;text-transform:uppercase;color:var(--fog)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
  flex:none;box-shadow:0 0 0 4px var(--accent-soft)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.028em;color:var(--obsidian)}
h1{font-size:66px;line-height:1.08}
h2{font-size:40px;line-height:1.24}
.lede{font-size:15px;line-height:1.5;color:var(--steel);max-width:54ch}

.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:40px;flex-wrap:wrap}
.sec-head h2{margin-top:16px}
.sec-head .lede{margin-top:12px}
.sec-actions{display:flex;align-items:center;gap:10px}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
  padding:5px 10px;border-radius:var(--r-badge);letter-spacing:.05em;line-height:1.35}
.badge-accent{background:var(--accent);color:var(--accent-ink);font-weight:600}
.badge-outline{border:1px solid var(--cloud);color:var(--graphite)}
.badge .ico{width:13px;height:13px}

/* ================= masthead ================= */
.masthead{padding:112px 0 60px}
.mast-rule{width:104px;height:4px;margin:26px 0 0;border-radius:2px}
.mast-copy h1{margin:20px 0 0;max-width:14ch}
.mast-meta{font-size:14px;color:var(--fog);margin:22px 0 0}

/* ================= project card (uniform) ================= */
.grid{display:grid;gap:20px;grid-auto-rows:1fr}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

.pcard{position:relative;display:flex;flex-direction:column;background:var(--snow);
  border:1px solid var(--cloud);border-radius:var(--r-mid);overflow:hidden;
  transition:border-color .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
.pcard::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;z-index:5;
  background:var(--accent);transform:scaleX(0);transform-origin:left center;transition:transform .5s var(--ease)}
.thumb{position:relative;aspect-ratio:16/9;background:var(--paper);overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.thumb::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,.4),inset 0 -1px 0 0 rgba(9,9,11,.06)}
.thumb-empty{position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(180deg,#fafafa,#f1f1f3)}
.thumb-empty i{display:grid;place-items:center;width:74px;height:74px;border-radius:50%;
  background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud);
  font-style:normal;font-size:24px;font-weight:600;letter-spacing:.05em;color:var(--steel)}
.chip-rank{position:absolute;top:12px;left:12px;z-index:4;font-size:11px;font-weight:600;
  letter-spacing:.06em;font-variant-numeric:tabular-nums;padding:5px 9px;border-radius:9px;
  background:rgba(9,9,11,.66);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.chip-rank.is-top{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 1px rgba(43,26,4,.18)}
.reveal{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding:26px 14px 12px;color:#fff;font-size:11px;
  font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(to top,rgba(9,9,11,.88),rgba(9,9,11,.45) 55%,rgba(9,9,11,0));
  opacity:0;transform:translateY(10px);transition:opacity .34s var(--ease),transform .34s var(--ease)}
.reveal .ico{width:15px;height:15px;color:var(--accent)}
.bk{position:absolute;width:22px;height:22px;z-index:5;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease)}
.bk-a{top:9px;left:9px;transform:translate(-4px,-4px)}
.bk-b{bottom:9px;right:9px;transform:translate(4px,4px) rotate(180deg)}

.pbody{padding:17px 19px 19px;display:flex;flex-direction:column;gap:11px;flex:1}
.pcard-title{font-size:16px;font-weight:600;line-height:1.32;letter-spacing:-.016em;color:var(--obsidian);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.pmeta{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:12px;border-top:1px solid var(--cloud)}
.av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--cloud);background:var(--paper)}
.av-i{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--paper);border:1px solid var(--cloud);font-size:10px;font-weight:600;color:var(--steel)}
.pmeta-txt{min-width:0;flex:1}
.pmeta-name{font-size:13px;font-weight:500;color:var(--graphite);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta-sub{font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ash);margin-top:2px}

/* featured #1 — left column, two rows tall */
.fcard{grid-column:1;grid-row:span 2}
.fcard .thumb{aspect-ratio:auto;flex:1 1 auto;min-height:0}
.fcard .pbody{padding:22px 24px 24px;gap:14px}
.fcard .pcard-title{font-size:27px;line-height:1.16;letter-spacing:-.035em;-webkit-line-clamp:3;min-height:0}
.fcard .chip-rank{font-size:12px;padding:6px 11px;top:14px;left:14px}
.fcard .reveal{padding:36px 18px 16px;font-size:12px}
.fcard .reveal .ico{width:17px;height:17px}
.fcard .av,.fcard .av-i{width:32px;height:32px;font-size:11px}
.fcard .pmeta-name{font-size:14px;font-weight:600}
.fcard .pmeta{padding-top:14px}

@media (hover:hover) and (pointer:fine){
  .pcard:hover{border-color:var(--accent-line);transform:translateY(-5px);box-shadow:0 20px 38px -20px rgba(9,9,11,.26)}
  .pcard:hover::after{transform:scaleX(1)}
  .pcard:hover .thumb img{transform:scale(1.07)}
  .pcard:hover .reveal{opacity:1;transform:none}
  .pcard:hover .bk{opacity:1}
  .pcard:hover .bk-a{transform:none}
  .pcard:hover .bk-b{transform:rotate(180deg)}
  .pcard:hover .chip-rank{background:var(--accent);color:var(--accent-ink)}
}

/* ================= placements ticker ================= */
.wall{position:relative;overflow:hidden;background:var(--graphite);
  border-radius:44px;padding:44px 0 48px;color:#fff}
.wall::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:url(/assets/decor/dot-grid.svg);background-size:28px 28px;filter:invert(1);opacity:.13}
.wall::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:url(/assets/decor/grain.svg);background-size:200px 200px;opacity:.05;mix-blend-mode:screen}
.wall-label{position:relative;z-index:2;margin:0 0 30px;text-align:center;font-size:11px;
  font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:var(--ash)}
.marquee{position:relative;z-index:2;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.marquee+.marquee{margin-top:18px}
.track{display:flex;align-items:stretch;gap:18px;padding-right:18px;width:max-content;
  animation:marq 86s linear infinite}
.track.rev{animation-direction:reverse;animation-duration:88s}
@keyframes marq{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}

.pers{
  position:relative;display:flex;flex-direction:column;flex:none;width:246px;
  background:var(--snow);border:1px solid transparent;border-radius:20px;overflow:hidden;
  transition:transform .28s var(--ease),box-shadow .28s var(--ease),border-color .28s var(--ease);
}
.pers-photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--paper)}
.pers-photo-i{display:grid;place-items:center;background:linear-gradient(180deg,#fafafa,#f1f1f3)}
.pers-photo-i i{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;
  background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud);
  font-style:normal;font-size:21px;font-weight:600;line-height:1;color:var(--steel)}
.pers-body{display:flex;flex-direction:column;flex:1;padding:16px 18px 17px}
.pers-name{font-size:15.5px;font-weight:600;letter-spacing:-.02em;color:var(--obsidian);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pers-role{font-size:12.5px;line-height:1.4;color:var(--fog);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pers-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:auto;padding-top:14px;border-top:1px solid var(--cloud)}
.pers-logo{height:21px;width:auto;max-width:72%;object-fit:contain;object-position:left center}
.pers-li{width:26px;height:26px;flex:none;color:#0A66C2;transition:transform .26s var(--ease)}
.pers-li svg{width:100%;height:100%;display:block}
.pers-li .li-plate{fill:currentColor}
.pers-li .li-glyph{fill:var(--snow)}
@media (hover:hover) and (pointer:fine){
  .marquee:hover .track{animation-play-state:paused}
  .pers:hover{transform:translateY(-4px);border-color:var(--accent-line);box-shadow:0 18px 34px -18px rgba(0,0,0,.55)}
  .pers:hover .pers-li{transform:translateY(-2px)}
}

/* ========== standout builds — one bordered sheet, 3 cells per row ========== */
/* Hairlines come from each cell's own right/bottom border, not from a coloured
   container showing through a 1px gap — a partly filled last row would otherwise
   leave the container colour exposed as a grey block. */
.sgrid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  background:var(--snow);border-radius:var(--r-mid);overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--cloud);
}
.scell{position:relative;display:flex;flex-direction:column;background:var(--snow);
  border-right:1px solid var(--cloud);border-bottom:1px solid var(--cloud);
  padding:24px 26px 22px;min-height:198px;transition:background .26s var(--ease)}
.sghost{position:absolute;right:20px;bottom:14px;z-index:0;pointer-events:none;
  font-size:62px;font-weight:700;line-height:1;letter-spacing:-.05em;
  color:#edeef0;font-variant-numeric:tabular-nums;transition:color .3s var(--ease)}
.spill-slot,.stitle,.sby{position:relative;z-index:1}
.spill-slot{display:flex;min-height:25px}
.spill{display:inline-flex;align-items:flex-start;gap:6px;max-width:100%;
  background:var(--accent-soft);color:var(--accent-deep);box-shadow:inset 0 0 0 1px rgba(252,169,61,.35);
  font-size:11.5px;font-weight:600;line-height:1.3;padding:5px 10px 5px 8px;border-radius:var(--r-pill)}
.spill .ico{width:12px;height:12px;margin-top:1px;stroke-width:1.8}
/* fallback for the one record with no award label — deliberately zinc, never amber,
   so it can't be mistaken for an actual award */
.spill-plain{background:var(--paper);color:var(--steel);box-shadow:inset 0 0 0 1px var(--cloud)}
/* marketplace uses the same sheet, but a cohort chip instead of an award pill
   and no ghost numeral — so the cells sit shorter */
.chip-cohort{display:inline-flex;align-items:center;gap:6px;
  background:var(--paper);color:var(--steel);box-shadow:inset 0 0 0 1px var(--cloud);
  font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 10px;border-radius:var(--r-pill);white-space:nowrap}
.scell.filler{pointer-events:none;min-height:0}
.sgrid-lite .scell{min-height:170px}
.sgrid-lite .scell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--accent);transform:scaleY(0);transition:transform .3s var(--ease)}
@media (hover:hover) and (pointer:fine){
  .sgrid-lite .scell:hover::before{transform:scaleY(1)}
}
.stitle{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.022em;color:var(--obsidian);
  margin:14px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:44px}
.sby{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:18px}
.sby .av,.sby .av-i{width:30px;height:30px;font-size:11px}
.sby-name{font-size:13.5px;font-weight:600;color:var(--graphite);line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sby-sub{font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ash);margin-top:2px}
@media (hover:hover) and (pointer:fine){
  .scell:hover{background:#fcfcfd}
  .scell:hover .sghost{color:rgba(252,169,61,.4)}
}
.more-wrap{display:flex;justify-content:center;margin-top:34px}

/* ================= tabs ================= */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:var(--r-pill);background:var(--snow);border:1px solid var(--cloud)}
.tab{font-size:13px;font-weight:500;padding:9px 20px;border-radius:var(--r-pill);color:var(--steel);transition:.24s var(--ease)}
.tab.is-on{background:var(--obsidian);color:#fff}
@media (hover:hover) and (pointer:fine){ .tab:hover{color:var(--obsidian)} .tab.is-on:hover{color:#fff} }

/* ================= testimonials — vertical ticker + full wall ================= */
.vwall{
  position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;
  height:660px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);
}
.vwall[hidden]{display:none}
.vcol{position:relative;overflow:hidden;min-width:0}
.vtrack{display:flex;flex-direction:column;gap:20px;padding-bottom:20px;will-change:transform;animation:vscroll 78s linear infinite}
.vtrack .vcard{margin:0}
.vcol:nth-child(2) .vtrack{animation-duration:96s;animation-direction:reverse}
.vcol:nth-child(3) .vtrack{animation-duration:86s}
@keyframes vscroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}

.vall{display:none;columns:3;column-gap:20px}
.vall.is-open{display:block}

.vcard{
  position:relative;display:flex;flex-direction:column;break-inside:avoid;
  margin:0 0 20px;background:var(--snow);border:1px solid var(--cloud);
  border-radius:var(--r-card);padding:26px;overflow:hidden;
  transition:border-color .3s var(--ease);
}
.vcard::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);
  transform:scaleX(0);transform-origin:left center;transition:transform .5s var(--ease)}
.tquote-mark{width:24px;height:24px;flex:none;color:var(--accent);opacity:.85;margin-bottom:14px}
.vq{margin:0;font-size:14.5px;line-height:1.62;color:var(--graphite);
  display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.viewpost{display:inline-flex;align-items:center;gap:6px;margin-top:15px;font-size:13px;
  font-weight:500;color:var(--steel);transition:.22s var(--ease)}
.vfoot{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid var(--cloud)}
.vfoot .av,.vfoot .av-i{width:36px;height:36px;font-size:12px}
.vfoot b{font-size:14px;font-weight:600;color:var(--obsidian);display:block;line-height:1.2}
.vfoot > div > span{font-size:12px;color:var(--fog);display:block;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (hover:hover) and (pointer:fine){
  .vcol:hover .vtrack{animation-play-state:paused}
  .vcard:hover{border-color:var(--accent-line)}
  .vcard:hover::after{transform:scaleX(1)}
  .viewpost:hover{color:var(--accent-deep);gap:9px}
}

/* ================= footer ================= */
footer{border-top:1px solid var(--cloud);padding:46px 0;margin-top:44px}
.foot{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.foot-links{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.foot-links a{font-size:13px;color:var(--steel);letter-spacing:.05em;transition:.2s var(--ease)}
@media (hover:hover) and (pointer:fine){ .foot-links a:hover{color:var(--obsidian)} }

/* ================= reveal ================= */
.r{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.r.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .r{opacity:1;transform:none;transition:none}
  .track{animation:none}
  html{scroll-behavior:auto}
  .pcard,.pers,.scell{transition:none}
  .vtrack{animation:none}
}

/* ================= responsive ================= */
@media (max-width:1120px){
  h1{font-size:54px}
  h2{font-size:34px}
  .vwall{grid-template-columns:repeat(2,minmax(0,1fr));height:600px}
  .vcol:nth-child(3){display:none}
  .vall{columns:2}
  .wall{border-radius:36px}
}
@media (max-width:900px){
  section{padding:64px 0}
  .masthead{padding:64px 0 52px}
  .mast-copy h1{max-width:none}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vwall{grid-template-columns:minmax(0,1fr);height:540px}
  .vcol:nth-child(2){display:none}
  .vall{columns:1}
  .fcard{grid-column:auto;grid-row:auto}
  .fcard .thumb{aspect-ratio:16/9;flex:none}
  .fcard .pcard-title{font-size:19px;-webkit-line-clamp:2;min-height:42px}
  .fcard .pbody{padding:17px 19px 19px}
  .nav-links{display:none}
  .sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  :root{--pad:18px;--r-card:26px;--r-mid:20px}
  h1{font-size:38px}
  h2{font-size:27px}
  .g3{grid-template-columns:1fr}
  .wall{border-radius:26px;padding:34px 0 36px}
  .pers{width:214px}
  .sgrid{grid-template-columns:minmax(0,1fr)}
  .sghost{font-size:50px}
  .nav-cta .btn-ghost{display:none}
}
/* ================= v2 fixes + explore view ================= */
[hidden]{display:none !important}

/* --- card byline: bigger portrait + name so the cell doesn't read as empty --- */
.sgrid-lite .scell{min-height:188px}
.sgrid .sby{gap:13px}
/* award sheet (ghost numeral + cohort sub-label) */
.sgrid .sby .av,.sgrid .sby .av-i{width:48px;height:48px;font-size:16px}
.sgrid .sby-name{font-size:16px;letter-spacing:-.014em}
.sgrid .sby-sub{font-size:10.5px;margin-top:3px}
/* marketplace / explore sheet — no sub-label, so the portrait carries the row */
.sgrid-lite .sby{padding-top:14px;gap:14px}
.sgrid-lite .sby .av,.sgrid-lite .sby .av-i{width:54px;height:54px;font-size:18px}
.sgrid-lite .sby-name{font-size:16.5px;letter-spacing:-.016em}
/* initials sit dead centre: no inherited line-height, no trailing letter-space */
.av-i{line-height:1;letter-spacing:0;text-transform:uppercase;font-variant-numeric:normal}
/* an initials badge is always a centred grid, whatever a descendant selector
   elsewhere in the sheet tries to say about plain spans in that container */
span.av-i{display:grid;place-items:center;overflow:visible;white-space:nowrap;
  text-align:center;text-overflow:clip;margin:0}
.vfoot .av-i,.sby .av-i,.fcard .av-i{line-height:1}
/* a 12px glyph in a 36px circle read as an empty disc — size it to the frame */
.vfoot .av-i{font-size:14px;font-weight:600;color:var(--steel)}
.thumb-empty i,.pers-photo-i i{letter-spacing:.04em}

/* --- tab count: a circle, not loose grey digits --- */
.tab{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
.tab b{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;
  border-radius:var(--r-pill);background:#e6e6ea;box-shadow:none;
  font-size:11.5px;font-weight:600;line-height:1;color:var(--iron);font-variant-numeric:tabular-nums}
.tab.is-on b{background:rgba(255,255,255,.22);color:#fff}

/* --- sub nav --- */
.subnav{position:relative;z-index:1;border-bottom:1px solid var(--cloud)}
.subnav-in{display:flex;align-items:center;gap:18px;height:52px;flex-wrap:wrap}
.backlink{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
  color:var(--iron);transition:.22s var(--ease)}
.backlink .ico{width:15px;height:15px}
.crumb{margin-left:auto;font-size:11px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:var(--ash)}
.crumb i{font-style:normal;color:var(--mist);margin:0 8px}
.crumb b{font-weight:600;color:var(--steel)}
@media (hover:hover) and (pointer:fine){
  .backlink:hover{color:var(--obsidian)}
  .backlink:hover .ico{transform:translateX(-3px)}
}

/* --- explore masthead --- */
.amast{padding:62px 0 34px}
.amast h1{font-size:62px;line-height:1.06;letter-spacing:-.04em;margin:20px 0 0}
.amast .lede{font-size:16.5px;line-height:1.55;color:var(--steel);max-width:62ch;margin:18px 0 0}
.amast-top{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;flex-wrap:wrap}

/* --- filter bar: sits on the page, not on a white panel --- */
/* not sticky, and no opaque panel — it would mask the page's own background wash */
.filters{position:relative;z-index:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:0 0 16px;margin-bottom:28px;background:none;border-bottom:1px solid var(--cloud)}
.search{position:relative;flex:1;min-width:210px;max-width:330px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ash);pointer-events:none}
.search input{width:100%;font:inherit;font-size:14px;color:var(--graphite);
  padding:11px 14px 11px 40px;border-radius:var(--r-pill);
  background:var(--snow);border:1px solid var(--cloud);outline:none;transition:.22s var(--ease)}
.search input::placeholder{color:var(--ash)}
.search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.count{margin-left:auto;background:none;padding:0;border:0;box-shadow:none;
  font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ash);font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--obsidian);font-weight:600}
.allp{padding:0 0 80px}
.empty{padding:70px 0 80px;text-align:center}
.empty b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--obsidian)}
.empty span{display:block;font-size:14px;color:var(--fog);margin-top:8px}

@media (max-width:1180px){ .amast h1{font-size:50px} }
@media (max-width:900px){
  .amast{padding:44px 0 28px}
  .count{margin-left:0;width:100%}
}
@media (max-width:620px){
  .amast h1{font-size:36px}
  .crumb{display:none}
  .search{max-width:none}
  /* the tab rail scrolls sideways rather than wrapping a cohort label onto two lines */
  .filters .tabs{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters .tabs::-webkit-scrollbar{display:none}
  .filters .tab{padding:9px 14px;flex:none}
}



/* ===== project page — layout only, built from the system tokens above ===== */
:root{--accent:#fca93d}
main section{padding:72px 0 0}
main section.first{padding-top:0}

/* hero (masthead pattern, two columns) */
.p-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center;padding:64px 0 72px}
.p-hero h1{margin:20px 0 0;font-size:62px;line-height:1.06;max-width:12ch;overflow-wrap:anywhere}
.p-hero h1.long{font-size:46px;max-width:16ch}
.p-hero .lede{margin:20px 0 0;font-size:16px;line-height:1.6;max-width:46ch}
.p-ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.p-ctas .btn{padding:13px 20px;font-size:14.5px}
.p-by{display:flex;align-items:center;gap:10px;margin-top:30px;padding-top:20px;border-top:1px solid var(--mist);max-width:420px}
.p-by .av,.p-by .av-i{width:34px;height:34px;font-size:12px}
.p-by b{display:block;font-size:14px;font-weight:600;color:var(--obsidian);line-height:1.2}
.p-by span{display:block;font-size:10.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ash);margin-top:3px}
.p-shot{border-radius:var(--r-mid)}
.p-shot{box-shadow:0 30px 60px -36px rgba(9,9,11,.35)}
.p-shot .thumb{aspect-ratio:16/10}
.p-shot .thumb .blur{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(28px);opacity:.45}
.p-shot .thumb .img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.p-shot .pbody{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}
.p-shot .pbody .pmeta{margin:0;padding:0;border:0;flex:1;min-width:0}
.p-shot .thumb-empty b{font-size:38px;font-weight:600;letter-spacing:-.03em;color:var(--obsidian);text-align:center;padding:0 24px;line-height:1.1}

/* "sheet": one white bordered surface split by hairlines (same construction as .sgrid) */
.sheet{background:var(--snow);border-radius:var(--r-mid);box-shadow:inset 0 0 0 1px var(--cloud);overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border-bottom:1px solid var(--cloud)}
.srow:last-child{border-bottom:0}
.srow.solo{grid-template-columns:minmax(0,1fr)}
.s-txt{padding:30px 32px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.s-txt h3{font-size:23px;line-height:1.3;letter-spacing:-.024em;max-width:28ch}
.srow.solo .s-txt h3{max-width:44ch}
.s-txt p{margin:0;font-size:15px;line-height:1.6;color:var(--steel);max-width:56ch}
.srow.solo .s-txt p{max-width:78ch}
.s-txt .more{align-self:flex-start;font-size:13px;font-weight:600;color:var(--obsidian);border-bottom:1px solid var(--obsidian);padding:0}
.fold{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.s-list{border-left:1px solid var(--cloud);background:#fcfcfd;display:flex;flex-direction:column}
.s-item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:18px 28px 18px 24px;border-bottom:1px solid var(--cloud);font-size:15px;line-height:1.5;color:var(--slate)}
.s-item:last-child{border-bottom:0}
.s-item i{font-style:normal;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ash);font-variant-numeric:tabular-nums;padding-top:2px}
.s-item b{color:var(--obsidian);font-weight:600}
.s-item.flow i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);box-shadow:inset 0 0 0 1px rgba(252,169,61,.35);padding:0}
.s-notes{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.s-note{padding-top:18px;border-top:1px solid var(--mist);position:relative}
.s-note::before{content:"";position:absolute;left:0;top:-1px;width:40px;height:1px;background:var(--accent)}
.s-note b{display:block;font-size:14px;font-weight:600;color:var(--obsidian)}
.s-note p{margin:6px 0 0;font-size:14.5px;line-height:1.6;color:var(--steel)}

/* how it's built: steps + resources on the system sheet grid */
.p-steps .scell{min-height:170px}
.p-steps .stitle{-webkit-line-clamp:3;min-height:0}
.p-steps .s-desc{position:relative;z-index:1;margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--fog)}
.p-links{margin-top:20px}
.p-links .scell{min-height:0;flex-direction:row;align-items:center;gap:14px;padding:20px 22px}
.p-links .lic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--paper);box-shadow:inset 0 0 0 1px var(--cloud);color:var(--obsidian)}
.p-links .lic .ico{width:18px;height:18px}
.p-links b{display:block;font-size:15px;font-weight:600;color:var(--obsidian)}
.p-links span{display:block;font-size:12.5px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-links .go{margin-left:auto;color:var(--ash)}
.p-links .scell:hover .go{color:var(--obsidian)}
.p-howtxt{margin:16px 0 0;font-size:14.5px;line-height:1.6;color:var(--steel)}
.p-incl{margin-top:20px;padding:24px 28px}
.p-incl h3{font-size:16px;letter-spacing:-.016em}
.p-incl ul{margin:12px 0 0;padding:0;list-style:none;columns:2;column-gap:40px}
.p-incl li{break-inside:avoid;display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--cloud);font-size:14.5px;color:var(--slate);overflow-wrap:anywhere}
.p-incl li .ico{width:14px;height:14px;margin-top:3px;color:var(--accent-deep)}
.p-incl a{text-decoration:underline;text-underline-offset:2px}

/* demo inside the dark wall */
.p-wall{padding:40px 40px 44px}
/* description: heading column on the left, a readable text column on the right */
.p-desc{margin-top:20px;padding:44px 48px;display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:24px 64px;align-items:start}
.p-desc h3{margin:14px 0 0;font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1;color:var(--obsidian);overflow-wrap:anywhere}
.p-desc-b{display:grid;gap:16px;max-width:66ch}
.p-desc-b p{margin:0;font-size:16px;line-height:1.75;color:var(--steel);overflow-wrap:anywhere;text-wrap:pretty}
.p-desc-b p.lede-p{font-size:19px;line-height:1.6;font-weight:500;letter-spacing:-.012em;color:var(--obsidian)}
.p-desc-b p b{color:var(--obsidian);font-weight:600}
.p-desc-b h4{margin:12px 0 -4px;font-size:18px;font-weight:600;letter-spacing:-.015em;color:var(--obsidian)}
.p-desc-b h4:first-child{margin-top:0}
.p-desc-vs{display:flex;align-items:center;gap:14px;margin:2px 0}
.p-desc-vs::before,.p-desc-vs::after{content:"";flex:1;height:1px;background:var(--cloud)}
.p-desc-vs span{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);padding:4px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--cloud);background:var(--paper)}
/* long descriptions: the heading stays in view beside the text (sticky needs the sheet not to clip) */
.p-desc{overflow:visible}
.p-desc-h{position:sticky;top:110px}
@media (max-width:900px){.p-desc-h{position:static}.p-desc{grid-template-columns:minmax(0,1fr);gap:20px;padding:32px 28px}.p-desc h3{font-size:28px}}
.p-desc-b ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.p-desc-b li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.6;color:var(--steel);overflow-wrap:anywhere}
.p-desc-b li > svg,.p-desc-b li > .ico{flex:none;width:16px;height:16px;margin-top:4px;color:var(--accent)}
.p-desc-b li b{color:var(--obsidian);font-weight:600}
@media (max-width:760px){.p-desc{padding:24px 20px}.p-desc-b p.lede-p{font-size:17px}}
.p-wall .wall-label{margin-bottom:24px}
.p-player{position:relative;z-index:2;aspect-ratio:16/9;border-radius:var(--r-mid);overflow:hidden;background:var(--obsidian);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.p-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.p-poster{position:absolute;inset:0;width:100%;display:block}
.p-poster .blur{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(34px);opacity:.5}
.p-poster .img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.p-poster::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(9,9,11,.6),rgba(9,9,11,0) 45%)}
.p-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:78px;height:78px;border-radius:50%;background:var(--snow);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.p-poster:hover .p-play{transform:translate(-50%,-50%) scale(1.06)}
.p-cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.p-player .chip-rank{top:16px;left:16px}

/* lessons */
.p-learn .scell{min-height:0;padding:22px 24px}
.p-learn:not(.open) .scell.later{display:none}
.p-learn .lt{position:relative;z-index:1;margin-top:12px;font-size:15px;line-height:1.5;color:var(--slate)}

/* builder */
.p-builder{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:stretch}
.p-bio{padding:32px 36px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.p-bio blockquote{margin:0;font-size:24px;line-height:1.4;font-weight:500;letter-spacing:-.02em;color:var(--obsidian);text-wrap:pretty}
.p-bio .eyebrow{align-self:flex-start}
.p-builder .pers{width:auto;border-color:var(--cloud)}
.p-builder .pers-photo{aspect-ratio:auto;height:200px;width:100%;object-fit:cover}
.p-builder .pers-photo-i{height:200px}
.p-builder .pers-photo-i{display:grid;place-items:center}

/* request a demo — the only LinkedIn link */
.p-req{position:relative;overflow:hidden;margin-top:20px;background:var(--snow);border-radius:var(--r-card);box-shadow:inset 0 0 0 1px var(--cloud);padding:36px 40px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.p-req::after{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(252,169,61,.2),rgba(252,169,61,0) 65%);pointer-events:none}
.p-req .t{flex:1;min-width:260px;position:relative;z-index:1}
.p-req h2{margin-top:14px;font-size:32px;line-height:1.2}
.p-req .lede{margin-top:8px}
.p-req .btn{position:relative;z-index:1;padding:14px 22px;font-size:15px}
.p-req .btn svg{width:18px;height:18px}

/* ---- high-quality icons: one stroke weight, monochrome, neutral tiles ---- */
.hq{flex:none}
.hq-tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--paper);box-shadow:inset 0 0 0 1px var(--cloud);color:var(--obsidian)}
.hq-tile.lg{width:52px;height:52px;border-radius:14px}
.hq-tile.accent{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(252,169,61,.35);color:var(--accent-deep)}

/* ---- product: statement → compare → audience ---- */
.p-product{display:flex;flex-direction:column;gap:16px}
.st-block{background:var(--snow);border-radius:var(--r-mid);box-shadow:inset 0 0 0 1px var(--cloud);padding:30px 34px}
.st-label{display:flex;align-items:center;gap:12px}
.st-big{margin:18px 0 0;font-size:26px;line-height:1.38;font-weight:500;letter-spacing:-.022em;color:var(--obsidian);text-wrap:pretty}
.st-rest{margin:12px 0 0;font-size:15.5px;line-height:1.6;color:var(--steel)}
.st-items{margin:18px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px 28px}
.st-items li{display:flex;gap:10px;font-size:15px;line-height:1.5;color:var(--slate)}
.st-items li .hq{color:var(--accent-deep);margin-top:1px}
.st-items b{color:var(--obsidian)}

.cmp{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--snow);border-radius:var(--r-mid);box-shadow:inset 0 0 0 1px var(--cloud)}
.cmp.one{grid-template-columns:minmax(0,1fr)}
.cmp-col{padding:30px 34px 26px;display:flex;flex-direction:column;align-items:stretch;gap:16px;min-width:0}
.cmp-col.prob{background:#fbfbfc;border-radius:var(--r-mid) 0 0 var(--r-mid);border-right:1px solid var(--cloud)}
.cmp.one .cmp-col.prob{border-right:0;border-radius:var(--r-mid)}
.cmp-arrow{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud),0 6px 14px -6px rgba(9,9,11,.2);display:grid;place-items:center;color:var(--obsidian);z-index:2}
.cmp-h{display:flex;align-items:flex-start;gap:14px}
.cmp-h small,.aud-main small{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
.cmp-h b{display:block;margin-top:5px;font-size:21px;font-weight:600;line-height:1.3;letter-spacing:-.022em;color:var(--obsidian);text-wrap:pretty}
.cmp-col > p,.cmp-col .fold p{margin:0;font-size:15px;line-height:1.6;color:var(--steel)}
.cmp-col .more{align-self:flex-start;font-size:13px;font-weight:600;color:var(--obsidian);border-bottom:1px solid var(--obsidian)}
.cmp-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.cmp-list li{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--cloud);font-size:15px;line-height:1.5;color:var(--slate)}
.cmp-list li > .hq{margin-top:1px}
.prob .cmp-list li > .hq{color:var(--ash)}
.cmp-list .mini{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--paper);box-shadow:inset 0 0 0 1px var(--cloud);color:var(--obsidian);margin-top:-4px}
.cmp-list .mini.num{font-size:12px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(252,169,61,.35)}
.cmp-list b{color:var(--obsidian);font-weight:600}

.aud{background:var(--snow);border-radius:var(--r-mid);box-shadow:inset 0 0 0 1px var(--cloud);padding:28px 32px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px 32px;align-items:center}
.aud-solo{grid-template-columns:minmax(0,1fr)}
.aud-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.aud-card{background:#fbfbfc;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--cloud);padding:8px 20px}
.aud-list{list-style:none;margin:0;padding:0}
.aud-list li{display:flex;gap:12px;align-items:flex-start;padding:13px 0;font-size:14.5px;line-height:1.5;color:var(--slate);overflow-wrap:anywhere}
.aud-list li + li{border-top:1px solid var(--cloud)}
.aud-list li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:.62em}
@media (max-width:760px){.aud-cards{grid-template-columns:minmax(0,1fr)}}
.aud-main{display:flex;align-items:center;gap:16px}
.aud-main b{display:block;margin-top:5px;font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.022em;color:var(--obsidian)}
.aud-chips{display:flex;flex-wrap:wrap;gap:8px}
.aud-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-pill);background:var(--paper);box-shadow:inset 0 0 0 1px var(--cloud);font-size:14px;line-height:1.35;color:var(--slate)}
.aud-chip .hq{color:var(--steel)}
.aud-ps{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.aud-ps > div{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-sm);background:#fbfbfc;box-shadow:inset 0 0 0 1px var(--cloud);font-size:14.5px;line-height:1.55;color:var(--slate)}
.aud-ps > div .hq{color:var(--steel);margin-top:1px}
.aud-ps b{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-bottom:3px}

/* ---- hero visual: generated product brief ---- */
.brief-wrap{position:relative;padding:16px 0 20px 20px}
.brief-back{position:absolute;inset:4px 26px 40px 0;border-radius:var(--r-mid);background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud);opacity:.7;transform:rotate(-2.2deg)}
.brief{position:relative;background:var(--snow);border-radius:var(--r-mid);box-shadow:inset 0 0 0 1px var(--cloud),0 34px 70px -38px rgba(9,9,11,.38);padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.b-top{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--cloud)}
.b-mark{width:42px;height:42px;border-radius:12px;background:var(--obsidian);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.5),inset 0 9px 14px -5px rgba(117,123,133,.4),0 0 0 1.5px rgb(44,46,52)}
.b-id{min-width:0;flex:1}
.b-id b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.016em;color:var(--obsidian);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-id span{display:block;font-size:10.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ash);margin-top:3px}
.brief .chip-rank{position:static;flex:none}
.b-k{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
.b-prob{background:#fbfbfc;border-radius:16px;box-shadow:inset 0 0 0 1px var(--cloud);padding:14px 16px}
.b-prob p{margin:8px 0 0;font-size:14.5px;line-height:1.5;color:var(--slate);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-list{margin-top:6px;display:flex;flex-direction:column}
.b-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--cloud)}
.b-item:first-child{border-top:0}
.b-item > div{min-width:0}
.b-item .hq-tile{width:36px;height:36px;border-radius:10px}
.b-item b{display:block;font-size:14.5px;font-weight:600;color:var(--obsidian);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-item .t{display:block;font-size:13px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.b-lede{margin:0;font-size:15px;line-height:1.55;color:var(--slate)}
.b-foot{display:flex;gap:8px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--cloud)}
.b-foot span,.b-foot a{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--steel);padding:6px 11px;border-radius:var(--r-pill);background:var(--paper);box-shadow:inset 0 0 0 1px var(--cloud);text-decoration:none}
.b-foot a{cursor:pointer;transition:color .15s,box-shadow .15s}
.b-foot a:hover{color:var(--ink,#09090b);box-shadow:inset 0 0 0 1px var(--steel)}

/* ---- resource links as ghost pills ---- */
.p-res{flex-wrap:wrap}
.p-res .btn{gap:8px}
.p-res .btn .ico{width:14px;height:14px;color:var(--ash)}
@media (max-width:960px){
  .cmp{grid-template-columns:minmax(0,1fr)}
  .cmp-col.prob{border-right:0;border-bottom:1px solid var(--cloud);border-radius:var(--r-mid) var(--r-mid) 0 0}
  .cmp-arrow{display:none}
  .aud{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .st-block{padding:22px}.st-big{font-size:20px}
  .cmp-col{padding:22px}
  .aud{padding:22px}
  .brief-wrap{padding:8px 0 0 8px}.brief-back{display:none}
}

/* ---- statements without a short opening sentence ---- */
.st-mid{margin-top:18px!important;font-size:18px!important;line-height:1.55!important;color:var(--slate)!important}

/* ---- hero brief: steps ---- */
.b-num{width:36px!important;height:36px!important;border-radius:10px!important;font-size:13px;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(252,169,61,.35)}
.b-more{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding-top:10px;border-top:1px solid var(--cloud);font-size:12.5px;font-weight:600;color:var(--steel)}
.b-more:hover{color:var(--obsidian)}
.b-lede{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px!important}

/* ---- how it's built: flow diagram ---- */
.dg{margin-top:4px;padding:30px;border-radius:var(--r-mid);background:radial-gradient(circle,#d9d9de 1px,transparent 1.3px) 0 0/18px 18px,#fafafa;box-shadow:inset 0 0 0 1px var(--cloud)}
.dg-grid{display:grid;gap:40px 44px}
.dg-node{position:relative;min-width:0;display:flex;flex-direction:column;gap:6px;padding:18px 20px 20px;border-radius:var(--r-sm);background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud),0 14px 28px -22px rgba(9,9,11,.45)}
.dg-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dg-top .hq{color:var(--ash)}
.dg-num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--obsidian);color:#fff;font-size:13px;font-weight:600;box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.5),inset 0 9px 14px -5px rgba(117,123,133,.4),0 0 0 1.5px rgb(44,46,52)}
.dg-node b{display:block;font-size:15.5px;font-weight:600;line-height:1.38;letter-spacing:-.012em;color:var(--obsidian)}
.dg-node b::first-letter{text-transform:uppercase}
.dg-t{font-size:13.5px;line-height:1.5;color:var(--steel)}
.dg-c{position:absolute;display:grid;place-items:center;font-style:normal;color:var(--obsidian);z-index:1}
.dg-c::before{content:"";position:absolute;background:var(--mist)}
.dg-c .hq{position:relative;width:22px;height:22px;padding:4px;border-radius:50%;background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud)}
.dg-r,.dg-l{top:24px;width:44px;height:22px}
.dg-r{left:100%}.dg-l{right:100%}.dg-l .hq{transform:rotate(180deg)}
.dg-r::before,.dg-l::before{left:0;right:0;top:50%;height:1.5px;margin-top:-.75px}
.dg-d,.dg-m{top:100%;left:50%;width:22px;height:40px;margin-left:-11px}
.dg-d::before,.dg-m::before{top:0;bottom:0;left:50%;width:1.5px;margin-left:-.75px}
.dg-d .hq,.dg-m .hq{transform:rotate(90deg)}
.dg-m{display:none}
.p-howtxt{margin:14px 0 0}

/* ---- resource cards (highlighted) ---- */
.p-links{margin-top:16px}
.p-links .scell{min-height:0;flex-direction:row;align-items:center;gap:16px;padding:22px 24px;transition:background .2s}
.p-links .scell:hover{background:#fafafa}
.p-links .lic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--obsidian);color:#fff;box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.5),inset 0 9px 14px -5px rgba(117,123,133,.4),0 0 0 1.5px rgb(44,46,52)}
.p-links .lt{min-width:0;flex:1}
.p-links .lt b{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.012em;color:var(--obsidian)}
.p-links .lt span{display:block;margin-top:2px;font-size:13px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-links .go{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-pill);background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud);font-size:13px;font-weight:600;color:var(--obsidian);flex:none;white-space:nowrap;transition:background .2s,color .2s}
.p-links .go .ico{width:14px;height:14px}
.p-links .scell:hover .go{background:var(--obsidian);color:#fff;box-shadow:none}
@media (max-width:720px){
  .dg{padding:16px}
  .dg-grid{grid-template-columns:minmax(0,1fr)!important;gap:32px}
  .dg-node{grid-row:auto!important;grid-column:auto!important}
  .dg-r,.dg-l,.dg-d{display:none}
  .dg-m{display:grid;height:32px}
  .p-links .scell{padding:18px}
}


/* ---- hub diagram (components around the product) ---- */
.hb{display:grid;grid-template-columns:minmax(0,1fr) 230px minmax(0,1fr);gap:14px 52px;align-items:center}
.hb-node{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-sm);background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud),0 14px 28px -22px rgba(9,9,11,.45);min-width:0}
.hb-node b{display:block;font-size:15px;font-weight:600;line-height:1.35;color:var(--obsidian)}
.hb-node b::first-letter{text-transform:uppercase}
.hb-node .dg-t{display:block;margin-top:3px}
.hb-c{position:absolute;top:50%;width:52px;height:1.5px;background:var(--mist)}
.hb-c::after{content:"";position:absolute;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--snow);box-shadow:inset 0 0 0 1.5px var(--ash)}
.hb-l .hb-c{left:100%}.hb-l .hb-c::after{right:-4px}
.hb-r .hb-c{right:100%}.hb-r .hb-c::after{left:-4px}
.hb-core{grid-column:2;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px 18px;border-radius:var(--r-mid);background:var(--obsidian);color:#fff;box-shadow:0 24px 50px -26px rgba(9,9,11,.6)}
.hb-core .b-mark{background:#fff;color:var(--obsidian);box-shadow:none}
.hb-core b{font-size:17px;font-weight:600;letter-spacing:-.016em}
.hb-core span:last-child{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
/* ---- long compare lists ---- */
.cmp-list li.later{display:none}
.cmp-list.open li.later{display:flex}
.cmp-all{align-self:flex-start;font-size:13px;font-weight:600;color:var(--obsidian);border-bottom:1px solid var(--obsidian);padding:0;margin-top:-4px}
.b-item b.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.38}
/* ---- builder without a bio ---- */
.p-who{display:flex;align-items:center;gap:20px;padding:24px 28px}
.p-who-av,.p-who-av-i{width:72px;height:72px;border-radius:20px;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--paper);box-shadow:inset 0 0 0 1px var(--cloud);font-weight:600;color:var(--steel)}
/* initials badge: big and dead centre (the caption rule below must not reach it) */
span.p-who-av-i{margin:0;font-size:26px;line-height:1;letter-spacing:-.01em;text-transform:uppercase;text-align:center;color:var(--iron)}
.p-who b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--obsidian)}
.p-who > div > span{display:block;margin-top:6px;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
span.p-bl-av-i{line-height:1;letter-spacing:-.01em;text-transform:uppercase}
@media (max-width:860px){
  .hb{grid-template-columns:minmax(0,1fr);gap:12px}
  .hb-node,.hb-core{grid-row:auto!important;grid-column:auto!important}
  .hb-core{order:-1;flex-direction:row;justify-content:flex-start;padding:16px 18px}
  .hb-c{display:none}
}


/* ---- builder: one card, height follows the bio ---- */
.p-bl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:30px;align-items:start;padding:30px 34px}
.p-bl-av,.p-bl-av-i{width:120px;height:120px;border-radius:24px;object-fit:cover;display:grid;place-items:center;background:var(--paper);box-shadow:inset 0 0 0 1px var(--cloud);font-size:28px;font-weight:600;color:var(--steel)}
.p-bl blockquote{margin:0;font-size:22px;line-height:1.45;font-weight:500;letter-spacing:-.018em;color:var(--obsidian);text-wrap:pretty}
.p-bl-by{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--cloud)}
.p-bl-by b{font-size:16px;font-weight:600;color:var(--obsidian)}
.p-bl-by span{font-size:11.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
@media (max-width:620px){.p-bl{grid-template-columns:minmax(0,1fr);gap:18px;padding:22px}.p-bl-av,.p-bl-av-i{width:72px;height:72px;border-radius:18px}.p-bl blockquote{font-size:18px}}

/* long raw URLs inside text wrap instead of widening the page */
main p a,main li a,main blockquote a,.dg-t a,.s-note a{overflow-wrap:anywhere}
.cmp-col p,.st-block p,.s-note p,.aud-chip,.cmp-list li > span{overflow-wrap:anywhere}
.aud-chip{max-width:100%}
.sec-head > div{min-width:0}

/* ---- clickable text links ---- */
a.tlink.tlink{color:#2563eb;font-weight:500;text-decoration:underline;text-decoration-color:rgba(37,99,235,.35);text-underline-offset:3px;text-decoration-thickness:1px;overflow-wrap:anywhere}
a.tlink.tlink:hover{color:#1d4ed8;text-decoration-color:currentColor}
/* ---- how-it's-built notes: tech stack chips + full-width lines ---- */
.p-hownotes{display:flex;flex-direction:column;gap:12px;margin:0 0 16px}
.dg + .p-hownotes{margin-top:16px}
.p-stack{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.p-hero-stack{margin-top:22px}
.p-stack-k{margin-right:6px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
.p-chip{display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:var(--r-pill);background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud);font-size:13.5px;font-weight:500;color:var(--slate)}
.p-hownotes .p-howtxt{margin:0;max-width:none;font-size:15px;line-height:1.6;color:var(--steel)}
/* ---- lessons: the number sits in the top row, so long text never runs under it ---- */
.p-learn .sghost{top:14px;bottom:auto;right:20px;font-size:40px;line-height:1}


.cmp-h.solo{align-items:center}
.cmp-h.solo small{font-size:12.5px;color:var(--steel)}

/* ---- LinkedIn button (brand blue) ---- */
.btn.btn-li{background:#0a66c2;color:#fff;box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.45),inset 0 10px 16px -6px rgba(255,255,255,.18),0 0 0 1.5px #0857a8,0 10px 24px -10px rgba(10,102,194,.55);gap:10px}
.btn.btn-li:hover{background:#004182;box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.35),0 0 0 1.5px #003a73,0 10px 24px -10px rgba(0,65,130,.6)}
.btn.btn-li svg{width:19px;height:19px}
/* ---- like / dislike ---- */
.p-react{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.p-react-q{font-size:14px;font-weight:500}
.p-react-b{display:inline-flex;gap:8px}
.p-react button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-pill);font-size:14px;font-weight:600;transition:background .2s,color .2s,box-shadow .2s}
.p-react button b{font-weight:600}
.p-react button b:empty{display:none}
.p-react button[data-r="dislike"]{padding:0 14px}
.p-react button .hq{transition:transform .2s}
.p-react button:active .hq{transform:scale(.88)}
.p-react.dark{margin-top:18px;padding:0 4px}
.p-react.dark .p-react-q{color:rgba(255,255,255,.7)}
.p-react.dark button{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.p-react.dark button:hover{background:rgba(255,255,255,.14)}
.p-react.dark button.on{background:#fff;color:var(--obsidian);box-shadow:none}
.p-react.light{margin-top:16px;padding:18px 22px;border-radius:var(--r-mid);background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud)}
.p-react.light .p-react-q{color:var(--slate)}
.p-react.light button{background:var(--snow);color:var(--obsidian);box-shadow:inset 0 0 0 1px var(--cloud)}
.p-react.light button:hover{background:var(--paper)}
.p-react.light button.on{background:var(--obsidian);color:#fff;box-shadow:none}
.p-react button.on[data-r="like"] .hq{fill:currentColor;fill-opacity:.18}


/* ---- hero card entrance: the card lands, then each part follows ---- */
@media (prefers-reduced-motion: no-preference){
  html{scroll-behavior:smooth}
  .brief{animation:bIn .7s cubic-bezier(.2,.7,.2,1) both}
  .brief-back{animation:bBack .9s cubic-bezier(.2,.7,.2,1) .12s both}
  .p-hero .an{opacity:0;animation:bUp .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--d) * 1ms)}
  .b-item.an .hq-tile{animation:bPop .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--d) * 1ms + 120ms)}
}
@keyframes bIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bBack{from{opacity:0;transform:rotate(0deg) translateY(12px)}to{opacity:.7;transform:rotate(-2.2deg)}}
@keyframes bUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bPop{from{transform:scale(.6)}to{transform:none}}
/* ---- resource links under the builder ---- */
.p-by-links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px}
.p-by-links.solo{margin-top:28px}
.p-by-links a{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:#2563eb;text-decoration:underline;text-decoration-color:rgba(37,99,235,.3);text-underline-offset:3px}
.p-by-links a:hover{color:#1d4ed8;text-decoration-color:currentColor}
.p-by-links a .ico{width:13px;height:13px;opacity:.7}
#audience .aud{margin-top:4px}


/* ---- hero resources: icon buttons ---- */
.p-res-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.p-res-row.solo{margin-top:28px}
.p-resb{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 12px 0 14px;border-radius:var(--r-btn);background:var(--snow);box-shadow:inset 0 0 0 1px var(--cloud),0 1px 2px rgba(9,9,11,.05);white-space:nowrap;transition:transform .2s,box-shadow .2s}
.p-resb:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--mist),0 10px 22px -12px rgba(9,9,11,.3)}
.p-resb-ic{display:grid;place-items:center;flex:none;color:var(--obsidian)}
.p-resb b{font-size:14px;font-weight:600;color:var(--obsidian)}
.p-resb > .ico{width:17px;height:17px;margin-left:4px;color:var(--steel);stroke-width:2;transition:color .2s,transform .2s}
.p-resb:hover > .ico{color:var(--obsidian);transform:translate(1px,-1px)}
@media (max-width:620px){.p-resb{flex:1 1 100%}.p-resb > .ico{margin-left:auto}}


/* letter mark on the brand amber */
.b-mark,.hb-core .b-mark{background:var(--accent);color:var(--obsidian);box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.7),inset 0 10px 14px -6px rgba(255,255,255,.45),0 0 0 1.5px #e9962c}

/* ---- scroll reveal (uses `translate`, so it never fights hover transforms) ---- */
@media (prefers-reduced-motion: no-preference){
  [data-rv]{opacity:0;translate:0 18px;transition:opacity .7s var(--ease,cubic-bezier(.2,.7,.2,1)),translate .7s var(--ease,cubic-bezier(.2,.7,.2,1))}
  [data-rv].rv-in{opacity:1;translate:none}
}

.p-chip{gap:8px}
.p-logo{width:16px;height:16px;flex:none}
.p-logo-x{display:grid;place-items:center;color:var(--ash)}
/* responsive (on top of the system's own rules) */
@media (max-width:960px){
  .p-hero{grid-template-columns:minmax(0,1fr);gap:36px;padding-top:40px}
  .srow{grid-template-columns:minmax(0,1fr)}
  .s-list{border-left:0;border-top:1px solid var(--cloud)}
  .p-builder{grid-template-columns:minmax(0,1fr)}
  .p-builder .pers{flex-direction:row}
  .p-builder .pers-photo{width:120px;flex:none}
}
@media (max-width:620px){
  .p-links{grid-template-columns:minmax(0,1fr)!important}
  .p-steps .scell{min-height:0;padding:20px 22px}
  .p-cap{display:none}
  .p-play{width:60px;height:60px}
  .p-hero h1{font-size:40px}.p-hero h1.long{font-size:34px}
  main section{padding-top:56px}
  .s-txt{padding:22px}
  .s-item{padding:14px 18px;grid-template-columns:36px minmax(0,1fr)}
  .p-wall{padding:24px 16px 20px;border-radius:28px}
  .p-incl ul{columns:1}
  .p-req{padding:26px 22px;border-radius:var(--r-mid)}
  .p-bio{padding:24px}.p-bio blockquote{font-size:20px}
}
.pick{position:fixed;right:16px;bottom:16px;z-index:80;background:#fff;border:1px solid var(--cloud);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:10px 12px;font-size:12px;color:var(--fog);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px)}
.pick select{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--mist);max-width:240px}
</style>

          var prev = out[out.length - 1];
          // re-join a sentence that was hard-wrapped mid-line ("…closers. The" + "AI executes…")
          if (prev && !bul.test(l) && !sep.test(l) && !sep.test(prev) && !bul.test(prev) && !/[.!?:;]$/.test(prev) && !isHd(prev)) out[out.length - 1] = prev + ' ' + l;
          else out.push(l);
        });
        return out;
      }).filter(function (ls) { return ls.length; });
      // "VynAI - AI voice agent…" → bold lead name
      var lead = function (t) { var m = t.match(/^([A-Z][\w&+.' ]{1,28}?)\s+[-–—]\s+(.+)$/); return m ? '<b>' + esc(m[1]) + '</b> — ' + linkify(m[2]) : pHTML(t); };
      var first = true;
      var line = function (l) {
        if (sep.test(l)) return '<div class="p-desc-vs" role="separator"><span>' + esc(l.replace(/\.$/, '')) + '</span></div>';
        if (bul.test(l)) return '<ul><li>' + si('check') + '<span>' + pHTML(l.replace(bul, '')) + '</span></li></ul>';
        if (isHd(l)) return '<h4>' + esc(l.replace(/^#+\s*/, '').replace(/:$/, '')) + '</h4>';
        var cls = first ? ' class="lede-p"' : ''; first = false;
        return '<p' + cls + '>' + lead(l) + '</p>';
      };
      var body = blocks.map(function (ls) {
        if (ls.length > 1 && ls.every(function (l) { return bul.test(l); }))
          return '<ul>' + ls.map(function (l) { return '<li>' + si('check') + '<span>' + pHTML(l.replace(bul, '')) + '</span></li>'; }).join('') + '</ul>';
        return ls.map(line).join('');
      }).join('');
      return '<div class="sheet p-desc"><div class="p-desc-h"><span class="eyebrow">About the project</span><h3>' + (longName ? 'Description' : 'About ' + esc(name)) + '</h3></div><div class="p-desc-b">' + body + '</div></div>';
    }

    /* demo (system dark wall) */
    if (has.demo) {
      var art = thumb ? '<img class="blur" src="' + esc(thumb) + '" alt=""><img class="img" src="' + esc(thumb) + '" alt="">' : '';
      H.push('<section id="demo"><div class="wall p-wall"><p class="wall-label">Product demo · ' + esc(name) + '</p><div class="p-player">' +
        (vid.src ? '<button class="p-poster" type="button" data-src="' + esc(vid.src) + '" aria-label="Play demo video">' + art + '<span class="p-play">' + PLAY + '</span><span class="p-cap"><span>Watch the demo</span><span>' + esc(vid.label) + '</span></span></button>'
                 : '<a class="p-poster" href="' + esc(vid.url) + '" target="_blank" rel="noopener">' + art + '<span class="p-play">' + PLAY + '</span><span class="p-cap"><span>Watch the demo</span><span>Opens on ' + esc(vid.label) + '</span></span></a>') +
        (awardTxt ? '<span class="chip-rank is-top">' + esc(awardTxt) + '</span>' : '') + '</div></div>' + descBlock() + '</section>');
    } else if (desc) {
      H.push('<section id="demo">' + descBlock() + '</section>');
    }

    /* who it's for */
    /* (Who it's for section removed) */

    /* (How it's built section removed) */
    function hub(st) {   // components around the product
      var n = st.length, left = Math.ceil(n / 2), rows = Math.max(left, 1);
      var icons = uniqIcons(st.map(function (x) { return [x.title, x.text]; }));
      var node = function (x, side, row, i) { var ic = icons[i];
        return '<div class="hb-node hb-' + side + '" style="grid-row:' + row + ';grid-column:' + (side === 'l' ? 1 : 3) + '">' + tileq(ic, '', 18) + '<div><b>' + esc(x.title.replace(/\.$/, '')) + '</b>' + (x.text ? '<span class="dg-t">' + linkify(x.text) + '</span>' : '') + '</div><i class="hb-c" aria-hidden="true"></i></div>'; };
      return '<div class="dg"><div class="hb" style="grid-template-rows:repeat(' + rows + ',auto)">' +
        st.map(function (x, i) { return i < left ? node(x, 'l', i + 1, i) : node(x, 'r', i - left + 1, i); }).join('') +
        '<div class="hb-core" style="grid-row:1 / span ' + rows + '"><span class="b-mark">' + esc(name.charAt(0).toUpperCase()) + '</span><b>' + esc(name) + '</b><span>' + esc(compTitle || 'Architecture') + '</span></div></div></div>';
    }
    function diagram(st) {
      var n = st.length, cols = n <= 4 ? n : 3, icons = uniqIcons(st.map(function (x) { return [x.title, x.text]; }), []);
      return '<div class="dg"><div class="dg-grid" style="grid-template-columns:repeat(' + cols + ',minmax(0,1fr))">' + st.map(function (x, i) {
        var r = Math.floor(i / cols), k = i % cols, c = r % 2 ? cols - 1 - k : k;
        var dir = i === n - 1 ? '' : Math.floor((i + 1) / cols) === r ? (r % 2 ? 'l' : 'r') : 'd';
        var ic = icons[i];
        return '<div class="dg-node" style="grid-row:' + (r + 1) + ';grid-column:' + (c + 1) + '"><div class="dg-top"><span class="dg-num">' + (i + 1) + '</span>' + (ic ? hq(ic, 18) : '') + '</div>' +
          '<b>' + esc(x.title.replace(/\.$/, '')) + '</b>' + (x.text ? '<span class="dg-t">' + linkify(x.text) + '</span>' : '') +
          (dir ? '<i class="dg-c dg-' + dir + '" aria-hidden="true">' + hq('arrowr', 14) + '</i>' : '') + (i < n - 1 ? '<i class="dg-c dg-m" aria-hidden="true">' + hq('arrowr', 14) + '</i>' : '') + '</div>';
      }).join('') + '</div></div>';
    }

    /* builder + request a demo */
    var personPhoto = photo ? '<img class="pers-photo" data-ini="' + esc(ini(builder)) + '" data-fbclass="pers-photo pers-photo-i" src="' + esc(photo) + '" alt="' + esc(builder) + '">' : '<span class="pers-photo pers-photo-i"><i>' + esc(ini(builder)) + '</i></span>';
    H.push('<section id="builder"><div class="sec-head"><div><span class="eyebrow">About the builder</span><h2>Meet ' + esc((builder.split(/\s+/)[0]) || 'the builder') + '</h2></div></div>' +
      (bio ? '<div class="sheet p-bl">' + avatar('p-bl-av') + '<div class="p-bl-t"><blockquote>' + esc(cut(bio, 420)) + '</blockquote>' +
        '<div class="p-bl-by"><b>' + esc(builder || 'MyAI builder') + '</b><span>' + esc(['Builder of ' + name, 'MyAI Community', cohort].filter(Boolean).join(' · ')) + '</span></div></div></div>'
      : '<div class="sheet p-who">' + avatar('p-who-av') + '<div><b>' + esc(builder || 'MyAI builder') + '</b><span>' + esc(['Builder of ' + name, 'MyAI Community', cohort].filter(Boolean).join(' · ')) + '</span></div></div>') +
      (has.req ? '<div class="p-req" id="request"><div class="t"><span class="eyebrow">Request a demo</span><h2>' + (longName ? 'Want a demo of this project?' : 'Want a demo of ' + esc(name) + '?') + '</h2>' +
        '<p class="lede">Connect with ' + esc(builder || 'the builder') + ' on LinkedIn and ask for a walkthrough for your company.</p></div>' +
        '<a class="btn btn-li" href="' + esc(li) + '" target="_blank" rel="noopener">' + LIN + 'Connect on LinkedIn</a></div>' : '') + reactHTML('light') + '</section>');

    /* more projects (system project cards) */
    var more = Array.isArray(window.MORE_PROJECTS) ? window.MORE_PROJECTS.slice(0, 3) : PREVIEW_PROJECTS.filter(function (m) { return m.id !== p.id && (m.thumbnail_url || m.banner_url); }).slice(0, 3);
    if (more.length) {
      H.push('<section id="more" style="padding-bottom:24px"><div class="sec-head"><div><span class="eyebrow">More from the community</span><h2>More projects</h2></div><div class="sec-actions"><a href="' + ALL_PROJECTS + '" class="btn btn-ghost btn-pill">See All ' + si('arrow') + '</a></div></div>' +
        '<div class="grid g3">' + more.map(function (m) {
          var mn = cleanTitle(m.title).split(/\s[-–—|:]\s/)[0], mt = url(m.thumbnail_url || m.banner_url), ms = m.sections || [];
          var t10 = ms.filter(function (s) { return s.section === 'top10'; })[0], aw = ms.filter(function (s) { return s.section === 'awards' && s.award_name; })[0];
          var b = t10 ? 'Top 10' + (t10.rank && t10.rank < 999 ? ' · #' + t10.rank : '') : aw ? aw.award_name : '';
          var href = window.PROJECT ? PROJECT_PAGE + encodeURIComponent(m.id) : '?id=' + encodeURIComponent(m.id);
          return '<a class="pcard" href="' + esc(href) + '"><div class="thumb">' + (b ? '<span class="chip-rank is-top">' + esc(b) + '</span>' : '') +
            (mt ? '<img src="' + esc(mt) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<span class=&quot;thumb-empty&quot;><i>' + esc(ini(m.builder_name)) + '</i></span>\'">' : '<span class="thumb-empty"><i>' + esc(ini(m.builder_name)) + '</i></span>') +
            '<div class="reveal"><span>' + esc(cohortOf(m)) + '</span>' + si('upright') + '</div></div>' +
            '<div class="pbody"><h3 class="pcard-title">' + esc(mn) + '</h3><div class="pmeta"><span class="av-i" aria-hidden="true">' + esc(ini(m.builder_name)) + '</span><div class="pmeta-txt"><div class="pmeta-name">' + esc(m.builder_name || '') + '</div><div class="pmeta-sub">' + esc(cohortOf(m)) + '</div></div></div></div></a>';
        }).join('') + '</div></section>');
    }
    H.push('</div></main>');
    H.push('<footer><div class="wrap foot"><a href="' + HOME + '" class="logo"><span>MYAI</span><span>Community</span></a><div class="foot-links"><a href="' + HOME + '">HOME</a><a href="' + ALL_PROJECTS + '">ALL PROJECTS</a><a href="/project-login">PROJECT LOGIN</a></div></div></footer>');

    var app = document.getElementById('app');
    app.innerHTML = H.join('');

    app.querySelectorAll('img[data-ini]').forEach(function (im) { im.addEventListener('error', function () {
      var fb = im.getAttribute('data-fbclass'), s = document.createElement('span');
      if (fb) { s.className = fb; s.innerHTML = '<i>' + esc(im.getAttribute('data-ini')) + '</i>'; } else { s.className = im.className + '-i'; s.textContent = im.getAttribute('data-ini'); }
      im.replaceWith(s); }); });
    var shot = app.querySelector('.p-shot .img');
    if (shot) shot.addEventListener('error', function () { var t = shot.closest('.thumb'); t.querySelectorAll('img').forEach(function (x) { x.remove(); }); t.insertAdjacentHTML('beforeend', '<span class="thumb-empty"><b>' + esc(name) + '</b></span>'); });
    app.querySelectorAll('.p-poster img').forEach(function (im) { im.addEventListener('error', function () { im.remove(); }); });
    var poster = app.querySelector('button.p-poster');
    if (poster) poster.addEventListener('click', function () { var f = document.createElement('iframe'); f.src = poster.getAttribute('data-src'); f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true; f.title = name + ' demo'; poster.replaceWith(f); });
    var ab = app.querySelector('.p-allbtn');
    if (ab) ab.addEventListener('click', function () { var g = app.querySelector('.p-learn'); var open = g.classList.toggle('open'); ab.textContent = open ? 'Show fewer' : 'Show all ' + learned.length + ' lessons'; padSheet(g); });
    (function () {   // scroll reveal: parts fade up as they enter the screen, one after another
      var SEL = ['.p-hero > div:first-child > *', '.rule', '.sec-head', '.st-block', '.cmp-col', '.cmp-list li', '.aud', '.aud-chip', '.aud-ps > div', '.p-wall', '.dg-node', '.hb-core', '.hb-node', '.p-hownotes > *', '.p-links .scell', '.p-incl', '.p-incl li', '.p-bl', '.p-who', '.p-req', '.p-react', '#more .pcard', '.foot'];
      if (window.__rvIO) window.__rvIO.disconnect();
      if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || !('IntersectionObserver' in window)) return;
      var els = app.querySelectorAll(SEL.join(','));
      els.forEach(function (el) { el.setAttribute('data-rv', ''); });
      var io = window.__rvIO = new IntersectionObserver(function (entries) {
        var k = 0;
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          var el = en.target, delay = Math.min(k++, 8) * 90;
          el.style.transitionDelay = delay + 'ms'; el.classList.add('rv-in'); io.unobserve(el);
          setTimeout(function () { el.removeAttribute('data-rv'); el.classList.remove('rv-in'); el.style.transitionDelay = ''; }, delay + 900);   // hand the element back to its own hover transitions
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.06 });
      els.forEach(function (el) { io.observe(el); });
    })();
    app.querySelectorAll('.p-react').forEach(function (bar) {
      // Counts come from the backend record (thumbs_up / thumbs_down). One vote per visitor: the site sets
      // window.MY_VOTE once the vote is saved, and the buttons lock after that.
      var cur = window.MY_VOTE === 'up' ? 'like' : window.MY_VOTE === 'down' ? 'dislike' : '';
      var saved = cur;   // vote already included in the server's counts
      var num = function (v) { return Math.max(0, +v || 0); };
      var counts = { like: num(p.thumbs_up != null ? p.thumbs_up : (p.like_count != null ? p.like_count : p.likes)), dislike: num(p.thumbs_down != null ? p.thumbs_down : (p.dislike_count != null ? p.dislike_count : p.dislikes)) };
      var base = { like: counts.like - (saved === 'like' ? 1 : 0), dislike: counts.dislike - (saved === 'dislike' ? 1 : 0) };
      var paint = function () { bar.querySelectorAll('button').forEach(function (b) { var r = b.getAttribute('data-r'), n = num(base[r]) + (cur === r ? 1 : 0); b.classList.toggle('on', cur === r); b.setAttribute('aria-pressed', String(cur === r)); b.querySelector('b').textContent = n ? n : ''; }); };
      bar.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () {
        if (cur) return;   // already rated
        cur = b.getAttribute('data-r');
        paint();
        try { if (window.top !== window) parent.postMessage({ type: 'project-vote', vote: cur === 'like' ? 'up' : 'down', on: true }, '*'); } catch (e) {}
      }); });
      paint();
    });
    app.querySelectorAll('.cmp-all').forEach(function (b) { b.addEventListener('click', function () { var l = b.previousElementSibling, open = l.classList.toggle('open'); b.textContent = open ? 'Show less' : 'Show all ' + b.getAttribute('data-n'); }); });
    app.querySelectorAll('.more').forEach(function (b) { b.addEventListener('click', function () { var f = b.previousElementSibling; var open = f.classList.toggle('fold'); b.textContent = open ? 'Read more' : 'Show less'; }); });
  }

  function padSheet(grid) {
    if (!grid) return;
    var cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
    grid.querySelectorAll('.filler').forEach(function (f) { f.remove(); });
    var real = grid.children.length, need = (cols - (real % cols)) % cols;
    for (var i = 0; i < need; i++) { var d = document.createElement('div'); d.className = 'scell filler'; d.setAttribute('aria-hidden', 'true'); grid.appendChild(d); }
  }
  function padAll() { document.querySelectorAll('.p-steps,.p-learn').forEach(padSheet); }
  window.addEventListener('resize', padAll);
  if (window.PROJECT) { render(window.PROJECT); padAll(); return; }
  var id = new URLSearchParams(location.search).get('id');
  var cur = PREVIEW_PROJECTS.filter(function (x) { return x.id === id; })[0] || PREVIEW_PROJECTS[0];
  render(cur); padAll();
  var pk = document.createElement('div'); pk.className = 'pick';
  pk.innerHTML = '<span>Preview</span><select aria-label="Preview project">' + PREVIEW_PROJECTS.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === cur.id ? ' selected' : '') + '>' + esc(cleanTitle(x.title).split(/\s[-–—|:]\s/)[0]) + (x.builder_name ? ' · ' + esc(x.builder_name) : '') + '</option>'; }).join('') + '</select>';
  document.body.appendChild(pk);
  pk.querySelector('select').addEventListener('change', function (e) { var x = PREVIEW_PROJECTS.filter(function (y) { return y.id === e.target.value; })[0]; history.replaceState(null, '', '?id=' + x.id); render(x); padAll(); window.scrollTo(0, 0); });
})();
</script>
</body>
