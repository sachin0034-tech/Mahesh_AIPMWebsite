ort_label": "Cohort 9"}]}, {"id": "b05b627c-1536-4300-9104-4c0b031cd153", "title": "Governed Prior Authorization (GPA)", "description": "Jim built an AI prior authorization agent for healthcare payers, targeting a regulated and painfully slow workflow:\n  providers submit authorization requests (e.g., a cancer CT scan); utilization management nurses must manually\n  review, classify, and decide — creating delays that frustrate providers, drive network exits, and harm member care.\n  Regulations now mandate improvement. Jim's solution: a Python trust harness wrapping 4 Claude agents (classifier,\n  clinical criteria comparator, uncertainty flagger, write-up generator) that prepare and synthesize all the messy\n  incoming evidence so the nurse can focus solely on the judgment step. No human prompting of individual agents — all\n  controlled by schema and trust rules. Full admissibility logging tracks every agent action. A live evaluation\n  harness runs in real-time alongside the pipeline, capturing: accuracy (true/false), pipeline speed, token costs,\n  adversarial gate results, confidence calibration, and per-case trust scores with targets. Feedback loop continuously\n  improves the system. Nurse queue dashboard shows active cases with the full AI-prepared summary ready for final\n  determination. Next step: test whether this workflow trust pattern applies outside healthcare.", "builder_name": "Jim Mandas", "builder_linkedin": "https://www.linkedin.com/in/jim-mandas/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785416280174.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=qN%2F2VS7jC6lAqoTKX2ochwXHdg%2Fywz6G4LbbRC1nQJ0%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785416280698.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=XgmD9rORYf6Uv7qgwXUlAcSsbO4SjjbQHeKzQURkQUY%3D", "video_link": null, "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1cDVSagh_r7Jyx3_izKYFR1bFwXPCJzhGtSXjHWN-Pv0/edit?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "67ec04b4-7113-4e60-88c4-cb8bb799e89b", "project_id": "b05b627c-1536-4300-9104-4c0b031cd153", "section": "awards", "rank": 999, "award_name": "Best Regulated Tech/Compliance AI", "cohort_label": null}, {"id": "96c229d0-da9c-4d1a-b9c9-5d678b8d7f2a", "project_id": "b05b627c-1536-4300-9104-4c0b031cd153", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "5b68c671-2736-4621-becf-150a985e4981", "title": "TrustGate/SiteProof", "description": "Swaty works in a regulated industry and presented two products. Her main product, TrustGate, addresses a gap she\n  sees emerging as AI moves from co-pilot (first generation) to autonomous agents (second generation) to what she's\n  calling the third generation: accountable AI. The core problem: there is no system of record for AI decisions. In\n  financial or medical systems, it's currently impossible to reconstruct why a decision was made, what policies were\n  evaluated, what data was used, or what bounds applied. As more agents make recommendations in production, the\n  traceability problem becomes severe — especially when models, tools, humans, and multiple systems are all\n  interacting in the same pipeline. TrustGate is an accountability layer that sits between AI systems and the actions\n  they take. Every consequential AI decision creates an accountability packet capturing: context, evidence, models and\n  agents involved, tool calls made, any human approvals, and the final outcome — effectively a flight recorder for AI\n  systems. These packets build an accountability graph for the company that can answer regulatory questions: \"Why was\n  this loan rejected?\" or \"Why was this treatment recommended?\" Delivered as a SaaS API; roadmap: more integrations →\n  MCP server → SDK. Future agents: investigator, auditor, certifier. GTM: AI consulting or implementation firms;\n  initial focus on healthcare (HIPAA). Revenue: per-decision or per-record accountability pricing. As a late bonus,\n  she also briefly described SiteProof — an accountability platform proving building maintenance work actually\n  happened. Mobile app for workers: whisper input, photos, guided workflow with building schematics/maps,\n  communication with expert consultation, before-and-after proof capture. Creates a verified audit trail for insurance\n  and compliance. Business model: per-building subscription, compliance-first.", "builder_name": "Swaty Rao", "builder_linkedin": "https://www.linkedin.com/in/swatyrao/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785415881394.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ZGCupDRZ6pQJG5xPLMOEJMGo9FXZC5mOGZ5lwb%2BEI5s%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785415882023.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=FGOSt%2F8%2FdNr7NtEPagbKWMAnyPdMOB3VhS%2B47lsNUuw%3D", "video_link": null, "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "aab1d7a1-ede0-43d5-a5a6-3c62c838da8f", "project_id": "5b68c671-2736-4621-becf-150a985e4981", "section": "awards", "rank": 999, "award_name": "Best Ethical AI Thinking", "cohort_label": null}, {"id": "71cb1cd2-6194-4f4a-b35c-8476c2824815", "project_id": "5b68c671-2736-4621-becf-150a985e4981", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "b652d568-6ebb-426c-b27a-29873a04ad7e", "title": "ClaimScan, AppealBot, & RecoveryDash", "description": "Jeff spent his career in healthcare revenue cycle at large health systems, KPMG, GuideHouse, and Finvi. He built\n  ClaimScan/AppealBot/RecoveryDash to fix a structural blind spot he watched leak money at scale. Insurers routinely\n  pay providers less than their contracted rate — but the underpayment never gets flagged because the billing software\n  automatically writes off the remainder as a contractual adjustment and closes the account at zero balance. Nobody\n  ever compares what was paid against what is contractually owed. The result: 3–5% of net revenue for a specialty\n  practice — $250K to nearly $500K per year for a 1–10 physician group — disappears silently. Jeff found $40K in his\n  first sample using pulled remittances and physician interviews. The key accuracy distinction: he doesn't use \"billed\n  minus paid\" (inflated) as the underpayment number — he strips legitimate write-offs and patient responsibility to\n  arrive at the honest, recoupable figure, which is what makes appeals credible and winnable. The three-module system:\n  ClaimScan reconciles contracts against remittance data automatically; AppealBot generates payer-specific appeal\n  letters and files them; Recovery Dash tracks recoveries through the cycle. Business model: contingency only, zero\n  upfront — paid only on recovered revenue. Architecture: N8N orchestrator agent with payer-specific sub-agents; human\n  approves at the pattern level, not claim by claim (which is what makes small-dollar recovery economically viable).\n  PHI never leaves the building. GTM: Southern California physician network plus billing companies (one billing\n  company partner reaches 30–50 practices). Two early discovery calls completed. Roadmap: full N8N automation, 837\n  parser to catch underpayments before the bill even goes out, FHIR API tailwind (CMS mandating payer data openness by\n  2027).", "builder_name": "Jeffrey Ma", "builder_linkedin": "https://www.linkedin.com/in/mrjeffreyma/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785415489701.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=FflDF90JxQKhZGfqAbhZCxjdx7mQdJ1WYYNJUSi6tF4%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785415491129.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=Gt2BmQ2WUQtpC9vkIzULHsS%2FoYpn%2BbfR8iVCCZ7XKdo%3D", "video_link": "https://drive.google.com/file/d/1PtqABgdfEJBnS9Dd3-HBcD2UgQOIZu4r/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1ly5Y-NYWvRliJnVgW0bIAxA_I2h_xlT0/edit?usp=sharing&ouid=109078697182739834620&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "e2be14ca-710a-4d65-8fc5-7006be173252", "project_id": "b652d568-6ebb-426c-b27a-29873a04ad7e", "section": "awards", "rank": 999, "award_name": "Best Explainable AI Product", "cohort_label": null}, {"id": "0ef5313e-8999-4f86-a112-e303945c992f", "project_id": "b652d568-6ebb-426c-b27a-29873a04ad7e", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "bceacddb-11e0-45d7-93d0-fa9048d343f4", "title": "Concourse", "description": "Andrew, a product manager at a SaaS company, built Concourse to solve a problem invisible to traditional analytics:\n  as agent traffic begins to outpace human traffic to SaaS websites, product teams have no visibility into what agents\n  are asking, what gaps they hit, and what product capabilities they're looking for that don't exist. When a user\n  asks an LLM about a product and the agent crawls the website to answer, the SaaS company gets none of that intent\n  signal — Anthropic or Google sees the full query-to-answer chain, but the product team sees nothing. The net result:\n  AI providers accumulate roadmap intelligence on your market while you fly blind. Concourse flips this: two agents\n  continuously monitor a SaaS company's web footprint. (1) Answerability agent: simulates agent queries against the\n  site, scores which questions the site can answer (and which it can't), names the gaps. (2) Intent clustering agent:\n  groups all inferred agent questions into themes to surface recurring capability demands — what the market is looking\n  for before any sales call or user interview. Output: a dashboard for PMs showing what's well-covered, what's\n  missing, and what roadmap signals are emerging from agent traffic patterns. Built in N8N using real websites\n  (redacted for demo). Business model: free answerability assessment to start, paid tiers for continuous monitoring\n  and intent clustering. Roadmap: \"publish the fix\" (auto-draft site copy to close gaps), agent signal to Jira (push\n  emerging roadmap themes directly into project tracking), expansion beyond SaaS.", "builder_name": "Andrew Holt", "builder_linkedin": "https://www.linkedin.com/in/ajh206/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785414690754.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=5eI0E%2BJPHErtv8ci6%2F72MhS%2FMPvFYsPdMCn9kIwDsLY%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785414691338.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ZXOSTJCZ2prbT1ORwgC9UjPRoAArkur8TGcydaRlKhc%3D", "video_link": null, "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "99e6b75c-360d-4950-8f01-38d6295e1b10", "project_id": "bceacddb-11e0-45d7-93d0-fa9048d343f4", "section": "awards", "rank": 999, "award_name": "Most Innovative Use of AI", "cohort_label": null}, {"id": "975fd177-374c-4062-8d67-622a66c6d900", "project_id": "bceacddb-11e0-45d7-93d0-fa9048d343f4", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "8dc055bc-d529-4c93-9a93-a3db351e00f9", "title": "AdvisorPulse", "description": "Shruti, a PM at Fidelity Investments in the custom SMA (Separately Managed Accounts) space, built AdvisorPulse to\n  help product teams prioritize unstructured advisor feedback by AUM-weighted business impact. The problem: wealth\n  management teams receive high-volume advisor feedback via email with no automatic severity or business-impact\n  tagging; high-AUM advisors jumping to competitors goes undetected. The solution integrates with Gmail (runs every 30\n  seconds in prototype), routes emails through three specialized agents (effort, severity, improvement), applies a\n  hybrid rubric — deterministic AUM weighting plus AI-driven semantic analysis for edge cases where a low-AUM advisor\n  has a critical issue — and surfaces a prioritized dashboard. Human approval is required before any action; feedback\n  edits are captured in Supabase and fed forward. Evaluation: 60–70% accuracy on a golden eval set. Pricing: $32K/year\n  starter. Next: Jira integration, LLM-as-judge evals, and multi-team routing so stories auto-create in the right\n  team's board.", "builder_name": "Shruti Chowdhary", "builder_linkedin": "https://www.linkedin.com/in/shrutichowdhary93/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785414277702.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=psLlYKzedUyLdQMdP8U1bCB30oLfivxQVOWtxlxxvl4%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785414278333.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=qaJ943fbHmcv17jmi6zWB4z7qFvvjwmX0SBwTBSKgZg%3D", "video_link": "https://drive.google.com/file/d/1LPObk_geDW6lPFF1lIuvWOv7ub_KePPk/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1N1Z2WFSiE4UbZE9j68TRwkGGsNRYlqUkwICvOBeXSrc/edit?slide=id.p6#slide=id.p6", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "ab75af84-e95b-4894-bff6-febc0e0eb315", "project_id": "8dc055bc-d529-4c93-9a93-a3db351e00f9", "section": "awards", "rank": 999, "award_name": "Best Vertical AI Application", "cohort_label": null}, {"id": "f4c2b39d-ffb2-4208-a558-6e77fd541360", "project_id": "8dc055bc-d529-4c93-9a93-a3db351e00f9", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "d5f0405a-a58f-4444-8d09-c276d5185b55", "title": "AI - Tool Recommendation Agent", "description": "Shikha built an AI Tool Recommendation Agent that automates vendor database selection for cloud engineers, system\n  architects, and startup product owners — replacing days of manual comparison spreadsheets. The n8n pipeline has five\n  stages: a safety/scope guardrail agent that blocks off-topic or malicious queries; a requirements extractor that\n  parses engineering constraints (budget cap, self-hosting preference, EU residency) into structured JSON; a live\n  vendor database grounded in Google Sheets (eliminating hallucination); a custom JavaScript ranking engine that\n  applies hard filters and normalizes signals like GitHub stars; and a memo generator that produces a professional\n  architecture decision memo with a comparison table (pros/cons, pricing, doc links for each vendor). A memory node\n  records the conversation for follow-up queries. Next: replace the static Google Sheets with live web search to track\n  real-time market data.\n \n --\n \n Shikha built her tool for cloud engineers, system architects, and startup product owners who need to pick a database\n  vendor but face a maze of messy documentation, fluctuating pricing tiers, compliance requirements (SOC, EU\n  residency, etc.), and tight budgets. Most teams end up guessing or trusting sales pitches, then spending days on\n  manual comparison spreadsheets. Her N8N agent eliminates that: it extracts the user's hard constraints from a chat\n  conversation, fetches live vendor records from Google Sheets (ground truth, no hallucination), and feeds both into a\n  custom JavaScript scoring engine — not subjective AI ranking, but mathematical hard-filter → normalize → rank\n  logic. The output is a professional Markdown architecture decision memo delivered in seconds: top 3 ranked vendors,\n  one strength and one weakness each, clickable documentation links, comparison table. Safety layer at the front: a\n  guardrail model rejects off-topic or malicious inputs instantly, saving cost and preventing drift. Memory layer at\n  the back: conversation stored for follow-ups. Key design insight: \"deterministic trust over AI bias\" — the ranking\n  logic is an explicit algorithm, not model inference, which means no hallucinated vendor specs can contaminate the\n  decision. Demo: recipe query → blocked. Complex query (\"vector DB, 10M chunks, <$500/month, SOC compliance, no\n  self-hosting\") → top 3 with full comparison. Business model: tiered SaaS (free/pro/team/enterprise) + affiliate\n  revenue + API licensing + enterprise consulting. Market: AI agent sector at $12B, growing 45% CAGR. Key metrics:\n  recommendation acceptance rate, accuracy score, time to recommendation, vendor match success rate. Next step:\n  replace static Google Sheets with real-time web search for live pricing and spec data.", "builder_name": "Shikha Rudra", "builder_linkedin": "https://www.linkedin.com/in/shikha-rudra-91696665/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785413772154.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=HoD2g%2FVLj8KxWPSqcV78gdUjCh0d6AjdiaIkmG2EW3o%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785413772660.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=ihPwKFYZCyxUB%2BqGOcTjWux%2FMk%2Fd5IHvxeItEiskJco%3D", "video_link": "https://drive.google.com/file/d/1yESzMZV9NYtEAyvkfaXWgFGdipH7t8sy/view?usp=drive_link", "workflow_link": null, "doc_link": null, "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "b53eeab6-8d23-416b-b343-d2e52a083e0d", "project_id": "d5f0405a-a58f-4444-8d09-c276d5185b55", "section": "awards", "rank": 999, "award_name": "Best Structured AI Pipeline Design", "cohort_label": null}, {"id": "8162b2ce-3656-4558-97d4-dc7c16cf0e7b", "project_id": "d5f0405a-a58f-4444-8d09-c276d5185b55", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "154fc153-5ba8-474a-a738-9c5291f790f2", "title": "MadhuMitra", "description": "\"Sriganesh, a TPM at TransUnion who personally reversed his diabetes from 7.3 to 5.8 HbA1c using a coached program,\n  built MadhuMitra to cut coaches' daily patient review time from 2 hours to ~20 minutes. The system uses a two-engine\n  architecture: a rule engine handles straightforward cases first, then complex cases go to an LLM reasoning engine\n  with protocol thresholds, followed by a verification agent for guardrails. Output is a ranked priority dashboard for\n  the coach (urgent / medium / on-track). A human-in-loop feedback layer lets coaches flag incorrect severity\n  ratings, which are stored in Supabase and fed back to the LLM to improve over time. Evaluation showed 100% recall\n  versus 67% for a naked LLM on the same cases. Pricing: $3,000–$5,000 per coach per month. Next step: pilot with the\n  clinic he uses, then expand to thyroid, weight, and hormone programs.\n \n --\n \n Sriganesh is a technical product manager at TransUnion based in Chennai. He built MadhuMitra (also called\n  \"\"Modumitra\"\" in the transcript) from lived experience: he reversed his own diabetes from HbA1c 7.3 to 5.8 working\n  with a doctor and wellness coach. He learned that the coach spends 2 hours per day reviewing all patient logs to\n  figure out who needs attention that day — and he wanted to compress that to 20 minutes. MadhuMitra delivers the\n  coach a prioritized ranked list of patients every morning, so they know immediately who to contact and why, without\n  reading every log entry manually. Architecture: two-tier processing — a rules engine handles the first pass (tagging\n  cases as urgent/medium/low without needing LLM inference), and only complex cases go to the LLM reasoning engine\n  (which has protocol thresholds and clinical guardrails). A verification agent validates every LLM output before it\n  surfaces on the dashboard. Coach provides feedback on each case (correct/incorrect priority, severity too high/low)\n  which is logged to Supabase and fed back to improve the LLM. Demo: morning brief dashboard showing urgency tiers,\n  patient profiles with behavioral signals that triggered the classification, exact WhatsApp/Telegram text used by the\n  LLM, and coach feedback loop. Evaluation result: MadhuMitra achieved 100% recall vs. a naked LLM at 67% case\n  detection. Pricing: $3,000–$5,000 per coach per month at MVP stage with one target clinic. Expansion path: other\n  programs (thyroid, weight, hormonal) at the same clinic, then other clinics, eventually other health conditions.\"", "builder_name": "Sriganesh Venugopal", "builder_linkedin": "https://www.linkedin.com/in/sriganeshvenugopal/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785413413638.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=M%2Fxu7hvq0hvBo8hjnnVo6ARVmPz0O6fWUxwNfWp%2F2es%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785413414258.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=7970SQ3XCx1Kk3f2S%2BR8MhcraYqnCiz8xTrCJ7xzqJE%3D", "video_link": "https://drive.google.com/file/d/1ICyU7ob-7k_LkIPrffFH39b66drZfqdp/view?usp=drive_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1UG64GePCBJgMxRU4_JeAUBoOOcUB9xYE/edit?usp=drive_link&ouid=100498596811565514255&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "fb638a26-da88-45cc-8fa8-a2455d203720", "project_id": "154fc153-5ba8-474a-a738-9c5291f790f2", "section": "awards", "rank": 999, "award_name": "Technical Depth Award", "cohort_label": null}, {"id": "0b77b412-cd62-4d93-8530-3cef1756611d", "project_id": "154fc153-5ba8-474a-a738-9c5291f790f2", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "29017e5a-c4dd-4144-a01e-668ab46aa6c1", "title": "Gita Simplified", "description": "\"Neha built Gita Simplified out of lived experience: arriving in the US, isolated and unable to reach family 10.5\n  time zones away, she found solace in a Bhagavad Gita quote on Instagram. She began posting one Gita verse per day\n  and grew 70,000 organic followers. She validated the gap with mental health professionals, launched Gita Wellness\n  LLC, and sold physical products (bookmarks, calendars, notepads) at fairs to collect early feedback — all before\n  writing a line of code. The product is an AI mental wellbeing app grounded in all 700 verses of the Bhagavad Gita,\n  tagged by emotional theme (feeling purposeless, anger, relationship struggles, attachment issues). Target user:\n  South Asian immigrants in unfamiliar cities — 75 million people growing at 4.2%, highly represented in high-skilled\n  jobs, deeply underrepresented in mental health access. Architecture: Azure AI Foundry agent with the full Gita\n  knowledge base, plus an emotional mood tracker that detects the user's feeling and surfaces the most relevant verse.\n  Safety guardrails: crisis detection routes to a helpline before offering a verse; jailbreak attempts and\n  out-of-scope questions (e.g. news topics) are declined gracefully. Demo was narrated via voice-over due to\n  screen-share audio issues.\"", "builder_name": "Neha Shrivastav", "builder_linkedin": "https://www.linkedin.com/in/neha-shrivastav-93717b6a/", "thumbnail_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/thumbnails/1785412329102.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=7mJuamJz1a563pirVlBngt3AZlj7xKRo7P8H5KsyHkc%3D", "banner_url": null, "user_image_url": "https://cohortstorageblob.blob.core.windows.net/project-thumbnails/user-images/1785412330157.jpg?sv=2026-06-06&spr=https&se=2076-01-01T00%3A00%3A00Z&sr=b&sp=r&sig=qaZf7JrQiM5jidOgsBZYwP5kTXBQ1lGzx0B%2F3ewKCjw%3D", "video_link": "https://drive.google.com/file/d/1Yx_fcSnPQTt17GSOtTBjgfWB7f4gYz_7/view?usp=share_link", "workflow_link": null, "doc_link": "https://docs.google.com/presentation/d/1rIhOT2ELBSgp3vRAJj-PrboksghwA0dn/edit?usp=share_link&ouid=106731800049526633293&rtpof=true&sd=true", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "9c5b6a6f-f4d2-4c1a-afb0-b4e957b5e09f", "project_id": "29017e5a-c4dd-4144-a01e-668ab46aa6c1", "section": "awards", "rank": 999, "award_name": "Best Impact Product Award", "cohort_label": null}, {"id": "3ddce8e4-04ff-4aa6-85b2-9decb8351de4", "project_id": "29017e5a-c4dd-4144-a01e-668ab46aa6c1", "section": "cohort9", "rank": 999, "award_name": null, "cohort_label": "Cohort 9"}]}, {"id": "a978f882-cb18-4396-94cc-0c5aa7823e4a", "title": "Nestive", "description": "Nestive is an AI-powered weekly coaching companion for parents of gifted children. Each week, parents get a personalized plan with one cognitive challenge, one emotional coaching script, and one reflection prompt. Plans are grounded in real research from leading gifted education organizations (NAGC, Davidson Institute, UConn Gifted, Hoagies' Gifted, TAGT, SENG, Mensa for Kids) using a RAG pipeline around 10,000 indexed chunks. Parents give simple feedback each week, and the next plan adapts to what worked, what was skipped, and what didn't land.", "builder_name": "Samrudhdi Suresh", "builder_linkedin": "https://www.linkedin.com/in/samrudhdi", "thumbnail_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/thumbnails/1775932311386.jpg", "banner_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-assets/banners/1776123938173.jpg", "user_image_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/user-images/1775932312528.jpg", "video_link": "https://drive.google.com/file/d/13cahZ0IzOKMCC7gMVKUNq_Lvrnm3qGNn/view?usp=drive_link", "workflow_link": "https://drive.google.com/file/d/1ikEIU-p5wYTySOb2ogM1Ac4M12e5PaHK/view?usp=drive_link", "doc_link": "https://drive.google.com/file/d/1ikEIU-p5wYTySOb2ogM1Ac4M12e5PaHK/view?usp=drive_link", "hosted_link": "https://v0-nestive.vercel.app/", "project_category": "Product", "what_you_learned": "Building Nestive taught me four things that reshaped how I think about AI products.\n\nFirst, RAG alone is too academic and an LLM alone is too generic. The value sits in the seam between them, where research philosophy gets translated into something a tired parent can actually use on a Tuesday night.\n\nSecond, explainability is not a feature you bolt on. Every recommendation in Nestive cites the source it came from, because trust in a parenting product has to be earned every single week.\n\nThird, closed-loop feedback beats free-text interpretation for an MVP. Three structured signals (worked, skipped, didn't land) are enough to adapt the next plan without pretending the model understands nuance it doesn't.\n\nFourth, precision matters more than recall when you're only recommending three things. One miss erodes a week of trust.", "about_user_description": "Product leader with 15+ years building and scaling B2B SaaS, consumer, and AI-native products. Currently building Nestive, an agentic AI product from 0 to 1, hands-on with LLMs, RAG, and prompt engineering through production deployment. Background spans $150M+ enterprise accounts, 50%+ revenue growth, and a consumer mobile launch with 500K+ organic downloads.", "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "db45f832-44c0-4b45-9914-3115a3f578a8", "project_id": "a978f882-cb18-4396-94cc-0c5aa7823e4a", "section": "top10", "rank": 5, "award_name": null, "cohort_label": null}, {"id": "1cb3c91c-f918-499c-ba39-5b52c2bf7600", "project_id": "a978f882-cb18-4396-94cc-0c5aa7823e4a", "section": "cohort8", "rank": 999, "award_name": null, "cohort_label": "Cohort 8"}]}, {"id": "763d7edb-b2ad-42ae-be74-32d00646b7f3", "title": "DisputeAI", "description": "\"DisputeAI is a multi-agent conversational assistant that can streamline & automate the process of intaking the cards disputes through systematic fact gethering and required document collection", "builder_name": "Ravi Appana", "builder_linkedin": null, "thumbnail_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/thumbnails/1775741552006.jpg", "banner_url": null, "user_image_url": null, "video_link": "https://v0.app/chat/fintech-dispute-app-f0jbKy9Gxvt?ref=EX30PU\"", "workflow_link": "https://youtu.be/IgPV9loVwyo", "doc_link": "N8N: https://drive.google.com/file/d/1lvHyL2-_F9JwaHqIaCVM22BEEiCfWko0/view?usp=sharing", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "972c48cb-8607-4a94-bbe2-a77afd1dcccd", "project_id": "763d7edb-b2ad-42ae-be74-32d00646b7f3", "section": "cohort8", "rank": 999, "award_name": null, "cohor 7bb-846a-7f27f4f44490", "project_id": "e70c6a42-8ece-4b5e-af62-91cba4647215", "section": "cohort8", "rank": 999, "award_name": null, "cohort_label": "Cohort 8"}]}, {"id": "e6ea06a7-0831-46be-9f04-96075c6d470a", "title": "AccIQ", "description": "96% of websites fail basic accessibility standards. When violations are found, PMs can't interpret the results, developers receive vague bug reports with no code context, and legal exposure grows every year — 4,605 ADA web lawsuits were filed in 2023 alone, up 41% year over year.\nAccIQ closes that gap. Enter any public URL, and AccIQ runs a full WCAG 2.2 scan against 54 criteria, classifies every violation by severity, and uses Claude AI to explain each issue in plain language — then generates code fixes for developers. Results in under 60 seconds. No account required.\n────────────────────────────────────\nDual-mode interface built for two audiences\n•\tPM View — Plain-language descriptions, conformance level badge, one-click Linear bug logging, PDF compliance report export\n•\tDeveloper View — Failing HTML snippets, AI-generated code fixes, copy to clipboard, Excel export with VPAT columns\n\n────────────────────────────────────\n\nKey outcomes\n•\tFull end-to-end scan pipeline live in production\n•\tAI enrichment pipeline with confidence scoring and fallback handling\n•\tScan data persisted to Supabase for usage analytics\n•\tStructured Linear bugs pre-filled with WCAG criterion, severity, failing code, and AI-suggested fix\n\n────────────────────────────────────\nRevenue model (Potentially)\nAccIQ is designed around five distinct revenue streams:\n1. SaaS subscriptions — website owners and development teams\nFree tier (3 scans/month) drives adoption. Pro tier targets development teams and product managers who need unlimited scans and audit-ready exports - catching violations before production, where fixing them costs 10–100× less than post-launch.\n2. Legal firm partnerships — lead generation\nLaw firms specializing in ADA and WCAG litigation can license AccIQ as a prospecting tool to identify non-compliant sites at scale. AccIQ generates structured violation reports with WCAG criterion references and severity classifications - the evidence needed to initiate a pre-litigation demand.\n3. Settlement referral fees\nWhere AccIQ identifies a site with material WCAG violations and the site owner is subsequently found legally liable, AccIQ participates in a referral percentage of any settlement or remediation contract facilitated through its legal firm network.\n4. Remediation marketplace\nSite owners with scan results are connected with vetted accessibility consultants and developers who can fix the violations -  turning the scan report into the top of a remediation funnel, with AccIQ taking a transaction fee or referral commission.\n5. Enterprise compliance reporting\nLarge organizations in financial services, healthcare, and government contracting are subject to mandatory WCAG and Section 508 compliance requirements. AccIQ offers scheduled bulk scanning, VPAT generation, and audit trail reporting as an enterprise tier on annual contracts.", "builder_name": "Corey Brew", "builder_linkedin": "https://www.linkedin.com/in/coreybrew/", "thumbnail_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/thumbnails/1775051205370.jpg", "banner_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-assets/banners/1775934792144.jpg", "user_image_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/user-images/1775653183166.jpg", "video_link": "https://drive.google.com/file/d/17QDgJt32AuXqbFyfDxMA_u3Z4m2ZpLB9/view?usp=sharing", "workflow_link": "https://drive.google.com/drive/folders/1BI7R3XypAE0SVWxlDJon7l-f1c-Hd2W6?usp=drive_link", "doc_link": "https://docs.google.com/presentation/d/1KhlXmziBDTqSP94xbSumOTxD8yA7PSAF/edit?usp=sharing&ouid=100575784961720591528&rtpof=true&sd=true", "hosted_link": ions": [{"id": "19895c44-fe3a-4e15-97ee-b8b0493a4cc1", "project_id": "ea6069df-083b-46b1-8408-71ac81a35859", "section": "awards", "rank": 999, "award_name": "Best Problem Solution Fit", "cohort_label": null}, {"id": "aa91b5fd-2e45-4509-9479-40d8560df814", "project_id": "ea6069df-083b-46b1-8408-71ac81a35859", "section": "cohort8", "rank": 999, "award_name": null, "cohort_label": "Cohort 8"}]}, {"id": "de881f4f-c47e-4581-9b2f-36ea64d80fc3", "title": "ToTor AI", "description": "This product is an AI-powered course design platform built specifically for higher education. It prioritizes pedagogical integrity over simple content generation by acting as a collaborative architect for professors.\n\nThe product is designed to keep the professor in control. It automates the heavy lifting of curriculum structuring while ensuring that the final course remains academically sound and personally tailored to the educator's unique teaching style.", "builder_name": "Rachel Lacroix", "builder_linkedin": "https://www.linkedin.com/in/lacroixrachel/", "thumbnail_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/thumbnails/1775044069582.jpg", "banner_url": null, "user_image_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/user-images/1775653312858.jpg", "video_link": "https://youtu.be/chH0GeMwv4A?si=XCrbhzu9LuMpdWtP", "workflow_link": null, "doc_link": "https://www.figma.com/deck/rka52L0L7V0gzHwhtsfb9C", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": null, "about_user_description": null, "whats_included": [], "visibility_flags": {"banner": true, "doc_link": true, "demo_link": true, "about_user": true, "user_image": true, "video_link": true, "description": true, "whats_included": true, "what_you_learned": true}, "sections": [{"id": "2e171b5a-334e-4db7-a3b8-df3211534284", "project_id": "de881f4f-c47e-4581-9b2f-36ea64d80fc3", "section": "cohort8", "rank": 999, "award_name": null, "cohort_label": "Cohort 8"}]}, {"id": "3a9b1a86-8011-4eed-8c5a-a98e9039cf8a", "title": "Decidr AI", "description": "An agentic decision intelligence platform that transforms CRM and campaign data into clear, actionable strategies - helping growth, marketing, and performance teams identify their best customers, fix underperforming campaigns, and optimise the entire customer journey with confidence.\n\nHere's how it works: \n- It sits on top of your existing tools \nCurrent marketing stack: \nCDP (Segment) → Data analysis (Amplitude) → Execution (Salesforce)\nWhere Decidr AI fits: \nCDP (Segment) → Data analysis (Amplitude) →Decision intelligence layer (Decidr AI)→Execution (Salesforce)\n- Analyzes performance data in real time\n- Identifies why something is working or not working\n- Detects gaps across campaigns, audience targeting, and user journeys\n- Recommends clear, actionable next steps\n\nWhat problem is it looking to solve? \n\nLack of clarity and speed of decision-making, even with availability of data. \n\nThe core problem:\n- Data is scattered across tools\n- Insights take too long to extract\n- Teams don’t know what action to take in the moment\n\nWhat this leads to:\n- Underperforming campaigns running longer than they should\n- Missed audience targeting opportunities\n- Drop-offs in the funnel going unnoticed\n- Lost leads and revenue\n\nWho it's useful for\n\n- Growth & performance teams running campaigns and optimizing funnels - who need faster decisions to improve ROI\n- B2B SaaS Marketers managing multi-touch journeys who need clarity on drop-offs and engagement\n- D2C / E-commerce Brands with high-volume campaigns\nwho need need quick iteration on targeting and messaging\n- Marketing agencies who are managing multiple clients and need scalable, fast analysis\n- Early-stage startups who have limited resources, high growth pressure and need smarter decisions without big teams\n\nIf you or your team relies on data to drive growth, this is for you.\n\nHow Decidr AI stands against other products in the market\n\n1. GoMarble AI\n- Focus: Ad analysis & reporting\n- Scope: Campaign-level insights\n- Output: Insights & reports\n- Data: Cross-platform ad data\n- Workflow: Ask → analyze → get insights\n- Impact: Tactical\n\n2. Flable AI\n- Focus: Ad optimization & profitability\n- Scope: Campaign-level execution\n- Output: Optimization actions\n- Data: Ads, cost & logistics data\n- Workflow: AI suggests → you approve\n- Impact: Tactical\n\n3. Decidr AI\n- Focus: Decision intelligence across funnel\n- Scope: End-to-end user journey\n- Output: Clear decisions & next steps\n- Data: Campaign + audience + journey signals\n- Workflow: AI detects → explains → recommends\n- Impact: Strategic + tactical\n\nExplore the platform using the links below - \n\nV0 (UX interface)- https://v0.app/chat/data-analysis-frontend-urqQKz64YWu \n\nn8n workflow - https://prachik07.app.n8n.cloud/workflow/ThgF1IWU5CNxICMo", "builder_name": "Prachi Singh", "builder_linkedin": "https://www.linkedin.com/in/prachi-singh1996", "thumbnail_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/thumbnails/1774987995449.jpg", "banner_url": null, "user_image_url": "https://fzsvkvizhcvarbgzifud.supabase.co/storage/v1/object/public/project-thumbnails/user-images/1775653333647.jpg", "video_link": "https://drive.google.com/file/d/1-XIEn4P-9Gr-y7LL0RSbHre0WTjsGSz5/view?usp=sharing", "workflow_link": "https://app.diagrams.net/#G19SgF0R91LjfjHj4Nqe03imHo-Rq3apYD#%7B%22pageId%22%3A%22VHSneqtpBdU0WTzxjnVF%22%7D", "doc_link": "https://gamma.app/docs/Decidr-AI-9bvkww0mp0awf63", "hosted_link": null, "project_category": "AI Tools", "what_you_learned": "Key takeaways: \n\n- Agentic AI enables real-time decision intelligence\nMoving beyond passive insights to systems that actively guide what to do next\n- Marketing needs signal-driven reasoning, not just dashboards\nTrue value comes from connecting campaign, audience, and journey signals\n- Evaluation improves AI reliability\nContinuous feedback loops make recommendations more accurate over time\n- Explainability builds trust and adoption\nClear why behind every recommendation increases confidence in decisions\n- Multi-agent orchestration improves decision quality\nBreaking problems into specialized agents leads to better reasoning and outputs\n- Structured data persistence enables learning systems\nCapturing past decisions and outcomes creates compounding intelligence\n- Journey-level intelligence drives the most value\nReal impact comes from understanding the full funnel not just campaigns\n\nSkills gained: \n\n- Designing agentic AI workflows using multi-agent orchestration in n8n\n- Building interactive UI experiences using v0\n- Connecting frontend and backend workflows\n- Implementing evaluation-driven AI systems for better decision accuracy\n- Designing decision-intelligence products, not just analytics tools\n- Developing a product roadmap focused on real user pain, not just features\n- Writing and iterating on updating PRDs with clear guidelines on every aspect of the product\n\nCore learnings: \n\n- Updating system prompt is one of the starting point of improving accuracy of the agents\n- Narrowing the business focus is required to solve any problem with an agentic solution\n- Data ≠ decision intelligence: Value comes from turning fragmented data into clear, actionable decisions\n- Generic LLMs aren’t enough: Real impact requires context, signal connection, and action-oriented outputs\n- Explainability is non-negotiable:  Transparent reasoning builds trust and drives adoption\n- Learning loops create advantage: Capturing decisions, outcomes, and feedback enables continuous improvement\n- Journey Intelligence > Campaign Intelligence: True insights come from understanding the full user journey, not just ads", "about_user_description": null, "whats_included": ["Cross-channel signal intelligence", "Structured insight extraction", "n8n-powered     aboutBlocks.forEach(function (b) { rowsSrc.push([nice(b.title), b.nodes, nice(b.title), 'about']); });
    ['problem', 'solution', 'audience'].forEach(function (k) {
      var bs = D.blocks.filter(function (b) { return b.kind === k; });
      if (bs.length) rowsSrc.push([{ problem: 'The problem', solution: 'The solution', audience: 'Who it\'s for' }[k], [].concat.apply([], bs.map(function (b) { return b.nodes; })), nice(bs[0].title), k]);
    });
    var moreBlocks = D.blocks.filter(function (b) { return b.kind === 'more'; });
    var rowsHTML = rowsSrc.map(function (r) { return rowHTML(r[0], r[1], false, r[2], r[3]); }).filter(Boolean);
    var has = { demo: !!vid, product: rowsHTML.length || moreBlocks.length, how: how.length || live || doc || wf || incl.length, learn: learned.length, request: !!li && flags.demo_request !== false };

    /* ---- nav ---- */
    H.push('<nav class="sn" data-screen-label="Nav"><div class="sn-w sn-in"><a href="/" class="sn-logo"><span>MYAI</span><span>Community</span></a>' +
      '<div class="sn-links"><a href="/">HOME</a></div>' +
      '<div class="sn-cta"><a class="nb nb-ghost" href="/project-login">PROJECT LOGIN</a><a class="nb nb-dark" href="/cohort-admin">ADMIN LOGIN</a></div></div></nav>' +
      '<div class="wrap">');

    /* ---- hero: see the product ---- */
    // max 2 buttons: primary = Watch the demo (else Open live project); secondary = Request a demo (else Open live project)
    var bWatch = has.demo ? '#demo|' + PLAY.replace('#09090b', 'currentColor').replace('width="22" height="22"', 'width="16" height="16"') + 'Watch the demo|' : '';
    var bLive = live ? esc(live) + '|Open live project|ext' : '';
    var bReq = has.request ? '#request|' + ico('calendar', 16) + 'Request a demo|' : '';
    var picks = [bWatch || bLive, bReq || (bWatch ? bLive : '')].filter(Boolean).slice(0, 2);
    var ctas = picks.map(function (b, k) { var p = b.split('|'); return '<a class="nb lg ' + (k ? 'nb-ghost' : 'nb-dark') + '" href="' + p[0] + '"' + (p[2] === 'ext' ? ' target="_blank" rel="noopener"' : '') + '>' + p[1] + '</a>'; });
    var up = +p.thumbs_up || 0, down = +p.thumbs_down || 0;
    var myVote = window.MY_VOTE === 'up' || window.MY_VOTE === 'down' ? window.MY_VOTE : '';
    var chips = [[cat, 'tag'], [awardLabel ? cohort : '', 'users'], [vid ? 'Demo video' : '', 'play'], [live ? 'Live project' : '', 'globe']].filter(function (c) { return c[0]; }).slice(0, 3).map(function (c) { return '<div class="chip"' + '' + '><span class="tick">' + ico(c[1], 11) + '</span>' + esc(c[0]) + '</div>'; }).join('');
    var acard = top10 ? '<div class="k">Top 10 project</div><div class="v">' + (top10.rank && top10.rank < 999 ? '#' + top10.rank : 'Top 10') + '</div><div class="s">' + esc(award ? award.award_name : cohort) + '</div>'
      : award ? '<div class="k">Award</div><div class="v sm">' + esc(award.award_name) + '</div><div class="s">' + esc(cohort) + '</div>'
      : cohort ? '<div class="k">MyAI Community</div><div class="v">' + esc(cohort) + '</div>' : '';
    H.push('<header class="hero" data-screen-label="Hero"><div>' +
      '<div class="eyebrow"><span class="dot"></span><span>' + esc([awardLabel || cohort, 'MyAI Community'].filter(Boolean).join(' · ')) + '</span></div>' +
      '<h1' + (name.length > 22 ? ' class="long"' : '') + '>' + esc(name) + '</h1>' +
      (lede ? '<p class="lede">' + esc(lede) + '</p>' : '') +
      (ctas.length ? '<div class="ctas">' + ctas.join('') + '</div>' : '') +
      '</div><div class="visual">' +
      (thumb ? '<div class="shot"><img class="bg" src="' + esc(thumb) + '" alt=""><img class="img" src="' + esc(thumb) + '" alt="' + esc(name) + '"></div>'
             : '<div class="shot cover"><span class="m">' + esc(name.charAt(0).toUpperCase()) + '</span><b>' + esc(name) + '</b></div>') +
      (chips ? '<div class="chips">' + chips + '</div>' : '') +
      (builder ? '<div class="fcard"><div class="h">Built by</div><div class="who">' + avatar('av') + '<span>' + esc(builder) + '</span></div></div>' : '') +
      (acard ? '<div class="acard">' + acard + '</div>' : '') +
      '</div></header>');

    /* ---- product: the description, in Primer feature rows ---- */
    if (has.product) {
      H.push('<section class="sec" id="product" data-screen-label="Product"><div class="center"><span class="tag-o">// The product //</span><h2>' + (longName ? 'What it does' : 'What ' + esc(name) + ' does') + '</h2></div>' +
        rowsSrc.map(function (r) { return rowHTML(r[0], r[1], false, r[2], r[3]); }).filter(Boolean).map(function (h, i) { return i % 2 ? h.replace(/^<div class="row"><div>/, '<div class="row"><div class="flip">') : h; }).join('') +
        // extra parts of the description, styled like the "What's included" card:
        // title row, then a checklist; short question/label lines become sub-heads
        moreBlocks.map(function (b, bi) {
          var out = [], items = [];
          var flush = function () { if (items.length) { out.push('<ul>' + items.join('') + '</ul>'); items = []; } };
          b.nodes.forEach(function (n) {
            if (n.t === 'ul') { n.items.forEach(function (x) { items.push('<li><span>' + (x.title ? '<b>' + esc(x.title) + '</b> ' : '') + linkify(x.text) + '</span></li>'); }); return; }
            // a wrapped line that continues the bullet above ("who need quick iteration…")
            if (n.t === 'p' && items.length && /^[a-z]/.test(n.text)) { items[items.length - 1] = items[items.length - 1].replace('</span></li>', ' ' + linkify(n.text) + '</span></li>'); return; }
            flush();
            if (n.t === 'flow') out.push(flowHTML(n.steps));
            else if (n.text.length <= 70 && /^[A-Z0-9]/.test(n.text) && !/[.!]$/.test(n.text)) out.push('<div class="sub">' + esc(n.text.replace(/\s*[:\-–—]\s*$/, '')) + '</div>');
            else out.push('<p class="ip">' + pHTML(n.text) + '</p>');
          });
          flush();
          return '<div class="incl"><div class="t">' + tile(iconFor(b.title, 'file'), bi + 2, 16) + esc(nice(b.title)) + '</div>' + out.join('') + '</div>';
        }).join('') + '</section>');
    }

    /* ---- how it's built ---- */
    if (has.how) {
      var steps = [], notes = [];
      how.forEach(function (b) { b.nodes.forEach(function (n) {
        if (n.t === 'flow') n.steps.forEach(function (s) { steps.push({ title: '', text: s }); });
        else if (n.t === 'ul') n.items.forEach(function (x) { steps.push(x); });
        else notes.push(n.text);
      }); });
      steps = steps.slice(0, 6);
      var R = [];
      if (wf) R.push(['Workflow', host(wf), wf, 'flow']);
      if (doc) R.push(['Documentation', host(doc), doc, 'file']);
      if (live) R.push(['Open live project', host(live), live, 'globe']);
      H.push('<section class="sec" id="architecture" data-screen-label="How it\'s built"><span class="tag-o">// How it\'s built //</span><h2>' +
        (steps.length >= 2 ? ['', '', 'Two', 'Three', 'Four', 'Five', 'Six'][steps.length] + ' steps, one product' : 'How it\'s built') + '</h2>' +
        (steps.length ? '<div class="strip">' + steps.map(function (s, i) {
          var t = s.title || s.text, body = s.title ? s.text : '';
          return '<div><div class="k">' + tile(iconFor(t + ' ' + body, 'flow'), i + 1, 15) + String(i + 1).padStart(2, '0') + ' · Step</div><div class="t' + (t.length > 36 ? ' sm' : '') + '">' + esc(t) + '</div>' + (body ? '<p>' + linkify(body) + '</p>' : '') + '</div>';
        }).join('') + '</div>' : '') +
        (notes.length ? '<div class="incl" style="margin-top:24px">' + notes.map(function (t) { return '<p style="margin:0 0 8px;font-size:15px;line-height:1.6;color:#52525b">' + pHTML(t) + '</p>'; }).join('') + '</div>' : '') +
        (R.length ? '<div class="res">' + R.map(function (r) { return '<a class="rcard" href="' + esc(r[2]) + '" target="_blank" rel="noopener">' + tile(r[3], R.indexOf(r) + 1) + '<div style="flex:1;min-width:0"><div class="t">' + esc(r[0]) + '</div><div class="s">' + esc(r[1]) + '</div></div>' + ARROW + '</a>'; }).join('') + '</div>' : '') +
        (incl.length ? '<div class="incl"><div class="t">' + tile('box', 2, 16) + 'What\'s included</div><ul>' + incl.map(function (x) { return '<li><span>' + linkify(x) + '</span></li>'; }).join('') + '</ul></div>' : '') +
        '</section>');
    }

    /* ---- demo: watch it ---- */
    if (has.demo) {
      var art = thumb ? '<img class="bg" src="' + esc(thumb) + '" alt=""><img class="img" src="' + esc(thumb) + '" alt="">' : '';
      H.push('<section class="sec" id="demo" data-screen-label="Demo" ><span class="tag-o">// Demo //</span><h2>' + (longName ? 'See it in action' : 'See ' + esc(name) + ' in action') + '</h2>' +
        '<div class="player" id="player">' +
        (vid.src ? '<button class="poster" type="button" data-src="' + esc(vid.src) + '" aria-label="Play demo video">' + art + '<span class="play">' + PLAY + '</span><span class="cap">Play the demo · ' + esc(vid.label) + '</span></button>'
                 : '<a class="poster" href="' + esc(vid.url) + '" target="_blank" rel="noopener">' + art + '<span class="play">' + PLAY + '</span><span class="cap">Watch the demo · opens on ' + esc(vid.label) + '</span></a>') +
        (awardLabel ? '<span class="pbadge">' + ico('award', 14) + esc(awardLabel) + '</span>' : '') + '</div>' + '</section>');
    }

    /* ---- rate this project: like / dislike ---- */
    if (flags.rating !== false) {
      H.push('<section class="sec" id="rate" data-screen-label="Rate this project"><div class="rate">' +
        '<div><span class="tag-a">' + ico('star', 13) + 'Rate this project</span><h3>' + (longName ? 'Was this project useful?' : 'Was ' + esc(name) + ' useful?') + '</h3>' +
        '</div>' +
        '<div class="btns">' +
        '<button type="button" class="vb" data-vote="up" aria-pressed="' + (myVote === 'up') + '">' + ico('thumbup', 18) + '<span>Like</span><b>' + up + '</b></button>' +
        '<button type="button" class="vb" data-vote="down" aria-pressed="' + (myVote === 'down') + '">' + ico('thumbdown', 18) + '<span>Dislike</span><b>' + down + '</b></button>' +
        '</div><p class="note" data-note>' + '' + '</p></div></section>');
    }

    /* ---- what you'll learn (Primer "What we learned") ---- */
    if (has.learn) {
      H.push('<section class="sec" id="learned" data-screen-label="What you\'ll learn"><span class="tag-o">// What you\'ll learn //</span><h2>What you\'ll learn</h2><div class="cards">' +
        learned.slice(0, 9).map(function (x, i) { return '<div class="card lc">' + tile(iconFor(x, 'bulb'), i, 18) + '<div><div class="n">' + String(i + 1).padStart(2, '0') + '</div><p style="color:#09090b;font-size:15px;margin-top:4px">' + esc(x) + '</p></div></div>'; }).join('') + '</div></section>');
    }

    H.push('</div>');

    /* ---- builder band (Primer) ---- */
    H.push('<section class="band" id="builder" data-screen-label="About the builder"><div class="in"><div><span class="tag-a">// About the builder //</span>' +
      (bio ? '<p class="q">' + esc(cut(bio, 420)) + '</p>' : '<p class="q">' + esc(builder || 'This builder') + ' built ' + esc(name) + (cohort ? ' in MyAI Community ' + esc(cohort) : '') + '.</p>') + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:20px;align-items:flex-start"><div style="display:flex;align-items:center;gap:16px">' + avatar('bv') +
      '<div><div class="nm">' + esc(builder || 'MyAI builder') + '</div><div class="rl">AI Builder · MyAI Community' + (cohort ? ' · ' + esc(cohort) : '') + '</div></div></div>' +
      '</div></div></section>');

    /* ---- more projects ---- */
    H.push('<div class="wrap">');
    /* ---- request a demo: shown once, connect with the builder on LinkedIn ---- */
    if (has.request) {
      H.push('<section class="sec" id="request" data-screen-label="Request a demo"><div class="req">' +
        '<div class="req-ill" aria-hidden="true"><span class="r1">' + ico('play', 22) + '</span><span class="r2">' + ico('chat', 22) + '</span><span class="r3">' + LI.replace('width="20" height="20"', 'width="34" height="34"') + '</span></div>' +
        '<div class="req-t"><span class="tag-a">' + ico('calendar', 13) + 'Request a demo</span><h3>' + (longName ? 'Want a demo of this project?' : 'Want a demo of ' + esc(name) + '?') + '</h3>' +
        '<p>Connect with ' + esc(builder || 'the builder') + ' on LinkedIn and ask for a walkthrough of ' + esc(name) + ' for your company.</p>' +
        '<div class="req-by">' + avatar('av') + '<span><b>' + esc(builder) + '</b>' + (cohort ? ' · ' + esc(cohort) : '') + '</span></div></div>' +
        '<a class="li big" href="' + esc(li) + '" target="_blank" rel="noopener">' + LI + '<span>Connect on LinkedIn</span></a></div></section>');
    }
    var more = Array.isArray(window.MORE_PROJECTS) ? window.MORE_PROJECTS.slice(0, 3) : PREVIEW_PROJECTS.filter(function (m) { return m.id !== p.id && (m.thumbnail_url || m.banner_url); }).slice(0, 3);
    if (more.length) {
      H.push('<section class="sec" id="more" data-screen-label="More projects"><span class="tag-o">// More projects //</span><h2>More from the community</h2><div class="mgrid">' + more.map(function (m) {
        var mn = cleanTitle(m.title).split(/\s[-–—|:]\s/)[0], mt = url(m.thumbnail_url || m.banner_url), ms = m.sections || [];
        var t10 = ms.filter(function (s) { return s.section === 'top10'; })[0], aw = ms.filter(function (s) { return s.section === 'awards' && s.award_name; })[0];
        var b = t10 ? 'Top 10' + (t10.rank && t10.rank < 999 ? ' · #' + t10.rank : '') : aw ? aw.award_name : '';
        var href = window.PROJECT ? PROJECT_PAGE + encodeURIComponent(m.id) : '?id=' + encodeURIComponent(m.id);
        return '<a class="mc" href="' + esc(href) + '"><div class="th">' + esc(mn) + (mt ? '<img src="' + esc(mt) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + (b ? '<span class="bdg">' + esc(b) + '</span>' : '') + '</div>' +
          '<div class="bd"><div class="mt">' + esc([m.project_category, cohortOf(m)].filter(Boolean).join(' · ')) + '</div><h4>' + esc(mn) + '</h4><div class="by">' + esc(m.builder_name || '') + '</div></div></a>';
      }).join('') + '</div></section>');
    }

    /* ---- footer (Primer) ---- */
    H.push('<footer data-screen-label="Footer"><hr><div class="frow"><div style="display:flex;flex-wrap:wrap;gap:6px">' +
      [cat, cohort, top10 ? 'Top 10' : '', award ? award.award_name : ''].filter(Boolean).map(function (t) { return '<span class="ftag">' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<a href="' + ALL_PROJECTS + '" style="font-size:14px;font-weight:600">All projects →</a></div>' +
      '</div></footer></div>');

    var app = document.getElementById('app');
    app.innerHTML = H.join('');

    /* ---- behaviour ---- */
    app.querySelectorAll('img[data-ini]').forEach(function (im) { im.addEventListener('error', function () { var s = document.createElement('span'); s.className = im.className; s.textContent = im.getAttribute('data-ini'); im.replaceWith(s); }); });
    var shot = app.querySelector('.shot .img');
    if (shot) shot.addEventListener('error', function () { var sh = shot.closest('.shot'); sh.className = 'shot cover'; sh.innerHTML = '<span class="m">' + esc(name.charAt(0).toUpperCase()) + '</span><b>' + esc(name) + '</b>'; });
    app.querySelectorAll('.poster img').forEach(function (im) { im.addEventListener('error', function () { im.remove(); }); });
    var poster = app.querySelector('button.poster');
    if (poster) poster.addEventListener('click', function () { var f = document.createElement('iframe'); f.src = poster.getAttribute('data-src'); f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true; f.title = name + ' demo'; poster.replaceWith(f); });
    var rateEl = app.querySelector('.rate');
    if (rateEl) {
      var rs = { up: up, down: down, mine: myVote };
      var paintRate = function () {
        rateEl.querySelectorAll('.vb').forEach(function (b) {
          var v = b.getAttribute('data-vote');
          b.setAttribute('aria-pressed', String(rs.mine === v));
          b.disabled = !!rs.mine; // one rating per visitor
          b.querySelector('b').textContent = v === 'up' ? rs.up : rs.down;
        });
        rateEl.querySelector('[data-note]').textContent = rs.mine ? 'Thanks, your rating is in.' : 'One rating per visitor.';
      };
      paintRate();
      rateEl.querySelectorAll('.vb').forEach(function (b) {
        b.addEventListener('click', function () {
          if (rs.mine) return;
          rs.mine = b.getAttribute('data-vote');
          rs[rs.mine]++;
          paintRate();
          try { if (window.top !== window) parent.postMessage({ type: 'project-vote', vote: rs.mine, on: true }, '*'); } catch (e) {}
        });
      });
    }
    app.querySelectorAll('.more-btn').forEach(function (b) { b.addEventListener('click', function () { var c = b.previousElementSibling; var open = c.classList.toggle('clamp'); b.textContent = open ? 'Read more' : 'Show less'; }); });
  }

  /* ---- load ---- */
  if (window.PROJECT) { render(window.PROJECT); return; }
  var id = new URLSearchParams(location.search).get('id');
  var cur = PREVIEW_PROJECTS.filter(function (x) { return x.id === id; })[0] || PREVIEW_PROJECTS[0];
  render(cur);
  var pk = document.createElement('div'); pk.className = 'pick';
  pk.innerHTML = '<span>Preview</span><select aria-label="Preview project">' + PREVIEW_PROJECTS.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === cur.id ? ' selected' : '') + '>' + esc(cleanTitle(x.title).split(/\s[-–—|:]\s/)[0]) + (x.builder_name ? ' · ' + esc(x.builder_name) : '') + '</option>'; }).join('') + '</select>';
  document.body.appendChild(pk);
  pk.querySelector('select').addEventListener('change', function (e) { var x = PREVIEW_PROJECTS.filter(function (y) { return y.id === e.target.value; })[0]; history.replaceState(null, '', '?id=' + x.id); render(x); window.scrollTo(0, 0); });
})();
</script>
</body>
</html>
